<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>AirFund Conviction Value Capital — Operating Memorandum (gestion)</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>

  /* ---------- tokens: light (default) ---------- */
  :root {
    --bg: #fff8f2;
    --surface: #ffffff;
    --surface-2: #f8f4ee;
    --surface-3: #f1ece5;
    --text: #1a2027;
    --text-2: #4a5c68;
    --text-3: #7b8b95;
    --line: #e6e1da;
    --line-2: #cfdbe0;
    --accent: #218e8e;
    --accent-ink: #1a7676;
    --accent-soft: #ebfcf9;
    --accent-soft-2: #d6f4f1;
    --lime: #d9f785;
    --lime-soft: #f4fdda;
    --lime-ink: #4d6b10;
    --bar: #2f4858;
    --bar-text: #fff8f2;
    --mark-bg: #d9f785;
    --mark-text: #1a2027;
    --chip-aifm-bg: #2f4858; --chip-aifm-fg: #fff8f2;
    --chip-client-bg: #ffffff; --chip-client-fg: #1a7676; --chip-client-line: #8ccfcf;
    --chip-fc-bg: #ebfcf9; --chip-fc-fg: #2f4858;
    --chip-third-bg: #f4fdda; --chip-third-fg: #2f4858;
    --chip-other-bg: #f1ece5; --chip-other-fg: #4a5c68;
    --note-bg: #f8f4ee; --note-line: #b9c6cc;
    --shadow: 0 1px 2px rgba(47, 72, 88, .08), 0 0 0 1px rgba(47, 72, 88, .04);
    --rail-w: 252px;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #1a2027; --surface: #232d35; --surface-2: #1f272e; --surface-3: #2a353e;
      --text: #eef2f1; --text-2: #b4c0c7; --text-3: #83939d;
      --line: #2f3b44; --line-2: #37484f;
      --accent: #3fb3b3; --accent-ink: #72d3d3; --accent-soft: rgba(33,142,142,.16); --accent-soft-2: rgba(33,142,142,.28);
      --lime: #d9f785; --lime-soft: rgba(217,247,133,.12); --lime-ink: #d9f785;
      --bar: #2f4858; --bar-text: #fff8f2;
      --mark-bg: #d9f785; --mark-text: #1a2027;
      --chip-aifm-bg: #3b5a6e; --chip-aifm-fg: #fff8f2;
      --chip-client-bg: transparent; --chip-client-fg: #72d3d3; --chip-client-line: #3f8f8f;
      --chip-fc-bg: rgba(33,142,142,.2); --chip-fc-fg: #e4edf0;
      --chip-third-bg: rgba(217,247,133,.16); --chip-third-fg: #e9f3d3;
      --chip-other-bg: #2a353e; --chip-other-fg: #b4c0c7;
      --note-bg: #1f272e; --note-line: #4a5c68;
      --shadow: 0 1px 2px rgba(0,0,0,.35), 0 0 0 1px rgba(255,255,255,.04);
    }
  }
  :root[data-theme="dark"] {
    --bg: #1a2027; --surface: #232d35; --surface-2: #1f272e; --surface-3: #2a353e;
    --text: #eef2f1; --text-2: #b4c0c7; --text-3: #83939d;
    --line: #2f3b44; --line-2: #37484f;
    --accent: #3fb3b3; --accent-ink: #72d3d3; --accent-soft: rgba(33,142,142,.16); --accent-soft-2: rgba(33,142,142,.28);
    --lime: #d9f785; --lime-soft: rgba(217,247,133,.12); --lime-ink: #d9f785;
    --bar: #2f4858; --bar-text: #fff8f2;
    --mark-bg: #d9f785; --mark-text: #1a2027;
    --chip-aifm-bg: #3b5a6e; --chip-aifm-fg: #fff8f2;
    --chip-client-bg: transparent; --chip-client-fg: #72d3d3; --chip-client-line: #3f8f8f;
    --chip-fc-bg: rgba(33,142,142,.2); --chip-fc-fg: #e4edf0;
    --chip-third-bg: rgba(217,247,133,.16); --chip-third-fg: #e9f3d3;
    --chip-other-bg: #2a353e; --chip-other-fg: #b4c0c7;
    --note-bg: #1f272e; --note-line: #4a5c68;
    --shadow: 0 1px 2px rgba(0,0,0,.35), 0 0 0 1px rgba(255,255,255,.04);
  }

  /* ---------- base ---------- */
  * { box-sizing: border-box; }
  html { font-size: 12px; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: Calibri, Carlito, "Segoe UI", "Helvetica Neue", Arial, sans-serif;
    font-size: 9pt; line-height: 1.45; -webkit-font-smoothing: antialiased;
  }
  a { color: var(--accent-ink); text-decoration: none; }
  a:hover { text-decoration: underline; }
  button { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  mark { background: var(--mark-bg); color: var(--mark-text); padding: 0 1px; border-radius: 2px; }
  .eyebrow { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--text-3); font-weight: 600; }
  .num { font-variant-numeric: tabular-nums; }
  .app { display: flex; flex-direction: column; min-height: 100vh; }

  /* ---------- top bar ---------- */
  .topbar {
    display: grid; grid-template-columns: auto minmax(220px, 560px) auto; align-items: center; gap: 20px;
    padding: 10px 20px; background: var(--surface); border-bottom: 1px solid var(--line);
    position: static; z-index: 30;
  }
  .pinned .topbar { position: sticky; top: 0; }
  .brand { display: flex; flex-direction: column; gap: 1px; min-width: 220px; }
  .brand .eyebrow { color: var(--accent-ink); }
  .brand .title { font-size: 17px; font-weight: 700; letter-spacing: -.01em; line-height: 1.15; color: var(--text); }
  .brand .title small { font-weight: 400; color: var(--text-2); font-size: 12px; margin-left: 8px; }
  .search { position: relative; }
  .search input {
    width: 100%; padding: 8px 64px 8px 34px; border: 1px solid var(--line-2); border-radius: 6px;
    background: var(--surface-2); color: var(--text); font: inherit; font-size: 12px;
  }
  .search input:focus { border-color: var(--accent); background: var(--surface); outline: none; box-shadow: 0 0 0 3px var(--accent-soft); }
  .search svg { position: absolute; left: 11px; top: 50%; transform: translateY(-50%); width: 14px; height: 14px; color: var(--text-3); pointer-events: none; }
  .search kbd { position: absolute; right: 10px; top: 50%; transform: translateY(-50%); font: inherit; font-size: 11px; color: var(--text-3); border: 1px solid var(--line-2); border-radius: 4px; padding: 1px 6px; background: var(--surface); }
  .search .clear { position: absolute; right: 36px; top: 50%; transform: translateY(-50%); border: 0; background: transparent; color: var(--text-3); cursor: pointer; padding: 2px 4px; display: none; }
  .search.has-q .clear { display: block; }
  .search.has-q kbd { display: none; }
  .phase { display: inline-flex; border: 1px solid var(--line-2); border-radius: 6px; overflow: hidden; background: var(--surface-2); }
  .phase button { border: 0; background: transparent; padding: 5px 12px; cursor: pointer; display: flex; flex-direction: column; align-items: flex-start; line-height: 1.2; color: var(--text-2); }
  .phase button b { font-size: 12px; color: inherit; }
  .phase button small { font-size: 11px; color: var(--text-3); }
  .phase button[aria-checked="true"] { background: var(--bar); color: var(--bar-text); }
  .phase button[aria-checked="true"] small { color: var(--lime); }
  .phase button + button { border-left: 1px solid var(--line-2); }

  .pin { border: 1px solid var(--line-2); background: var(--surface-2); border-radius: 6px; padding: 5px 10px; cursor: pointer; color: var(--text-2); display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
  .pin:hover { border-color: var(--accent); color: var(--accent-ink); }
  .pin[aria-pressed="true"] { background: var(--accent-soft-2); border-color: var(--accent); color: var(--accent-ink); }
  .pin .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--line-2); }
  .pin[aria-pressed="true"] .dot { background: var(--accent); }
  .tb-right { display: flex; gap: 8px; align-items: center; justify-content: flex-end; }
  .idchip { display: inline-flex; flex-direction: column; align-items: flex-start; line-height: 1.15; border: 1px solid var(--line-2); border-radius: 6px; padding: 4px 10px; background: var(--surface-2); color: var(--text-2); max-width: 170px; }
  .idchip:hover { text-decoration: none; border-color: var(--accent); }
  .idchip .who { font-weight: 700; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 150px; }
  .idchip .rl { font-size: 11px; color: var(--text-3); }
  .idchip.admin { border-color: var(--accent); background: var(--accent-soft); }
  .idchip.admin .rl { color: var(--accent-ink); }
  .idchip.viewer .rl { color: var(--text-3); }

  /* ---------- cross-cutting views ---------- */
  .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 8px; margin: 0 0 18px; }
  .cards a.pc { display: block; padding: 9px 11px; border: 1px solid var(--line); border-radius: 6px; background: var(--surface-2); color: inherit; }
  .cards a.pc:hover { border-color: var(--accent); background: var(--accent-soft); text-decoration: none; }
  .cards a.pc.on { border-color: var(--accent); background: var(--accent-soft); box-shadow: inset 0 0 0 1px var(--accent); }
  .cards a.pc .n { font-size: 17px; font-weight: 700; color: var(--accent-ink); font-variant-numeric: tabular-nums; line-height: 1.1; }
  .cards a.pc .l { display: block; margin-top: 2px; font-weight: 600; }
  .cards a.pc .s { display: block; color: var(--text-3); font-size: 11px; }
  .cards a.pc.muted { opacity: .7; }
  .rollup { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 0 0 18px; }
  .rollup > div { padding: 10px 12px; border-radius: 6px; border: 1px solid var(--line); background: var(--surface); }
  .rollup .n { font-size: 17px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .rollup .fc .n { color: var(--accent-ink); }
  .rollup .al { border-color: var(--lime); }
  .rollup .al .n { color: var(--lime-ink); }
  .rollup .s { color: var(--text-2); font-size: 11.5px; }
  .xlist .hd, .xlist .row { display: grid; grid-template-columns: 150px 46px minmax(0, 1fr) 160px 200px; gap: 0 14px; align-items: start; }
  .xlist { border-top: 2px solid var(--accent); }
  .xlist .hd { padding: 7px 8px; border-bottom: 1px solid var(--line-2); }
  .xlist .hd span { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--accent-ink); font-weight: 700; }
  .xlist .row { padding: 9px 8px; border-bottom: 1px solid var(--line); }
  .xlist .row:hover { background: var(--surface-2); }
  .xlist .row .tab a { font-weight: 600; }
  .xlist .row .tab small { display: block; color: var(--text-3); font-size: 11px; }
  .xlist .row .no { color: var(--accent-ink); font-weight: 700; font-variant-numeric: tabular-nums; }
  .xlist .row .no a { color: inherit; }
  .xlist .row .tl { font-variant-numeric: tabular-nums; }
  .xlist .row .txt { min-width: 0; max-width: 100ch; }
  .xlist .row .rp { display: flex; flex-wrap: wrap; gap: 4px; }
  .grp-bar { display: flex; align-items: center; gap: 10px; margin: 22px 0 8px; }
  .grp-bar h3 { margin: 0; font-size: 13px; }
  .grp-bar .cnt { color: var(--text-3); font-size: 11.5px; }
  .grp-bar .why { color: var(--text-2); font-size: 11.5px; margin-left: 6px; }
  .pill.marker { background: var(--lime-soft); color: var(--lime-ink); border: 1px solid var(--lime); }
  @media (max-width: 820px) { .xlist .hd { display: none; } .xlist .row { grid-template-columns: 1fr; gap: 4px; } .rollup { grid-template-columns: 1fr; } }

  /* ---------- editable tracker ---------- */
  :root { --warn: #b3412a; --warn-soft: #fbe9e3; --ok: #1a7676; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --warn: #ff9f85; --warn-soft: rgba(255,159,133,.14); --ok: #72d3d3; } }
  :root[data-theme="dark"] { --warn: #ff9f85; --warn-soft: rgba(255,159,133,.14); --ok: #72d3d3; }
  .chip.status.ip { background: var(--lime-soft); color: var(--lime-ink); border-color: var(--lime); }
  .chip.status.dn { background: var(--accent-soft-2); color: var(--accent-ink); }
  .chip.status.bl { background: var(--warn-soft); color: var(--warn); }
  .chip.status.na { opacity: .65; }
  .edited { position: relative; }
  .edited::after { content: ""; display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: var(--accent); margin-left: 5px; vertical-align: middle; }
  .savebar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; padding: 9px 12px; margin: 10px 0; border: 1px solid var(--line-2); border-radius: 6px; background: var(--surface); }
  .savebar.local { border-color: var(--lime); background: var(--lime-soft); }
  .savebar.shared { border-color: var(--accent); background: var(--accent-soft); }
  .savebar.readonly { background: var(--surface-2); }
  .savebar .mode { font-weight: 700; }
  .savebar .hint2 { color: var(--text-2); font-size: 11.5px; max-width: 60ch; }
  .savebar .grow { flex: 1; }
  .savebar button { font: inherit; border: 1px solid var(--line-2); background: var(--surface); border-radius: 4px; padding: 4px 10px; cursor: pointer; color: var(--text); }
  .savebar button:hover { border-color: var(--accent); color: var(--accent-ink); }
  .savebar button[disabled] { opacity: .5; cursor: default; }
  .savebar button.primary { background: var(--bar); color: var(--bar-text); border-color: var(--bar); font-weight: 600; }
  .savebar button.primary:hover { color: var(--bar-text); border-color: var(--accent); }
  .savebar button.danger { color: var(--warn); }
  .savebar input[type="text"] { font: inherit; padding: 4px 8px; border: 1px solid var(--line-2); border-radius: 4px; background: var(--surface); color: var(--text); width: 150px; }
  .savebar .count { font-weight: 700; color: var(--accent-ink); font-variant-numeric: tabular-nums; }
  .savebar .notice { color: var(--warn); font-weight: 600; width: 100%; }
  .savebar .notice.ok { color: var(--ok); }
  .tracker .row.dirty { background: var(--lime-soft); }
  .tracker select, .tracker input[type="text"], .tracker textarea { font: inherit; font-size: 12px; width: 100%; padding: 3px 6px; border: 1px solid var(--line-2); border-radius: 4px; background: var(--surface); color: var(--text); }
  .tracker textarea { min-height: 42px; resize: vertical; }
  .tracker select:focus, .tracker input:focus, .tracker textarea:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-soft-2); }
  .statsum { display: inline-flex; flex-wrap: wrap; gap: 6px; }
  .journal .row { display: grid; grid-template-columns: 130px 110px 56px minmax(0, 1fr) 110px minmax(0, 1fr); gap: 0 12px; padding: 7px 10px; border-bottom: 1px solid var(--line); }
  .journal .hd { display: grid; grid-template-columns: 130px 110px 56px minmax(0, 1fr) 110px minmax(0, 1fr); gap: 0 12px; padding: 6px 10px; }
  .journal .hd span { font-size: 10.5px; text-transform: uppercase; letter-spacing: .06em; color: var(--accent-ink); font-weight: 700; }
  .journal { border-top: 2px solid var(--accent); }
  .journal .from { color: var(--text-3); text-decoration: line-through; }
  .journal .to { font-weight: 600; }
  .journal-wrap { overflow-x: auto; }
  .journal-wrap > .journal { min-width: 820px; }
  @media print { .savebar { display: none !important; } }

  /* ---------- calendar planner ---------- */
  .pbs { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 8px; }
  .pbs a.pb { display: grid; grid-template-columns: 30px 1fr; gap: 8px; align-items: start; padding: 9px 11px; border: 1px solid var(--line); border-radius: 6px; background: var(--surface-2); color: inherit; }
  .pbs a.pb:hover { border-color: var(--accent); background: var(--accent-soft); text-decoration: none; }
  .pbs a.pb.on { border-color: var(--accent); background: var(--accent-soft); box-shadow: inset 0 0 0 1px var(--accent); }
  .pbs a.pb .ic { width: 26px; height: 26px; border-radius: 6px; background: var(--bar); color: var(--bar-text); display: inline-flex; align-items: center; justify-content: center; font-weight: 700; }
  .pbs a.pb .s { display: block; color: var(--text-3); font-size: 11px; }
  .pbdesc { margin: 16px 0 8px; color: var(--text-2); max-width: 100ch; }
  .pform { display: flex; flex-wrap: wrap; gap: 10px 22px; margin: 6px 0 10px; }
  .pfield { display: flex; flex-direction: column; gap: 3px; }
  .pfield em { font-style: normal; text-transform: none; letter-spacing: 0; color: var(--text-3); font-weight: 400; }
  .pfield input { font: inherit; padding: 5px 8px; border: 1px solid var(--line-2); border-radius: 4px; background: var(--surface); color: var(--text); min-width: 180px; }
  .pfield input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-soft-2); }
  .pfield small { color: var(--text-3); font-size: 11px; max-width: 34ch; }
  .flagbox { border-left: 3px solid var(--warn); padding-left: 10px; color: var(--warn); }
  .anchors-line { margin: 4px 0 10px; display: flex; flex-wrap: wrap; gap: 6px; }
  .sched { border-top: 2px solid var(--accent); }
  .sched .hd, .sched .row { display: grid; grid-template-columns: 170px 210px 46px minmax(0, 1fr) 190px; gap: 0 12px; align-items: start; }
  .sched .hd { padding: 7px 8px; border-bottom: 1px solid var(--line-2); }
  .sched .hd span { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--accent-ink); font-weight: 700; }
  .sched .row { padding: 8px; border-bottom: 1px solid var(--line); scroll-margin-top: 14px; }
  .sched .row:hover { background: var(--surface-2); }
  .sched .row.past { opacity: .62; }
  .sched .row.next { background: var(--lime-soft); box-shadow: inset 3px 0 0 var(--lime); }
  .sched .row.cond { background: var(--surface-2); }
  .sched .row.subhead { grid-template-columns: 1fr; padding: 14px 8px 6px; }
  .sched .row.undated .d .muted { color: var(--text-3); font-style: italic; }
  .sched .d { font-variant-numeric: tabular-nums; }
  .sched .d .to { color: var(--text-2); }
  .sched .tl small { color: var(--text-2); }
  .sched .flag { color: var(--warn); }
  .sched .no { color: var(--accent-ink); font-weight: 700; font-variant-numeric: tabular-nums; }
  .sched .no a { color: inherit; }
  .sched .txt .more { color: var(--text-2); font-size: 11.5px; max-width: 90ch; }
  .sched .txt .more .para { margin-bottom: 2px; }
  .sched .txt .src { color: var(--text-3); }
  .sched .rp { display: flex; flex-wrap: wrap; gap: 4px; }
  .sched.merged .hd, .sched.merged .row { grid-template-columns: 170px 220px 46px minmax(0, 1fr) 190px; }
  .cals { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 14px; margin: 10px 0 16px; }
  .cal { border: 1px solid var(--line); border-radius: 6px; background: var(--surface); overflow: hidden; }
  .cal-h { background: var(--bar); color: var(--bar-text); padding: 5px 10px; font-weight: 700; }
  .cal-g { display: grid; grid-template-columns: repeat(7, 1fr); gap: 1px; background: var(--line); }
  .cal-dow { background: var(--surface-2); color: var(--text-3); font-size: 10.5px; text-transform: uppercase; letter-spacing: .06em; text-align: center; padding: 3px 0; font-weight: 700; }
  .cal-c { background: var(--surface); min-height: 54px; padding: 3px 4px; font-size: 11px; }
  .cal-c.empty { background: var(--surface-2); }
  .cal-c.off { background: var(--surface-2); }
  .cal-c.off .cal-d { color: var(--text-3); }
  .cal-c.today .cal-d { background: var(--accent); color: #fff; border-radius: 10px; display: inline-block; padding: 0 5px; }
  .cal-d { font-weight: 700; font-variant-numeric: tabular-nums; color: var(--text-2); }
  .cal-m { display: block; margin-top: 2px; padding: 1px 4px; border-radius: 3px; font-size: 10.5px; line-height: 1.3; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: inherit; text-decoration: none; }
  .cal-m.aifm { background: var(--chip-aifm-bg); color: var(--chip-aifm-fg); }
  .cal-m.client { background: var(--chip-client-bg); color: var(--chip-client-fg); border: 1px solid var(--chip-client-line); }
  .cal-m.fc { background: var(--chip-fc-bg); color: var(--chip-fc-fg); }
  .cal-m.third { background: var(--chip-third-bg); color: var(--chip-third-fg); }
  .cal-m.other { background: var(--chip-other-bg); color: var(--chip-other-fg); }
  .cal-m:hover { text-decoration: none; outline: 1px solid var(--accent); }
  .cal-more { color: var(--text-3); font-size: 10px; }
  h3.sub2 { margin: 18px 0 8px; font-size: 13px; display: flex; align-items: baseline; gap: 8px; }
  h3.sub2 .cnt { color: var(--text-3); font-size: 11.5px; font-weight: 400; }
  table.tbl.evs tr.on td { background: var(--accent-soft); }
  button.mini { font: inherit; font-size: 11px; padding: 2px 8px; border: 1px solid var(--line-2); border-radius: 4px; background: var(--surface); cursor: pointer; color: var(--text); }
  button.mini:hover { border-color: var(--accent); color: var(--accent-ink); }
  button.mini.danger { color: var(--warn); }
  .plan-link { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--accent); color: var(--accent-ink); border-radius: 4px; padding: 3px 9px; font-size: 11.5px; }
  .plan-link:hover { background: var(--accent-soft); text-decoration: none; }
  .tabhead .links { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .muted { color: var(--text-3); }
  @media (max-width: 820px) { .sched .hd { display: none; } .sched .row, .sched.merged .row { grid-template-columns: 1fr; gap: 4px; } .cals { grid-template-columns: 1fr; } }
  @media print { .pbs, .pform, .savebar { display: none !important; } }

  .dcell { display: none; }
  .dcell.on { display: block; margin-bottom: 3px; color: var(--accent-ink); }
  .dcell.on b { font-weight: 700; }
  .dcell.on small { display: block; color: var(--text-3); font-weight: 400; }
  .dcell.on small.flag { color: var(--warn); }
  .dcell.on .to { color: var(--text-2); font-weight: 400; }
  .planbar { border: 1px solid var(--accent); border-radius: 6px; background: var(--accent-soft); padding: 10px 12px; margin: 0 0 18px; }
  .planbar .pb-head { display: flex; flex-wrap: wrap; gap: 4px 14px; align-items: baseline; margin-bottom: 4px; }
  .planbar .pb-head .eyebrow { color: var(--accent-ink); }
  .planbar .hint2 { color: var(--text-2); font-size: 11.5px; }
  .planbar .pb-row { display: flex; flex-wrap: wrap; gap: 6px 18px; align-items: flex-end; padding: 6px 0; border-top: 1px solid var(--line-2); }
  .planbar .pb-row:first-of-type { border-top: 0; }
  .planbar .pb-name { display: flex; align-items: center; gap: 8px; min-width: 220px; padding-bottom: 6px; }
  .planbar .pb-name .ic { width: 22px; height: 22px; border-radius: 5px; background: var(--bar); color: var(--bar-text); display: inline-flex; align-items: center; justify-content: center; font-weight: 700; font-size: 11px; }
  .planbar .pform { margin: 0; gap: 6px 14px; }
  .planbar .pform.compact .pfield input, .planbar .pform.compact .pfield select { min-width: 0; padding: 4px 6px; }
  .planbar .pb-actions { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; padding-bottom: 6px; margin-left: auto; }
  .planbar .pb-sum { color: var(--text-2); font-size: 11.5px; }
  .pin-row { display: inline-flex; gap: 6px; align-items: center; }
  .pfield select { font: inherit; padding: 5px 6px; border: 1px solid var(--line-2); border-radius: 4px; background: var(--surface); color: var(--text); }
  @media (max-width: 820px) { .planbar .pb-actions { margin-left: 0; } }

  /* ---------- phase strip ---------- */
  .strip { position: static; z-index: 25; background: var(--accent-soft); border-bottom: 1px solid var(--line); padding: 6px 20px; display: flex; flex-wrap: wrap; gap: 6px 18px; align-items: center; font-size: 11.5px; color: var(--text-2); }
  .pinned .strip { position: sticky; top: var(--top-h, 57px); }
  .strip .lead { color: var(--text); font-weight: 600; }
  .strip .role { display: inline-flex; align-items: baseline; gap: 5px; }
  .strip .role b { color: var(--text); font-weight: 600; }
  .strip .role span { color: var(--text-2); }
  .strip .role .na { color: var(--text-3); font-style: italic; }

  /* ---------- frame ---------- */
  .frame { display: flex; flex: 1; min-height: 0; }
  .rail {
    width: var(--rail-w); flex: none; background: var(--surface-2); border-right: 1px solid var(--line);
    position: static; align-self: stretch; padding: 10px 0 24px;
  }
  .pinned .rail { position: sticky; top: var(--hdr-h, 97px); align-self: flex-start; height: calc(100vh - var(--hdr-h, 97px)); overflow-y: auto; }
  .rail .grp { padding: 12px 14px 4px; }
  .rail .grp .eyebrow { font-size: 10.5px; }
  .rail a.item {
    display: grid; grid-template-columns: 22px 1fr auto; align-items: center; gap: 6px;
    padding: 5px 14px 5px 12px; color: var(--text); border-left: 3px solid transparent; font-size: 12px;
  }
  .rail a.item:hover { background: var(--accent-soft); text-decoration: none; }
  .rail a.item.active { background: var(--surface); border-left-color: var(--accent); color: var(--accent-ink); font-weight: 600; }
  .rail a.item .idx { color: var(--text-3); font-size: 11px; font-variant-numeric: tabular-nums; }
  .rail a.item.active .idx { color: var(--accent-ink); }
  .rail a.item .badges { display: inline-flex; gap: 4px; }
  .pill { display: inline-block; font-size: 10.5px; line-height: 1; padding: 3px 6px; border-radius: 10px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .pill.hits { background: var(--lime); color: #1a2027; }
  .pill.p2 { background: transparent; color: var(--text-3); border: 1px solid var(--line-2); }
  .phase-2 .pill.p2 { background: var(--lime-soft); color: var(--lime-ink); border-color: var(--lime); }
  .rail a.item.overview { margin: 0 0 4px; }
  .rail .hint { padding: 14px 14px 0; color: var(--text-3); font-size: 11px; line-height: 1.5; }
  .rail .hint kbd { font: inherit; border: 1px solid var(--line-2); border-radius: 3px; padding: 0 4px; background: var(--surface); }

  .content { flex: 1; min-width: 0; padding: 22px 32px 64px; max-width: 1240px; }

  /* ---------- tab header ---------- */
  .tabhead { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 8px 20px; margin: 0 0 18px; padding-bottom: 12px; border-bottom: 1px solid var(--line); }
  .tabhead h1 { margin: 2px 0 0; font-size: 18px; font-weight: 700; letter-spacing: -.01em; text-wrap: balance; }
  .tabhead .desc { color: var(--text-2); max-width: 70ch; margin-top: 3px; }
  .tabhead .meta { display: flex; gap: 14px; color: var(--text-3); font-size: 11.5px; white-space: nowrap; }

  /* filter bar (search in context) */
  .filterbar { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; padding: 8px 12px; margin: 0 0 14px; background: var(--lime-soft); border: 1px solid var(--lime); border-radius: 6px; }
  .filterbar b { font-weight: 700; }
  .filterbar button { border: 1px solid var(--line-2); background: var(--surface); border-radius: 4px; padding: 3px 8px; cursor: pointer; font-size: 11.5px; }
  .filterbar button:hover { border-color: var(--accent); color: var(--accent-ink); }

  /* ---------- section bars ---------- */
  .section { margin: 0 0 26px; }
  .bar { display: flex; align-items: center; justify-content: space-between; gap: 12px; background: var(--bar); color: var(--bar-text); padding: 6px 12px; border-radius: 4px; font-size: 12.5px; font-weight: 600; }
  .bar .count { font-weight: 400; opacity: .8; font-size: 11px; white-space: nowrap; }
  .lead-p { color: var(--text-2); margin: 8px 2px 4px; max-width: 90ch; }
  .lead-p.p2flag { border-left: 3px solid var(--lime); padding-left: 10px; }
  h3.sub { margin: 18px 0 8px; font-size: 13px; font-weight: 700; color: var(--text); }
  .src-note { color: var(--text-3); font-size: 11px; margin: 6px 2px 0; font-style: italic; }

  /* ---------- task tables (grid) ---------- */
  .tt { border-top: 2px solid var(--accent); }
  .tt .hd, .tt .row { display: grid; grid-template-columns: 46px minmax(0, 1fr) 170px 212px; gap: 0 14px; align-items: start; }
  .tt.c3 .hd, .tt.c3 .row { grid-template-columns: 46px minmax(0, 1fr) 212px; }
  .tt .hd { padding: 7px 8px; border-bottom: 1px solid var(--line-2); }
  .tt .hd span { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--accent-ink); font-weight: 700; }
  .tt .row { padding: 9px 8px; border-bottom: 1px solid var(--line); scroll-margin-top: calc(var(--hdr-h, 97px) + 14px); }
  .tt .row:hover { background: var(--surface-2); }
  .tt .row.flash { animation: flash 2.4s ease-out; }
  .tt .no { color: var(--accent-ink); font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .tt .no a { color: inherit; }
  .tt .no small { color: var(--text-3); font-weight: 400; }
  .tt .txt { min-width: 0; }
  .tt .tl { color: var(--text); font-variant-numeric: tabular-nums; }
  .tt .rp { min-width: 0; }
  .tt .row.note, .tt .row.subhead, .tt .row.para { grid-template-columns: 1fr; }
  .tt .row.subhead { padding: 14px 8px 6px; border-bottom: 1px solid var(--line-2); }
  .tt .row.subhead .eyebrow { color: var(--text-2); }
  .tt .row.note { background: var(--note-bg); border-left: 3px solid var(--note-line); }
  .tt .row.note .body, .tt .row.para .body { max-width: 100ch; }
  .tt .row.note .meta { display: flex; gap: 8px; align-items: center; margin-bottom: 3px; }
  .tt .row.para .body { padding: 2px 0; }
  .tt .row.p2only { background: var(--lime-soft); border-left: 3px solid var(--lime); }
  .para { margin: 0 0 6px; }
  .para:last-child { margin-bottom: 0; }
  .para ul { margin: 3px 0 3px 16px; padding: 0; }
  .para li { margin: 1px 0; }
  .lbl { font-weight: 700; color: var(--text); }
  .lbl.p1 { color: var(--accent-ink); }
  .lbl.p2 { color: var(--lime-ink); }

  /* PHASE 2 callout inside an entry */
  .p2c { margin: 8px 0 2px; padding: 7px 10px 7px 12px; border-left: 3px solid var(--line-2); background: var(--surface-2); border-radius: 0 4px 4px 0; max-width: 100ch; }
  .p2c .tag { display: inline-flex; align-items: center; gap: 6px; margin-bottom: 3px; }
  .p2c .tag .eyebrow { color: var(--text-2); }
  .p2c .tag .state { font-size: 10.5px; color: var(--text-3); border: 1px solid var(--line-2); border-radius: 10px; padding: 1px 7px; }
  .phase-2 .p2c { border-left-color: var(--lime); background: var(--lime-soft); }
  .phase-2 .p2c .tag .eyebrow { color: var(--lime-ink); }
  .phase-2 .p2c .tag .state { background: var(--lime); color: #1a2027; border-color: var(--lime); }

  /* banner */
  .banner { display: flex; gap: 12px; align-items: flex-start; padding: 10px 14px; border-radius: 6px; margin: 0 0 18px; background: var(--surface-2); border: 1px solid var(--line-2); }
  .banner .eyebrow { white-space: nowrap; margin-top: 2px; color: var(--text-2); }
  .phase-2 .banner { background: var(--lime-soft); border-color: var(--lime); }
  .phase-2 .banner .eyebrow { color: var(--lime-ink); }
  .note-block { padding: 10px 14px; border-left: 3px solid var(--note-line); background: var(--note-bg); border-radius: 0 6px 6px 0; margin: 0 0 18px; max-width: 100ch; }
  .note-block .eyebrow { margin-bottom: 3px; display: block; }

  /* chips */
  .chip { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 11.5px; line-height: 1.35; border: 1px solid transparent; max-width: 100%; }
  .chip.aifm { background: var(--chip-aifm-bg); color: var(--chip-aifm-fg); }
  .chip.client { background: var(--chip-client-bg); color: var(--chip-client-fg); border-color: var(--chip-client-line); }
  .chip.fc { background: var(--chip-fc-bg); color: var(--chip-fc-fg); }
  .chip.third { background: var(--chip-third-bg); color: var(--chip-third-fg); }
  .chip.other { background: var(--chip-other-bg); color: var(--chip-other-fg); }
  .chip.res { background: var(--lime-soft); color: var(--lime-ink); border-color: var(--lime); font-weight: 600; }
  .rp { display: flex; flex-wrap: wrap; gap: 4px; }
  .chip.status { background: var(--chip-other-bg); color: var(--chip-other-fg); font-size: 11px; }

  /* ---------- generic tables ---------- */
  .tbl-wrap { overflow-x: auto; }
  table.tbl { width: 100%; border-collapse: collapse; border-top: 2px solid var(--accent); }
  table.tbl th { text-align: left; font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--accent-ink); font-weight: 700; padding: 7px 8px; border-bottom: 1px solid var(--line-2); vertical-align: bottom; }
  table.tbl td { padding: 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
  table.tbl tr:hover td { background: var(--surface-2); }
  table.tbl td:first-child { font-weight: 700; color: var(--text); }
  table.tbl tr.flash td { animation: flash 2.4s ease-out; }
  table.tbl tr { scroll-margin-top: 110px; }
  table.tbl.phasemap td.on { background: var(--lime-soft); box-shadow: inset 3px 0 0 var(--lime); }
  table.tbl.phasemap th.on { color: var(--lime-ink); }
  table.tbl.matrix td { font-size: 11.5px; }
  table.tbl.glossary td:first-child { white-space: nowrap; width: 180px; }
  .tools { display: flex; gap: 8px; align-items: center; justify-content: flex-end; margin: 8px 0; }
  .tools button { border: 1px solid var(--line-2); background: var(--surface); border-radius: 4px; padding: 3px 9px; cursor: pointer; font-size: 11.5px; color: var(--text-2); white-space: nowrap; }
  .tools button[aria-pressed="true"] { background: var(--bar); color: var(--bar-text); border-color: var(--bar); }

  /* kv / facts */
  .kv { display: grid; grid-template-columns: 220px 1fr; gap: 0; border-top: 2px solid var(--accent); }
  .kv > div { padding: 9px 8px; border-bottom: 1px solid var(--line); }
  .kv .k { font-weight: 700; }
  .kv .v { max-width: 100ch; }
  .facts { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 10px 18px; }
  .facts > div { padding: 8px 10px; background: var(--surface); border: 1px solid var(--line); border-radius: 6px; box-shadow: var(--shadow); }
  .facts .k { font-size: 10.5px; text-transform: uppercase; letter-spacing: .06em; color: var(--text-3); font-weight: 700; }
  .facts .v { margin-top: 2px; }

  /* numbered items */
  .numbered .it { display: grid; grid-template-columns: 40px 1fr; gap: 12px; padding: 10px 8px; border-bottom: 1px solid var(--line); scroll-margin-top: 110px; }
  .numbered .it:hover { background: var(--surface-2); }
  .numbered .it .n { font-weight: 700; color: var(--accent-ink); font-variant-numeric: tabular-nums; }
  .numbered .it .body { max-width: 100ch; }
  .numbered { border-top: 2px solid var(--accent); }

  /* topics (communication) */
  .topics .it { display: grid; grid-template-columns: minmax(200px, 2fr) 3fr; gap: 18px; padding: 12px 8px; border-bottom: 1px solid var(--line); scroll-margin-top: 110px; }
  .topics { border-top: 2px solid var(--accent); }
  .topics .it:hover { background: var(--surface-2); }
  .topics .it h4 { margin: 0 0 3px; font-size: 12.5px; }
  .topics .it .lead { color: var(--text-2); }

  /* prose */
  .prose { max-width: 80ch; }
  .prose .para { margin-bottom: 8px; }
  .prose .para.flash { animation: flash 2.4s ease-out; }
  .prose h3 { margin: 0 0 8px; font-size: 13px; }

  /* signature */
  .sig { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 16px; }
  .sig .party { background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 12px 14px; box-shadow: var(--shadow); }
  .sig .party .on { font-weight: 700; margin-bottom: 14px; }
  .sig .line { border-top: 1px solid var(--text-3); padding-top: 6px; margin-top: 26px; color: var(--text-2); }
  .sig .line b { color: var(--text); }

  /* tracker */
  .tracker .g { margin: 14px 0 0; }
  .tracker .gbar { display: flex; align-items: center; gap: 10px; background: var(--surface-3); padding: 6px 10px; border-radius: 4px; font-weight: 700; }
  .tracker .gbar .id { color: var(--accent-ink); font-variant-numeric: tabular-nums; min-width: 24px; }
  .tracker .gbar .lead { margin-left: auto; font-weight: 400; color: var(--text-2); font-size: 11.5px; }
  .tracker .hd, .tracker .row { display: grid; grid-template-columns: 56px minmax(0, 1.6fr) 150px minmax(0, 1fr) 130px 90px 90px; gap: 0 12px; align-items: start; }
  .tracker .hd { padding: 6px 10px; }
  .tracker .hd span { font-size: 10.5px; text-transform: uppercase; letter-spacing: .06em; color: var(--accent-ink); font-weight: 700; }
  .tracker .row { padding: 7px 10px; border-bottom: 1px solid var(--line); scroll-margin-top: 110px; }
  .tracker .row:hover { background: var(--surface-2); }
  .tracker .row.flash { animation: flash 2.4s ease-out; }
  .tracker .row .id { color: var(--accent-ink); font-weight: 700; font-variant-numeric: tabular-nums; }
  .tracker .row .dim { color: var(--text-2); }
  .tracker-wrap { overflow-x: auto; }
  .tracker-wrap > .tracker { min-width: 960px; }

  /* checklist */
  .check { border-top: 2px solid var(--accent); }
  .check .hd { display: grid; grid-template-columns: 180px 1fr; gap: 14px; padding: 7px 8px; border-bottom: 1px solid var(--line-2); }
  .check .hd span { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--accent-ink); font-weight: 700; }
  .check .g { display: grid; grid-template-columns: 180px 1fr; gap: 14px; padding: 8px; border-bottom: 1px solid var(--line); scroll-margin-top: 110px; }
  .check .g:hover { background: var(--surface-2); }
  .check .g .t { font-weight: 700; }
  .check .g ul { margin: 0; padding-left: 16px; max-width: 100ch; }
  .check .g li { margin: 2px 0; }
  .check .subtitle { margin: 10px 2px 8px; color: var(--text-2); max-width: 100ch; }

  /* principles */
  .principles { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 14px; }
  .principles .g { background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 12px 14px; box-shadow: var(--shadow); scroll-margin-top: 110px; }
  .principles .g h4 { margin: 0 0 6px; font-size: 12.5px; color: var(--accent-ink); }
  .principles .g p { margin: 0 0 6px; }
  .principles .g ul { margin: 0 0 6px 16px; padding: 0; }
  .list-block ul { columns: 2; margin: 6px 0 8px 16px; padding: 0; max-width: 60ch; }
  .list-block li { margin: 1px 0; break-inside: avoid; }

  /* search results */
  .results .grp { margin: 0 0 20px; }
  .results .grp h3 { margin: 0 0 4px; font-size: 13px; display: flex; align-items: baseline; gap: 8px; }
  .results .grp h3 .idx { color: var(--text-3); font-weight: 400; font-size: 11px; font-variant-numeric: tabular-nums; }
  .results .hit { display: grid; grid-template-columns: 170px 1fr; gap: 14px; padding: 8px 10px; border-left: 3px solid transparent; border-bottom: 1px solid var(--line); cursor: pointer; }
  .results .hit:hover { background: var(--surface-2); border-left-color: var(--accent); }
  .results .hit .lbl2 { font-weight: 700; color: var(--accent-ink); }
  .results .hit .lbl2 small { display: block; font-weight: 400; color: var(--text-3); }
  .results .hit .snip { color: var(--text); }
  .results .more { margin: 6px 0 0 10px; font-size: 11.5px; }
  .results .empty { padding: 30px 0; color: var(--text-2); max-width: 60ch; }
  .results .summary { color: var(--text-2); margin: 0 0 16px; }

  /* ---------- overview ---------- */
  .ov-grid { display: grid; grid-template-columns: 1fr; gap: 22px; }
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 16px 18px; box-shadow: var(--shadow); }
  .card h2 { margin: 0 0 4px; font-size: 14px; letter-spacing: -.005em; }
  .card .sub { color: var(--text-2); margin: 0 0 12px; max-width: 90ch; }
  .card .srcline { color: var(--text-3); font-size: 11px; margin-top: 10px; }
  .ident { display: grid; grid-template-columns: minmax(280px, 1.2fr) 2fr; gap: 20px 28px; }
  .ident .name { font-size: 22px; font-weight: 700; letter-spacing: -.015em; line-height: 1.1; margin: 4px 0 6px; }
  .ident .name small { display: block; font-size: 12px; color: var(--text-2); font-weight: 400; letter-spacing: 0; margin-top: 4px; }
  .ident .fundtext { color: var(--text-2); max-width: 60ch; }
  .ident .parties { margin-top: 14px; display: grid; gap: 6px; }
  .ident .parties div { display: grid; grid-template-columns: 150px 1fr; gap: 10px; }
  .ident .parties .k { color: var(--text-3); font-size: 11px; text-transform: uppercase; letter-spacing: .06em; font-weight: 700; padding-top: 2px; }
  .kt { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 10px; }
  .kt a.k { display: block; padding: 9px 11px; border: 1px solid var(--line); border-radius: 6px; background: var(--surface-2); color: inherit; }
  .kt a.k:hover { border-color: var(--accent); text-decoration: none; background: var(--accent-soft); }
  .kt a.k .eyebrow { font-size: 10.5px; }
  .kt a.k .v { font-weight: 700; margin: 2px 0 3px; font-variant-numeric: tabular-nums; }
  .kt a.k .s { font-size: 11px; color: var(--accent-ink); }
  .kt-grp { margin: 14px 0 0; }
  .kt-grp:first-child { margin-top: 0; }
  .kt-grp h3 { margin: 0 0 8px; font-size: 12px; color: var(--text-2); font-weight: 700; }
  .dir { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 10px; }
  .dir a.d { display: grid; grid-template-columns: 26px 1fr; gap: 8px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 6px; background: var(--surface-2); color: inherit; }
  .dir a.d:hover { border-color: var(--accent); text-decoration: none; background: var(--accent-soft); }
  .dir a.d .idx { color: var(--text-3); font-variant-numeric: tabular-nums; font-size: 11px; padding-top: 2px; }
  .dir a.d b { display: block; }
  .dir a.d span { color: var(--text-2); font-size: 11.5px; }
  .dir a.d .cnt { color: var(--text-3); font-size: 11px; margin-top: 4px; display: flex; gap: 8px; }
  .two { display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 7fr); gap: 22px; }
  .roles-now { display: grid; gap: 6px; margin-top: 8px; }

 M$ avec une **décote de 12 %** sur la valeur liquidative de référence, apporté par tranches, le cédant restant investi sous lock-up. L'exposition est donc diversifiée malgré son origine dans une transaction unique : le risque résiduel est de valorisation et de contrepartie sur une opération, non de concentration d'actifs. L'apport progressif triplera la taille du compartiment en dix mois, ce qui diluera la quote-part du Fonds et modifiera substantiellement la composition du portefeuille.","Le Fonds représente environ **0,6 %** du compartiment : une demande portant sur la totalité de sa position resterait très en deçà du plafond trimestriel de 5 %. La contrainte de liquidité est un risque de **rachats corrélés** sur le passif du compartiment, non un risque de taille propre."],"allocation":"69,77 %"}]},{"type":"table","title":"Ce que montrent les reportings mensuels de CVC — au 31 juillet 2026","columns":["Élément","CVC-PE","CVC-PESEC","Lecture pour le Fonds"],"rows":[["Actif net","1,94 Md€ (1,63 Md€ fin juin)","1,08 Md$ (708 M$ fin juin)","La position du Fonds représente 0,09 % et 0,4 % : aucune contrainte de capacité, ni à la souscription ni au rachat ; la quote-part se dilue au rythme de la collecte."],["Ancienneté","Lancé le 20 février 2025 — dix-sept mois","Lancé le 1er avril 2026 — quatre mois","69,77 % de l'Actif Net est investi dans un compartiment de quatre mois d'existence au 31 juillet 2026."],["Sociétés en transparence","114 (117 fin avril)","Plus de 950 (700+ fin juin)","Plus de 1 060 sociétés cumulées : la concentration du Fonds est une concentration de gérant, pas de portefeuille."],["Première ligne / dix premières","Non publié","7,8 % / 38,0 % du portefeuille","Soit 5,4 % de l'Actif Net du Fonds pour la première ligne (General Atlantic Partners (Bermuda) IV) et 26,5 % pour les dix premières, contre 30,9 % fin juin : la montée en charge dilue la concentration."],["Zones","Europe 53 %, Amériques 29 %, mondial 12 %, Asie-Pacifique 4 %, reste 2 %","Amériq
