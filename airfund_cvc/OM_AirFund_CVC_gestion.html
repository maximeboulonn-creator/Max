roved_by":"Société de Gestion","filed_to":"Distributeurs, Distributeur Global","language":"en","internal_only":false,"note":"EMT V4.3 du 15 juillet 2026 au dossier, transmis aux Distributeurs dès le lancement du Fonds. Les diffusions suivantes sont trimestrielles. L'EET n'est pas requis : le Fonds relève de l'article 6 SFDR."},{"id":"fps-declaration","type":"Déclaration du FPS à l'AMF","scope":"fonds","frequency":"ponctuel","due_rule":{"anchor":"CONST","offset":1,"unit":"month","source":"Art. L. 214-153-1 du CMF ; Instruction AMF DOC-2012-06 — au plus tard un mois après la constitution. La déclaration a en pratique précédé la constitution : déposée le 1er juillet 2026, pour une Date de Création au 31 juillet 2026."},"due_date":"2026-07-01","produced_by":"Société de Gestion (fundcraft)","approved_by":"AIFM","filed_to":"AMF (GECO)","language":"fr","internal_only":false,"note":"Effectuée le 1er juillet 2026 — notification de produit déclaré, références DECLP024003 / DCL20260323. L'échéance affichée est la date de dépôt effective, non le butoir réglementaire du 31 août 2026."},{"id":"fatca-crs","type":"Déclaration FATCA / CRS","scope":"fonds","frequency":"annuel","due_rule":{"anchor":"FIXED","day":31,"month":7,"source":"Accord intergouvernemental France–États-Unis de modèle 1 ; Directive 2014/107/UE (CRS) ; art. 1649 AC du CGI."},"produced_by":"Dépositaire (BFCM) par délégation, sous le contrôle de la Société de Gestion","approved_by":"Société de Gestion","filed_to":"DGFiP","language":"fr","internal_only":false,"note":"GIIN 8P01WM.99999.SL.250 — Reporting Model 1 FFI. W-8BEN-E valide jusqu'au 31 décembre 2029."},{"id":"risk-committee","type":"Rapport de gestion des risques au comité des risques","scope":"fonds","frequency":"trimestriel","due_rule":{"anchor":"QE","offset":30,"unit":"day","source":"Art. 15 de la Directive 2011/61/UE ; programme d'activité de la Société de Gestion. Prospectus Art. 13 : méthode de l'engagement pour le suivi du risque global."},"produced_by":"Société de Gestion (fundcraft) — gestion des risques","approved_by":"AIFM","filed_to":"Interne","language":"fr","internal_only":true,"note":"Limites à fixer : limite par groupe de gestion et limite de transparence par transaction — aucune des deux n'existe aujourd'hui alors que le Fonds porte 99,67 % sur un gérant unique et 43,26 % de l'Actif Net sur une transaction."},{"id":"liquidity-stress","type":"Stress test de liquidité","scope":"fonds","frequency":"trimestriel","due_rule":{"anchor":"QE","offset":45,"unit":"day","source":"Art. 16 de la Directive 2011/61/UE ; orientations ESMA 34-39-897 sur les stress tests de liquidité des OPCVM et FIA."},"produced_by":"Société de Gestion (fundcraft) — gestion des risques","approved_by":"AIFM","filed_to":"Interne, AMF sur demande","language":"fr","internal_only":true,"note":"Le Fonds ne peut libérer plus de liquidité que ses Fonds Sous-Jacents : cascade de gates à modéliser (5 % au niveau du Fonds, 5 % au niveau de chaque Fonds Sous-Jacent)."},{"id":"ic-register","type":"Registre des comités d'investissement","scope":"fonds","frequency":"ponctuel","due_rule":{"anchor":"EVENT","offset":5,"unit":"BD","source":"Procédure interne de la Société de Gestion ; rapport d'adéquation de la Société de Conseil (art. 325-12 du RGAMF)."},"produced_by":"Société de Gestion (fundcraft) — secrétariat","approved_by":"RCCI","filed_to":"Interne","language":"fr","internal_only":true,"note":"Trois lignes au registre à la date du mémo. Le registre n'y reprend ni les participants et le quorum, ni la référence au rapport d'adéquation, ni le suivi de la mise en œuvre."}],"instances":[{"id":"emt:launch","type_id":"emt","period":"lancement","status":"filed","version":"EMT V4.3 — 15 juillet 2026","due_date":"2026-07-31","note":"Transmis aux Distributeurs et au Distributeur Global dès le lancement du Fonds, sans attendre la première échéance trimestrielle."},{"id":"fps-declaration:launch","type_id":"fps-declaration","period":"launch","status":"filed","version":"DECLP024003 / DCL20260323","note":"Déclaration déposée le 1er juillet 2026 — références AMF DECLP024003 et DCL20260323."}]},"dealing":{"params":{"sub_feeder_cut":13,"sub_master_cut":3,"red_feeder_cut":40,"red_master_cut":30,"master_pub":20,"feeder_pub":30,"master_settle":24,"feeder_settle":34,"cvc_settle_cal":45},"blocking_end":"2028-01-31","gate":"5 %","note":"Deux niveaux, deux calendriers : le Fonds en Jours Ouvrés français, les Fonds Sous-Jacents en Jours Ouvrés luxembourgeois. Chaque date est recalculée — Pâques calculée, jours fériés des deux places jusqu'en 2040 — et non reprise d'une table figée. Choisissez le sens, le cycle et la date d'observation : la chaîne se recalcule, une étape non ouvrée est signalée, et les marges d'adossement sont mesurées en bas de cycle."},"drafts":[],"comments":[],"loi":null,"kids":{"source":"DIC PRIIPs AirFund Conviction Value Capital, Parts A (FR0014019OS7) et Parts B (FR0014019OT5), produits le 10 août 2026 ; classeur de calcul AirFund CVC fees.xlsx (stack de frais à trois couches).","produced_on":"10/08/2026","rhp_years":8,"investment":10000,"horizons":["1 an","8 ans (PDR)"],"status":"publié","common_sections":[{"title":"Objet","paras":["Le présent document contient des informations essentielles sur le produit d'investissement. Il ne s'agit pas d'un document à caractère commercial. Ces informations vous sont fournies conformément à une obligation légale, afin de vous aider à comprendre en quoi consiste ce produit et quels risques, coûts, gains et pertes potentiels y sont associés, et de vous aider à le comparer à d'autres produits. Vous êtes sur le point d'acheter un produit qui n'est pas simple et qui peut être difficile à comprendre."]},{"title":"Produit","paras":["AirFund Conviction Value Capital — Initiateur PRIIP : Fundcraft France SAS (la « Société de Gestion »). Site internet : https://www.fundcraft.fr. Téléphone : +33 1 42 74 42 09. Autorité compétente : Autorité des marchés financiers (AMF). Date de production du DIC : 10/08/2026."]},{"title":"Type","paras":["Le Fonds est un Fonds Professionnel Spécialisé (FPS) de droit français constitué sous la forme d'un Fonds d'Investissement Professionnel Spécialisé. Il s'agit d'un FIA non agréé par l'AMF constitué sous la forme de Fonds Commun de Placement (FCP), soumis aux articles L. 214-154 et suivants du Code monétaire et financier ainsi qu'aux articles 423-1 et suivants du Règlement général de l'AMF, et dont les règles de fonctionnement sont fixées par son Prospectus. Le Fonds est géré par Fundcraft France SAS, société de gestion de portefeuille agréée par l'AMF (n° GP-20260008) en qualité de gestionnaire de fonds d'investissement alternatifs (AIFM) au sens de la Directive 2011/61/UE."]},{"title":"Durée","paras":["La durée du Fonds est de quatre-vingt-dix-neuf (99) ans à compter de sa création. Le Fonds est ouvert aux souscriptions mensuelles et aux rachats trimestriels, sous réserve des conditions, mécanismes de gestion de la liquidité et restrictions exposés dans le Prospectus, notamment le préavis applicable, la période de blocage initiale de dix-huit (18) mois et les mécanismes de plafonnement (gates) des rachats. La Société de Gestion peut décider la dissolution anticipée du Fonds dans les conditions prévues au Règlement."]},{"title":"Objectifs","paras":["Le Fonds est géré activement et de manière discrétionnaire par la Société de Gestion. Il a pour objectif de générer une appréciation du capital sur le long terme par le biais d'une exposition diversifiée au capital-investissement, au travers d'investissements principalement réalisés dans des fonds d'investissement alternatifs européens mettant en œuvre des stratégies de capital-investissement primaire et secondaire. Le Fonds n'a pas d'objectif chiffré de performance ; les rendements dépendront principalement des performances des Fonds Sous-Jacents. Le Fonds n'est pas géré en référence à un indice de marché.","Le Fonds est structuré sous la forme d'un fonds de fonds. Les Fonds Sous-Jacents mettent en œuvre deux orientations de gestion principales : capital-investissement primaire mondial (fonds primaires et co-investissements associés, diversification Europe / Amérique du Nord / Asie, buy-out, growth, capital-développement) et capital-investissement secondaire (portefeuilles LP-led, opérations GP-led dont fonds de continuation, et co-investissements associés, périmètre mondial).","Compte tenu de la nature illiquide des Fonds Sous-Jacents, le Fonds peut détenir une trésorerie de gestion sous la forme d'OPC monétaires, de comptes à vue auprès du Dépositaire et, le cas échéant, de titres de créance à court terme. Le Fonds n'aura pas recours à l'emprunt ; le levier AIFM (méthode brute et méthode de l'engagement) sera au maximum de 100 % de la Valeur Liquidative.","Le Fonds relève de l'article 6 du Règlement SFDR : il ne promeut pas de caractéristiques environnementales et/ou sociales et n'a pas pour objectif l'investissement durable au sens du Règlement."]},{"title":"Investisseurs de détail visés","paras":["Les Parts sont réservées aux Investisseurs Éligibles au sens de l'article 423-27 du Règlement général de l'AMF : (i) investisseurs professionnels au sens de l'article L. 214-155 du Code monétaire et financier (ou équivalents étrangers) ; (ii) investisseurs dont la souscription initiale est ≥ 100 000 EUR ; (iii) personnes physiques ou morales avec souscription ≥ 30 000 EUR remplissant l'une des trois conditions de l'article 423-27. Le Fonds s'adresse à des investisseurs sophistiqués, expérimentés en capital-investissement, ayant obtenu un conseil approprié, capables de supporter une perte pouvant aller jusqu'à l'intégralité du montant investi. Il n'est pas adapté aux investisseurs incapables de soutenir un investissement long terme avec liquidité limitée."]},{"title":"Indicateur de risque","paras":["L'indicateur de risque part de l'hypothèse que vous conservez le produit pendant 8 ans (Période de Détention Recommandée). Le risque réel peut être très différent si vous optez pour une sortie avant échéance et vous pourriez obtenir moins en retour. Le produit est classé dans la classe de risque 4 sur 7, qui est une classe de risque moyenne.","D'autres risques substantiellement pertinents pour le produit non inclus dans l'indicateur synthétique de risque sont décrits à l'Article 17 du Prospectus, notamment : risque de liquidité (les Fonds Sous-Jacents investissent dans des actifs illiquides — les rachats peuvent être plafonnés ou suspendus), risque de concentration sur un nombre limité de Fonds Sous-Jacents, risque de change sur les participations sous-jacentes libellées en devises autres que l'euro, risque opérationnel et risque de contrepartie au niveau du Dépositaire."]},{"title":"Scénarios de performance","paras":["Les chiffres indiqués comprennent tous les coûts du produit lui-même, mais pas nécessairement tous les frais dus à votre conseiller ou distributeur. Ces chiffres ne tiennent pas compte de votre situation fiscale personnelle. Les scénarios défavorable, intermédiaire et favorable présentés dépeignent des exemples utilisant les meilleure et pire performances, ainsi que la performance moyenne du produit ou d'un indicateur de substitution valable au cours des 13 dernières années. Les marchés pourraient évoluer très différemment à l'avenir."]},{"title":"Que se passe-t-il si la Société de Gestion n'est pas en mesure d'effectuer les versements ?","paras":["Le produit est une copropriété d'instruments financiers et de dépôts distincte de la société de gestion de portefeuille. En cas de défaillance de cette dernière, les actifs du produit conservés par le dépositaire ne seront pas affectés. En cas de défaillance du dépositaire, le risque de perte financière du produit est atténué en raison de la ségrégation légale des actifs du dépositaire de ceux du produit. Les pertes ne sont couvertes par aucun système d'indemnisation ou de garantie des investisseurs."]},{"title":"Combien de temps dois-je le conserver et puis-je retirer de l'argent de façon anticipée ?","paras":["Période de détention recommandée : 8 ans. La Société de Gestion considère cette durée comme appropriée pour permettre aux Fonds Sous-Jacents de mettre en œuvre leurs stratégies et de générer des rendements potentiels. Aucun rachat n'est possible pendant une période de blocage de dix-huit (18) mois à compter de la création du Fonds. À l'issue de cette période, vous pouvez demander le rachat de tout ou partie de vos Parts à chaque trimestre (dernier jour ouvré de mars, juin, septembre et décembre), moyennant un préavis de quarante (40) jours calendaires, susceptible d'être porté à un maximum de cent (100) jours calendaires en application de la Directive AIFM 2. Le montant agrégé des rachats peut être plafonné à 5 % de l'Actif Net par trimestre (gate), pouvant entraîner le report d'une partie des ordres. Le Fonds ne prélève aucune commission de rachat ni pénalité de sortie anticipée."]},{"title":"Comment puis-je formuler une réclamation ?","paras":["Vous pouvez contacter le service en charge des réclamations de la Société de Gestion par courriel à airfund@clients.fundcraft.fr ou par voie postale à Fundcraft France SAS, 4 quai des Célestins, 75004 Paris, France. Si votre réclamation concerne la personne qui vous a conseillé sur ce produit ou qui vous l'a vendu, cette dernière vous indiquera où adresser votre réclamation. À défaut de réponse satisfaisante, vous pouvez également saisir le Médiateur de l'AMF."]},{"title":"Autres informations pertinentes","paras":["Le présent document ne contient pas l'ensemble des informations nécessaires à la prise d'une décision d'investissement. Vous devez également consulter le Prospectus, le Règlement du Fonds et le dernier rapport annuel (lorsqu'il est disponible). Ces documents sont mis à votre disposition gratuitement, sur demande écrite, par la personne qui vous a fourni le présent document, ou conformément à la législation applicable. Le Prospectus et le rap       const yE = v => T + (ymaxE - v) / ymaxE * (H - T - B), yB = v => T + (ymaxB - v) / ymaxB * (H - T - B);
      for (let k = 0; k <= 4; k++) { const v = ymaxE * k / 4; s += '<line class="gl" x1="' + L + '" x2="' + (W - Rm) + '" y1="' + yE(v) + '" y2="' + yE(v) + '"/><text class="tk" x="' + (L - 6) + '" y="' + (yE(v) + 4) + '" text-anchor="end">' + eurF(v / 1000) + 'k</text>'; }
      for (let k = 0; k <= 4; k++) { const v = ymaxB * k / 4; s += '<text class="tk" x="' + (W - Rm + 6) + '" y="' + (yB(v) + 4) + '">' + fBp(v) + '</text>'; }
      s += '<path class="c-eur" d="' + pts.map((p, i) => (i ? 'L' : 'M') + x(p[0]).toFixed(1) + ',' + yE(p[1].total).toFixed(1)).join(' ') + '"/>';
      s += '<path class="c-bps" d="' + pts.map((p, i) => (i ? 'L' : 'M') + x(p[0]).toFixed(1) + ',' + yB(p[1].allin).toFixed(1)).join(' ') + '"/>';

  /* ---- enregistrement dans le fichier + fusion a trois voies (deux editeurs) ----

     l'a enregistre entre-temps, les deux versions sont fusionnees champ par champ —
       modifie par lui seul  : sa valeur est reprise
       modifie par moi seul  : ma valeur est conservee
       modifie par les deux  : ma valeur l'emporte, le point est signale

  const SRC_HTML = document.documentElement.outerHTML;
  const FILE_EDITS_JSON = (function () { const el = document.getElementById('edits'); return el ? el.textContent : ''; })();
  const LOG_LISTS = { journal: 1, events: 1, rjournal: 1, cjournal: 1 };

  function stampInv(fees) {

    return fees;

  function _obj(v) { return !!v && typeof v === 'object' && !Array.isArray(v); }

  function mergeLog(base, mine, theirs) {

    const out = [], seen = {};
    const push = x => { const k = JSON.stringify(x); if (!seen[k]) { seen[k] = 1; out.push(x); } };
    b.forEach(x => { if (_has(m, x) && _has(t, x)) push(x); });
    m.forEach(x => { if (!_has(b, x)) push(x); });
    t.forEach(x => { if (!_has(b, x)) push(x); });

  }
  /* factures : appariees par identifiant, puis fusionnees champ par champ */
  function mergeInv(base, mine, theirs, out) {
    const idx = a => { const d = {}; (Array.isArray(a) ? a : []).forEach((x, i) => { d[(x && x.id) || ('f' + i)] = x; }); return d; };
    const b = idx(base), m = idx(mine), t = idx(theirs);
    const merged = mergeNode(b, m, t, ['fees', 'factures'], out);
    const ord = Object.keys(merged).map(k => merged[k]).filter(Boolean);
    ord.sort((x, y) => String(x.date || '').localeCompare(String(y.date || '')) || String(x.id || '').localeCompare(String(y.id || '')));

  function mergeNode(base, mine, theirs, path, out) {
    const res = {}, keys = {};

      if (_eq(m, t)) { if (m !== undefined) res[k] = _clone(m); return; }

      if (k === 'invoices' && path[0] === 'fees') { res[k] = mergeInv(b, m, t, out); return; }
      if (_eq(m, b)) { if (t !== undefined) { res[k] = _clone(t); out.taken++; out.from.push(p.join(' > ')); } return; }   /* lui seul a modifie */
      if (_eq(t, b)) { if (m !== undefined) res[k] = _clone(m); return; }                                                  /* moi seul */
      if (_obj(m) && _obj(t)) { res[k] = mergeNode(b, m, t, p, out); return; }                                             /* descendre */

    return { payload: merged, out: out };
  }

  function selfDocument(edits) {

  let FILE_HANDLE = null;

  async function saveToFile() {

      try { localStorage.setItem(SK + 'edits', JSON.stringify(payload)); } catch (e) { /* ignore */ }

      REMOTE = null; refreshRemoteBtn();
      EDIT.pending = {};

      EDIT.notice = 'Fichier enregistré ' + how + '.' + (extra ? ' ' + extra : ''); EDIT.noticeOk = true;

  /* veille : l'autre editeur a-t-il enregistre pendant que je travaille ? */

    if (e.target.closest('[data-save-closures]')) { const ta = document.getElementById('closures'); const list = (ta ? ta.value : '').split(/\s+/).map(s => s.trim()).filter(s => /^\d{4}-\d{2}-\d{2}$/.test(s)); CLOSURES = list; try { localStorage.setItem(SK + 'closures', JSON.stringify(list)); } catch (err) { /* ignore */ } EDIT.notice = list.length + (list.length === 1 ? ' date de fermeture' : ' dates de fermeture') + ' appliquée dans ce navigateur.'; EDIT.noticeOk = true; render({ keepScroll: true }); return; }
    if (e.target.closest('[data-editmode]')) { EDIT.on = !EDIT.on; EDIT.notice = ''; EDIT.confirmClear = false; render({ keepScroll: true }); return; }
    if (e.target.closest('[data-save]')) { EDIT.notice = ''; if (EDIT.mode === 'shared') saveShared(false); else if (EDIT.mode === 'local') saveLocal(); return; }
    if (e.target.closest('[data-discard]')) { EDIT.pending = {}; EDIT.notice = ''; render({ keepScroll: true }); return; }
    if (e.target.closest('[data-export]')) { exportCSV(); return; }
    if (e.target.closest('[data-clearlocal]')) { EDIT.confirmClear = true; render({ keepScroll: true }); return; }
    if (e.target.closest('[data-clearlocal-confirm]')) { clearLocal(); return; }
    if (e.target.closest('[data-const-save]')) { const v = (document.getElementById('constInput') || {}).value || ''; if (!parseISO(v)) { EDIT.notice = 'Saisissez une Date de Constitution valide.'; EDIT.noticeOk = false; render({ keepScroll: true }); return; } const nx = JSON.parse(JSON.stringify(EDITS)); nx.settings = Object.assign({}, nx.settings, { constitution: v }); persistState(nx, 'Date de Constitution fixée au ' + v + ' — chronologie de lancement et registre datés.'); return; }
    if (e.target.closest('[data-const-clear]')) { const nx = JSON.parse(JSON.stringify(EDITS)); nx.settings = Object.assign({}, nx.settings, { constitution: null }); persistState(nx, 'Date de Constitution effacée.'); return; }

    if (e.target.closest('#pinBtn')) { state.pinned = !state.pinned; store.set(SK + 'pin', state.pinned ? '1' : '0'); applyPin(); return; }
    const ph = e.target.closest('#phaseToggle button');
    if (ph) { state.phase = +ph.dataset.phase; store.set(SK + 'phase', String(state.phase)); render({ keepScroll: true }); return; }
    if (window.innerWidth <= 820 && !e.target.closest('#rail') && !e.target.closest('[data-menu]')) $('#rail').classList.remove('open');
  });
  document.addEventListener('input', e => {
    const el = e.target.closest('[data-edit]');
    if (el) { setPending(el.dataset.anchor, el.dataset.edit, el.value); return; }
    if (e.target.id === 'editorName') { EDIT.editor = e.target.value; store.set(SK + 'editor', EDIT.editor); document.querySelectorAll('#editorName').forEach(i => { if (i !== e.target) i.value = EDIT.editor; }); const c = $('#identChip'); if (c) { c.querySelector('.who').textContent = EDIT.editor.trim() || 'Qui êtes-vous ?'; c.querySelector('.rl').textContent = roleLabel(); c.classList.toggle('admin', role() === 'admin'); c.classList.toggle('viewer', role() === 'viewer'); } clearTimeout(window.__nameTimer); window.__nameTimer = setTimeout(() => { if (state.tab === 'access') { const el = document.getElementById('editorName'); const pos = el ? el.selectionStart : null; render({ keepScroll: true }); const again = document.getElementById('editorName'); if (again) { again.focus(); try { again.setSelectionRange(pos, pos); } catch (err) { /* ignore */ } } } }, 600); }
  });
  document.addEventListener('change', e => {
    const el = e.target.closest('select[data-edit]'); if (el) { setPending(el.dataset.anchor, el.dataset.edit, el.value); return; }
    const me = e.target.closest('[data-me]'); if (me) { state.me = me.value || null; store.set(SK + 'me', state.me || ''); render({ keepScroll: true }); return; }
    const bs = e.target.closest('[data-bwd-sel]'); if (bs) { const pb = PBMAP[bs.dataset.pb]; if (pb) { bwdOf(pb.id).sel = bs.value; saveBwd(); applyBackward(pb); } return; }
    const bd = e.target.closest('[data-bwd-date]'); if (bd) { const pb = PBMAP[bd.dataset.pb]; if (pb && (!bd.value || (parseISO(bd.value) && parseInt(bd.value.slice(0, 4), 10) >= 2000))) { bwdOf(pb.id).date = bd.value; saveBwd(); applyBackward(pb); } return; }
    const ss = e.target.closest('[data-sim-step]'); if (ss) { const pb = PBMAP[ss.dataset.pb]; if (pb) { simOf(pb.id).idx = parseInt(ss.value, 10); const cur = currentPlanEntries(); const out = $('#sim-out'); if (cur && out) out.innerHTML = simulatorOut(pb, cur.items); } return; }
    const sd = e.target.closest('[data-sim-delay]'); if (sd) { const pb = PBMAP[sd.dataset.pb]; const v = parseInt(sd.value, 10); if (pb && v >= 1 && v <= 60) { simOf(pb.id).delay = v; const cur = currentPlanEntries(); const out = $('#sim-out'); if (cur && out) out.innerHTML = simulatorOut(pb, cur.items); } return; }
    const ai = e.target.closest('[data-anchor-input]'); if (ai) { onAnchorInput(ai); return; }
    const qs = e.target.closest('[data-q-year],[data-q-quarter]'); if (qs) { onQuarterPick(qs); return; }
    const ms = e.target.closest('[data-m-year],[data-m-month]'); if (ms) { const form = ms.closest('.pform'); const y = parseInt(form.querySelector('[data-m-year]').value, 10), m = parseInt(form.querySelector('[data-m-month]').value, 10); const iso = isoOf(lastBDofMonth(y, m)); planOf(ms.dataset.pb).NAV = iso; savePlans(); const hi = form.querySelector('[data-anchor-input="NAV"]'); if (hi) hi.value = iso; refreshPlan(ms.dataset.pb); return; }
    const ssel = e.target.closest('[data-s-year],[data-s-sem]'); if (ssel) { const form = ssel.closest('.pform'); const y = parseInt(form.querySelector('[data-s-year]').value, 10), s2 = parseInt(form.querySelector('[data-s-sem]').value, 10); const iso = semesterEnd(y, s2); planOf(ssel.dataset.pb).NAV = iso; savePlans(); const hi = form.querySelector('[data-anchor-input="NAV"]'); if (hi) hi.value = iso; refreshPlan(ssel.dataset.pb); return; }
  });
  document.addEventListener('input', e => { const ai = e.target.closest('[data-anchor-input]'); if (ai && ai.type === 'date') onAnchorInput(ai); const sd = e.target.closest('[data-sim-delay]'); if (sd) { const pb = PBMAP[sd.dataset.pb]; const v = parseInt(sd.value, 10); if (pb && v >= 1 && v <= 60) { simOf(pb.id).delay = v; const cur = currentPlanEntries(); const out = $('#sim-out'); if (cur && out) out.innerHTML = simulatorOut(pb, cur.items); } } });
  let anchorTimer = null;
  function onAnchorInput(el) {
    const pbId = el.dataset.pb, key = el.dataset.anchorInput, pb = PBMAP[pbId]; if (!pb) return;
    const v = el.value; const a = pb.anchors.find(x => x.key === key);
    if (a && a.type === 'year') { if (v && !/^\d{4}$/.test(v)) return; }
    else if (v && !(parseISO(v) && parseInt(v.slice(0, 4), 10) >= 2000)) return; /* ignore partial years while typing */
    planOf(pbId)[key] = v; el.removeAttribute('data-derived'); savePlans();
    clearTimeout(anchorTimer); anchorTimer = setTimeout(() => refreshPlan(pbId), 200);
  }
  function onQuarterPick(el) {
    const pbId = el.dataset.pb, pb = PBMAP[pbId]; if (!pb) return;
    const form = el.closest('.pform'); const ys = form.querySelector('[data-q-year]'), qs = form.querySelector('[data-q-quarter]');
    if (!qs.value) return;
    const iso = quarterEnd(parseInt(ys.value, 10), parseInt(qs.value, 10));
    planOf(pbId).NAV = iso; savePlans();
    const di = form.querySelector('[data-anchor-input="NAV"]'); if (di) di.value = iso;
    const custom = qs.querySelector('option[value=""]'); if (custom) custom.remove();
    refreshPlan(pbId);
  }
  function syncDerived(pb) {
    const R = resolveAnchors(pb, plannerInputs(pb));
    /* quarter pickers follow the NAV date (or show "custom date") */
    document.querySelectorAll('[data-m-month][data-pb="' + pb.id + '"]').forEach(ms => { const iso = plannerInputs(pb).NAV; const d = parseISO(iso); if (!d) return; const form = ms.closest('.pform'); const ys = form.querySelector('[data-m-year]'); if (ys && Array.from(ys.options).some(o => o.value === String(d.getUTCFullYear()))) ys.value = String(d.getUTCFullYear()); ms.value = String(d.getUTCMonth() + 1); });
    document.querySelectorAll('[data-s-sem][data-pb="' + pb.id + '"]').forEach(ss => { const iso = plannerInputs(pb).NAV; const so = semesterOf(iso); if (!so) return; const form = ss.closest('.pform'); const ys = form.querySelector('[data-s-year]'); if (ys && Array.from(ys.options).some(o => o.value === String(so.y))) ys.value = String(so.y); ss.value = String(so.s); });
    document.querySelectorAll('[data-q-quarter][data-pb="' + pb.id + '"]').forEach(qs => {
      const form = qs.closest('.pform'); const ys = form.querySelector('[data-q-year]'); const iso = plannerInputs(pb).NAV; const qq = quarterOf(iso);
      let custom = qs.querySelector('option[value=""]');
      if (qq) { if (custom) custom.remove(); if (Array.from(ys.options).some(o => o.value === String(qq.y))) ys.value = String(qq.y); qs.value = String(qq.q); }
      else { if (!custom) { custom = document.createElement('option'); custom.value = ''; custom.textContent = 'date personnalisée'; qs.appendChild(custom); } qs.value = ''; }
    });
    pb.anchors.forEach(a => { if ((a.default || a.special) && !planOf(pb.id)[a.key] && R.anchors[a.key]) document.querySelectorAll('[data-anchor-input="' + a.key + '"][data-pb="' + pb.id + '"]').forEach(i => { if (i.type === 'date') i.value = isoOf(R.anchors[a.key]); }); });
  }
  function refreshPlan(pbId) {
    const pb = PBMAP[pbId]; if (!pb) return;
    syncDerived(pb);
    if (state.tab === 'planner') { if (state.pb === pbId) { const out = document.getElementById('plan-out'); if (out) out.innerHTML = renderPlanOut(pb); } updateHash(); }
    else applyTabDates();
  }
  function twelveMonths(pb, year) {
    const now = new Date().toISOString(); const by = (EDIT.editor || '').trim() || 'éditeur anonyme';
    const evs = MONTHS.map((mn, mi) => { const d = lastBDofMonth(year, mi + 1); const iso = isoOf(d); return { id: 'ev-' + pb.id + '-' + year + '-' + String(mi + 1).padStart(2, '0'), name: pb.name + ' — ' + mn.slice(0, 3) + ' ' + year, pb: pb.id, anchors: { NAV: iso }, by, at: now }; });
    const next = JSON.parse(JSON.stringify(EDITS)); next.events = events().filter(x => !evs.some(e => e.id === x.id)).concat(evs);
    return persistState(next, 'Les douze cycles mensuels de ' + year + ' ont été enregistrés dans ce navigateur.');
  }
  document.addEventListener('input', e => { if (e.target.id === 'evName') state.evName = e.target.value; });
  let timer = null;
  $('#q').addEventListener('input', e => {
    clearTimeout(timer);
    timer = setTimeout(() => {
      state.q = e.target.value.trim();
      state.showAll = false;
      if (state.q && state.tab === 'overview') state.tab = 'results';
      if (!state.q && state.tab === 'results') state.tab = 'overview';
      render();
    }, 120);
  });
  document.addEventListener('keydown', e => {
    if (e.key === '/' && document.activeElement !== $('#q') && !/INPUT|TEXTAREA/.test(document.activeElement.tagName)) { e.preventDefault(); $('#q').focus(); $('#q').select(); }
    if (e.key === 'Escape' && state.q) { state.q = ''; $('#q').value = ''; if (state.tab === 'results') state.tab = 'overview'; render(); $('#q').blur(); }
  });
  window.addEventListener('hashchange', () => {
    const p = readHash();
    if (p.g && GUIDE[p.g]) { state.guide = p.g; state.gstep = Math.max(0, parseInt(p.s || '0', 10) || 0); }
    if (p.tab && (VIEW_IDS.has(p.tab) || TAB[p.tab]) && (p.tab !== state.tab || p.e || p.p || p.pb || p.ev)) { state.tab = p.tab; if (p.tab === 'parties') state.party = p.p ? decodeURIComponent(p.p) : null; if (p.tab === 'planner') applyPlannerParams(p); render({ scrollTo: p.e || null }); }
  });

  /* header heights drive the sticky offsets */
  function measure() {
    if (!state.pinned) { document.documentElement.style.setProperty('--top-h', '0px'); document.documentElement.style.setProperty('--hdr-h', '0px'); return; }
    const tb = $('.topbar'), st = $('#strip');
    const top = tb ? tb.getBoundingClientRect().height : 57;
    const strip = (st && window.innerWidth > 820) ? st.getBoundingClientRect().height : 0;
    document.documentElement.style.setProperty('--top-h', top + 'px');
    document.documentElement.style.setProperty('--hdr-h', (top + strip) + 'px');
  }
  function applyPin() {
    $('#app').classList.toggle('pinned', state.pinned);
    $('#pinBtn').setAttribute('aria-pressed', String(state.pinned));
    measure();
  }
  window.addEventListener('resize', measure);

  /* ---------------- init ---------------- */
  (function init() {
    const saved = store.get(SK + 'phase'); if (HAS_PHASES && saved === '2') state.phase = 2;
    state.pinned = store.get(SK + 'pin') === '1';
    applyPin();
    const p = readHash();
    if (p.p) state.party = p.p;
    if (p.q) { state.q = p.q; $('#q').value = p.q; }
    const isView = id => VIEW_IDS.has(id) || !!TAB[id];
    if (p.g && GUIDE[p.g]) { state.guide = p.g; state.gstep = Math.min(Math.max(0, parseInt(p.s || '0', 10) || 0), GUIDE[p.g].stops.length - 1); if (!p.e) p.e = GUIDE[p.g].stops[state.gstep].anchor; }
    state.me = store.get(SK + 'me') || null;
    if (p.tab === 'planner') applyPlannerParams(p);
    try { const n = sessionStorage.getItem(SK + 'notice'); if (n) { sessionStorage.removeItem(SK + 'notice'); EDIT.notice = n; EDIT.noticeOk = true; } } catch (e) { /* ignore */ }
    if (p.tab && isView(p.tab)) state.tab = p.tab;
    else { const last = store.get(SK + 'tab'); if (last && isView(last)) state.tab = last; }
    if (state.q && state.tab === 'overview') state.tab = 'results';
    state.scrollAnchor = p.e || null;
    render({ scrollTo: p.e || null });
  })();
})();
</script>
