"N°","Description de la tâche","Délai convenu","Responsable"],"rows":[{"kind":"task","no":"1","text":"Recommandation formelle de la Société de Conseil adressée à la Shared Mailbox : dossier d'investissement préliminaire (due diligence préliminaire), rapport d'adéquation (art. 325-12 RGAMF), mode de financement envisagé, déclaration d'absence ou d'identification de conflit d'intérêts (convention de conseil, art. 2 et 6). Les opportunités présentées sont réservées au Fonds (art. 5.1).","timeline":"T-10 JO","resp":"AirFund (Société de Conseil)","r":4},{"kind":"task","no":"2","text":"Ouverture d'un processus d'investissement sur la Plateforme et enregistrement des données principales : Fonds Sous-Jacent cible et catégorie de parts visée, nature (primaire / secondaire), montant et devise, date cible, pourcentage de détention et poids dans l'Actif Net attendu, prestataires du Fonds Sous-Jacent (AIFM, dépositaire, administrateur, auditeur). Création du tableau de bord d'exécution.","timeline":"T-10 JO","resp":"fundcraft Gestion","r":5},{"kind":"task","no":"3","text":"Comité ad hoc consultatif (convention de conseil, art. 4) : présentation par AirFund, échanges avec les gérants fundcraft ; compte rendu archivé sur la Plateforme et tenu à disposition du RCCI. Le comité n'a aucune voix décisionnaire.","timeline":"T-8 JO","resp":"fundcraft Gestion ; AirFund","r":6},{"kind":"task","no":"4","text":"KYA et due diligence menées par la Société de Gestion : documentation du Fonds Sous-Jacent (prospectus, statuts, rapports, DIC/EMT), organigramme et bénéficiaires effectifs, screening du gestionnaire et des contreparties, risque inhérent et résiduel, analyse juridique et fiscale (mémo DAC6), ESG, méthodologie de valorisation, conditions de liquidité (préavis, plafonnement, lock-up) et de transmission des VL — side letter au sens du Prospectus 14.2 si la documentation ne prévoit pas la transmission des informations requises.","timeline":"T-8 à T-4 JO","resp":"fundcraft KYA ; fundcraft Risques","r":7},{"kind":"task","no":"5","text":"Contrôle des règles d'investissement et des limites : Prospectus 4.2 et 4.3 (FIA européens gérés par un AIFM agréé dans l'UE ; investissements, engagements et trésorerie de gestion ≤ 100 % de la VL ; aucun emprunt ; concentration assumée) ; limites internes approuvées par la gouvernance (poids maximal par Fonds Sous-Jacent inférieur à 85 %, la limite préservant la qualification de fonds de fonds, poche de liquidité cible, exposition en devises, cohérence avec le profil de risque initial et les tests de liquidité). Résultat consigné dans le processus.","timeline":"T-4 JO","resp":"fundcraft Risques","r":8},{"kind":"task","no":"6","text":"Contrôle de conformité : conflits d'intérêts liés au cumul des fonctions de Société de Conseil et de Distributeur Global (convention de conseil, art. 6.2), interdiction de co-investir aux côtés d'Entreprises Liées et d'investir dans une société où la Société de Gestion ou la Société de Conseil détient une participation (Prospectus 8.7 et 8.8), allocation entre Fonds Liés soumise au Comité de Revue des Dossiers, rémunérations de tiers (art. 6.3). Contrôle de trésorerie : disponibilité des fonds et source (compte de collecte / compte courant).","timeline":"T-3 JO","resp":"RCCI ; fundcraft Paiements","r":9},{"kind":"task","no":"7","text":"Comité d'investissement de la Société de Gestion tenu sur la Plateforme : gérants financiers de fundcraft votants, AirFund invitée pour présenter sa recommandation sans voix délibérative ; décision « Approuvé / Rejeté » avec conditions suspensives éventuelles ; documents pré et post-réunion (ordre du jour, procès-verbal) déposés sur la Plateforme. La Société de Gestion conserve l'entière indépendance de décision et peut s'écarter des recommandations (convention de conseil, art. 3).","timeline":"T-3 JO","resp":"Société de Gestion","r":10},{"kind":"task","no":"8","text":"Exécution : bulletin de souscription du Fonds Sous-Jacent (minimum initial de 1 M€ par fonds accepté par CVC le 17 juin 2026 ; réinvestissements ultérieurs à partir de 1 000 €), dossier KYC du Fonds auprès de l'agent de transfert (Prospectus, accusé de réception AMF, W-8BEN-E et GIIN, liste des signataires, RIB), respect de la date limite de souscription (3 JO avant la fin du mois pour les véhicules CVC). Saisie des termes de l'opération (date, montant, devise et taux de change le cas échéant, nombre de parts attendu) par une personne et validation par une seconde (4 yeux).","timeline":"T-3 JO (cut-off CVC)","resp":"fundcraft Gestion","r":11},{"kind":"task","no":"9","text":"Information du Dépositaire avant règlement (« Notify Depositary » sur la Plateforme : documents de l'opération consultables par BFCM) et instruction de paiement selon l'onglet « Paiements & Factures ».","timeline":"T-3 à T","resp":"fundcraft Gestion ; fundcraft Paiements ; BFCM","r":12},{"kind":"task","no":"10","text":"Post-transaction : instructions comptables validées et transmises au Délégataire Comptable ; confirmation de souscription et relevé de parts du Fonds Sous-Jacent (VL d'exécution publiée J+20 JO par CVC) déposés sur la Plateforme ; enregistrement de la position ; paramétrage de la collecte automatique des documents (Canoe) et de la Shared Mailbox comme destinataire des notices.","timeline":"Confirmation + 5 JO","resp":"fundcraft Gestion ; CIC","r":13}]},{"type":"tasks","title":"B. Déploiement mensuel et souscriptions complémentaires","lead":null,"columns":["N°","Description de la tâche","Délai convenu","Responsable"],"rows":[{"kind":"task","no":"1","text":"Cadre d'allocation : l'allocation cible entre les Fonds Sous-Jacents et la poche de trésorerie est approuvée par le Comité d'investissement (allocation initiale décidée le 25 août 2026) et revue au moins trimestriellement, sur recommandation de la Société de Conseil et avis de fundcraft Risques.","timeline":"Trimestriel","resp":"Société de Gestion ; AirFund","r":17},{"kind":"task","no":"2","text":"Chaque mois, calcul du montant à déployer : souscriptions nettes acceptées à la Date de Centralisation, diminuées de la trésorerie nécessaire aux frais, aux rachats attendus et à la poche de liquidité cible ; proposition d'allocation entre les Fonds Sous-Jacents dans le cadre approuvé.","timeline":"J-6 JO","resp":"fundcraft Gestion ; fundcraft Risques","r":18},{"kind":"task","no":"3","text":"Validation par un gérant habilité et contrôle 4 yeux ; ouverture d'un processus de souscription complémentaire sur la Plateforme (données principales identiques à la section A) ; contrôle des limites par fundcraft Risques.","timeline":"J-5 JO","resp":"Société de Gestion ; fundcraft Risques","r":19},{"kind":"task","no":"4","text":"Ordre de souscription auprès de CVC avant la date limite (3 JO avant la fin du mois), règlement, confirmation et intégration selon les tâches A.8 à A.10.","timeline":"J-3 JO","resp":"fundcraft Gestion ; fundcraft Paiements","r":20}]},{"type":"tasks","title":"C. Désinvestissements — rachats auprès des Fonds Sous-Jacents","lead":null,"columns":["N°","Description de la tâche","Délai convenu","Responsable"],"rows":[{"kind":"task","no":"1","text":"Déclenchement : besoins de liquidité (rachats trimestriels du Fonds, frais), rééquilibrage de l'allocation, ou décision du Comité d'investissement sur recommandation de la Société de Conseil (rapport d'adéquation en cas de désinvestissement).","timeline":"D-40 jours calendaires","resp":"fundcraft Gestion ; AirFund","r":24},{"kind":"task","no":"2","text":"Décision de la Société de Gestion (Comité d'investissement ou gérant habilité dans le cadre approuvé) et contrôle de fundcraft Risques (adéquation actif/passif : les Fonds Sous-Jacents règlent 24 JO après leur VL trimestrielle, le Fonds règle ses Investisseurs au plus tard 34 JO après D).","timeline":"D-35 jours calendaires","resp":"Société de Gestion ; fundcraft Risques","r":25},{"kind":"task","no":"3","text":"Transmission de l'ordre de rachat à l'agent de transfert de CVC au plus tard 30 jours calendaires avant la fin du trimestre ; prise en compte du plafonnement de 5 % et du soft lock-up de 18 mois (frais de 5 %) applicables aux Fonds Sous-Jacents ; suivi de la confirmation, de la VL d'exécution (J+20 JO) et de l'encaissement (J+24 JO).","timeline":"D-30 jours calendaires","resp":"fundcraft Gestion","r":26},{"kind":"task","no":"4","text":"Post-transaction : instructions comptables, confirmation de rachat déposée sur la Plateforme, mise à jour de la position et du suivi de trésorerie.","timeline":"Confirmation + 5 JO","resp":"fundcraft Gestion ; CIC","r":27}]},{"type":"tasks","title":"D. Trésorerie de gestion","lead":null,"columns":["N°","Description de la tâche","Délai convenu","Responsable"],"rows":[{"kind":"task","no":"1","text":"La trésorerie de gestion est détenue sous forme d'OPC monétaires, de comptes à vue auprès du Dépositaire et, le cas échéant, de titres de créance à court terme (Prospectus 4.2(b)). Les souscriptions et rachats d'OPC monétaires suivent un processus simplifié (instruction d'un gérant, contrôle 4 yeux, information du Dépositaire).","timeline":"Continu","resp":"fundcraft Gestion ; fundcraft Paiements","r":31},{"kind":"task","no":"2","text":"Suivi quotidien de la trésorerie : soldes des comptes courant et de collecte (relevés MT940), VL des OPC monétaires, échéancier des souscriptions et rachats du Fonds et des Fonds Sous-Jacents, scénarios de liquidité et modélisation du plafonnement des rachats ; indicateurs remontés au comité opérationnel mensuel et au comité de suivi trimestriel.","timeline":"Quotidien","resp":"fundcraft Risques ; fundcraft Gestion","r":32}]}],"special":null,"doc":"prospectus","internal_only":false},{"id":"strategy","sheet":"Règles d'investissement","index":3,"group":"Portefeuille","desc":"Objectif et stratégie, levier, règles d'investissement et suivi des risques — les seuls articles qui contraignent la gestion.","blocks":[{"type":"doc","key":"P:4.2","num":"4.2","title":"4.2 Objectif et stratégie d’investissement","level":2,"items":[{"kind":"subhead","text":"(a) Objectif d’investissement","draft":false,"marks":[],"italic":false,"comments":[]},{"kind":"para","text":"Le Fonds est géré activement et de manière discrétionnaire par la Société de Gestion.","draft":false,"marks":[],"italic":false,"comments":[]},{"kind":"para","text":"Le Fonds a pour objectif de générer une appréciation du capital sur le long terme par le biais d’une exposition diversifiée au capital-investissement (private equity), au travers d’investissements principalement réalisés dans des fonds d’investissement alternatifs européens mettant en œuvre des stratégies de capital-investissement primaire et secondaire telles que décrites à l’Article 4.2(b). Le Fonds n’a pas d’objectif chiffré de performance ; les rendements dépendront principalement des performances des Fonds Sous-Jacents.","draft":false,"marks":[],"italic":false,"comments":[]},{"kind":"subhead","text":"(b) Stratégie d’investissement","draft":false,"marks":[],"italic":false,"comments":[]},{"kind":"para","text":"Le Fonds est structuré sous la forme d’un fonds de fonds. La stratégie d’investissement du Fonds est mise en œuvre principalement par voie d’investissement dans deux ou plusieurs fonds d’investissement alternatifs européens, gérés par un ou plusieurs gestionnaires de fonds d’investissement alternatifs (AIFM) agréés au sein de l’Union européenne (les « Fonds Sous-Jacents »).","draft":false,"marks":[],"italic":false,"comments":[]},{"kind":"para","text":"Les Fonds Sous-Jacents mettront en œuvre deux orientations de gestion principales, étant précisé que d’autres stratégies pourront également être retenues :","draft":false,"marks":[],"italic":false,"comments":[]},{"kind":"li","text":"(i) une stratégie de capital-investissement primaire mondial, poursuivie par des Fonds Sous-Jacents investissant à titre primaire dans des fonds de capital-investissement et réalisant des co-investissements associés. Cette orientation cible une diversification géographique mondiale (Europe, Amérique du Nord, Asie) et sectorielle, sur l’ensemble du segment du capital-investissement (buy-out, growth, capital-développement) ; et","draft":false,"marks":[],"italic":false,"comments":[]},{"kind":"li","text":"(ii) une stratégie de capital-investissement secondaire, poursuivie par des Fonds Sous-Jacents acquérant des portefeuilles de participations en capital-investissement détenus par des investisseurs institutionnels existants (transactions « LP-led ») et/ou participant à des opérations dirigées par les gérants des fonds eux-mêmes (transactions « GP-led », notamment fonds de continuation).","draft":false,"marks":[],"italic":false,"comments":[]},{"kind":"para","text":"La répartition entre ces deux orientations de gestion principales et d’autres orientations de gestion, ainsi que la sélection des Fonds Sous-Jacents par lesquels elles sont mises en œuvre, sont laissées à la discrétion de la Société de Gestion, en fonction notamment des opportunités de marché, des cycles d’appels et de distributions des Fonds Sous-Jacents et des contraintes opérationnelles du Fonds. La Société de Gestion communique périodiquement aux Investisseurs la composition effective du portefeuille du Fonds dans les rapports prévus à l’Article 11.3. Il est précisé que la Société de Gestion, sur recommandation de la Société de Conseil, a identifié préalablement à la constitution du Fonds, plusieurs Fonds Sous-Jacents gérés par CVC Capital Partners.","draft":false,"marks":[],"italic":false,"comments":[]},{"kind":"para","text":"Compte tenu de la nature illiquide des Fonds Sous-Jacents, et afin d’assurer la liquidité nécessaire à la mise en œuvre des souscriptions et des rachats prévus aux Articles 6.1 et 6.3, le Fonds peut détenir une trésorerie de gestion sous la forme d’OPC monétaires, de comptes à vue auprès du Dépositaire et, le cas échéant, de titres de créance à court terme.","draft":false,"marks":[],"italic":false,"comments":[]},{"kind":"para","text":"Le Fonds présente une concentration assumée sur un nombre limité de Fonds Sous-Jacents.","draft":false,"marks":[],"italic":false,"comments":[]},{"kind":"para","text":"La somme des montants effectivement investis et des engagements pris par le Fonds vis-à-vis des Fonds Sous-Jacents et de la trésorerie de gestion ne pourra, à tout moment, excéder cent pour cent (100 %) de la Valeur Liquidative, le Fonds n’ayant pas vocation à recourir à un effet de levier.","draft":false,"marks":[],"italic":false,"comments":[]}]},{"type":"doc","key":"P:4.3","num":"4.3","title":"4.3 Emprunts et effet de levier","level":2,"items":[{"kind":"para","text":"Le Fonds n’aura pas recours à l’emprunt.","draft":false,"marks":[],"italic":false,"comments":[]},{"kind":"para","text":"En conséquence, le levier AIFM établi conformément à la méthode de l’engagement et à la méthode brute, conformément aux articles 7 et 8 du Règlement délégué (UE) n° 231/2013 de la Commission du 19 décembre 2012, sera au maximum de cent pour cent (100 %).","draft":false,"marks":[],"italic":false,"comments":[]}]},{"type":"doc","key":"P:12","num":"12","title":"12 RÈGLES D’INVESTISSEMENT","level":1,"items":[{"kind":"para","text":"Les fonds professionnels d’investissement spécialisés ne sont pas soumis aux règles d’investissement prévues par les articles L. 214-24-29, L. 214-24-34 et L. 214-24-55 du CMF.","draft":false,"marks":[],"italic":false,"comments":[]},{"kind":"para","text":"Le Fonds est exclusivement soumis aux règles d’investissement énoncées à l’Article 4. Consultez également l’article 3bis du Règlement.","draft":false,"marks":[],"italic":false,"comments":[]},{"kind":"para","text":"Les modifications du Prospectus sont effectuées conformément aux dispositions de l’Article 8.2 des présentes et de l’article 5bis du Règlement.","draft":false,"marks":[],"italic":false,"comments":[]}]},{"type":"doc","key":"P:13","num":"13","title":"13 SUIVI DES RISQUES","level":1,"items":[{"kind":"para","text":"La Société de Gestion est responsable de la gestion des risques du Fonds. L’exercice de cette fonction comprend notamment le contrôle et l’évaluation du respect par le Fonds du présent Prospectus, du Règlement, des lois et réglementations applicables ainsi que des meilleures pratiques du secteur.","draft":false,"marks":[],"italic":false,"comments":[]},{"kind":"para","text":"La Société de Gestion peut se faire assister, dans l’exercice de la fonction de gestion des risques, par des tiers et/ou des prestataires de services affiliés, dont le coût sera supporté par la Société de Gestion.","draft":false,"marks":[],"italic":false,"comments":[]},{"kind":"para","text":"La méthode de calcul retenue pour le suivi du risque global du Fonds est la méthode de l’engagement.","draft":false,"marks":[],"italic":false,"comments":[]}]},{"type":"doc","key":"R:3bis","num":"3 bis","title":"Article 3 bis. RÈGLES D’INVESTISSEMENT ET D’ENGAGEMENT","level":2,"items":[{"kind":"para","text":"Le Fonds n’est pas soumis aux règles d’investissement fixées aux articles L. 214-24-55 et suivants du CMF et peut détenir des biens tels que prévus à l’article L. 214-154 du CMF. Le Fonds est exclusivement soumis aux règles d’investissement définies à l’Article 4.2 (Objectif et stratégie d’investissement) du Prospectus.","draft":false,"marks":[],"italic":false,"comments":[]}]}],"special":null,"doc":"prospectus","internal_only":false},{"id":"risk-profile","sheet":"Profil de risque (IRP)","index":4,"group":"Portefeuille","desc":"L'Initial Risk Profile du Fonds et de ses deux Fonds Sous-Jacents, sur l'échelle pondérée de 0 à 100.","blocks":[{"type":"table","title":"Initial Risk Profile — notation pondérée du Fonds (échelle 0 à 100)","columns":["Typologie de risque","Score","Max atteignable","% du max","Poids","Contribution","Notation"],"rows":[["Risque de marché","8","13","62 %","25 %","15,4","Moyen"],["Risque de liquidité","4","4","100 %","30 %","30,0","Élevé"],["Risque de crédit","0","2","0 %","10 %","0,0","Faible"],["Risque de contrepartie","1","6","17 %","10 %","1,7","Faible"],["Risque opérationnel","6","10","60 %","15 %","9,0","Moyen"],["Risque de levier","0","3","0 %","10 %","0,0","Faible"],["GLOBAL","19","38","50 %","100 %","56,1","ÉLEVÉ"]],"key":"","draft":false,"marks":[],"comments":[],"source_note":"Classeur Initial Risk Profile — AirFund Conviction Value Capital, CVC-PE et CVC-PESEC. Le score d'un facteur est rapporté au plus grave de ses choix, non à la somme des alternatives ; les poids sont arrêtés par la Société de Gestion. Bornes FAIBLE [0-34], MOYEN ]34-56], ÉLEVÉ ]56-100].","internal_only":true},{"type":"table","title":"Notation en transparence — score de chaque Fonds Sous-Jacent pondéré par l'allocation","columns":["Ligne","Allocation","Score du fonds","Contribution","Notation"],"rows":[["CVC-PESEC Private Equity Secondaries","69,77 %","82,2","57,4","ÉLEVÉ"],["CVC-PE Global Private Equity","29,90 %","86,1","25,7","ÉLEVÉ"],["Trésorerie — OPC monétaires et compte du Dépositaire","0,33 %","0,0","0,0","n/a"],["Score en transparence","100 %","—","83,1","ÉLEVÉ"],["Score en transparence — rebasé hors trésorerie","99,67 %","—","83,4","ÉLEVÉ"]],"key":"","draft":false,"marks":[],"comments":[],"source_note":"Allocation validée au comité d'investissement du 25 août 2026. Les scores des deux compartiments sont établis sur la même grille, à partir des annexes 1 et 2 du prospectus CVC PES SICAV.","internal_only":true},{"type":"numbered","title":"Lecture de la notation","items":[{"no":"1","text":"**Le Fonds est classé ÉLEVÉ à 56,1 sur 100, soit 0,1 point au-dessus de la borne.** Le classement tient à une décimale : une révision du poids de la liquidité de 30 % à 29 %, ou du facteur de concentration du niveau critique au niveau marqué, le ferait basculer en MOYEN. La notation doit donc être présentée comme un cas limite, non comme un résultat établi."},{"no":"2","text":"**La liquidité porte à elle seule 30 des 56 points.** La typologie est saturée : souscriptions mensuelles et rachats trimestriels servis par un actif intégralement illiquide. Aucune action de gestion ne réduira ce score tant que la structure de passif reste ouverte."},{"no":"3","text":"**La concentration est appliquée au niveau critique** : 99,67 % de l'Actif Net sur un seul groupe de gestion et 69,77 % sur une seule ligne. En transparence le portefeuille est diversifié — plus de 1 060 sociétés cumulées au 31 juillet 2026 —, mais les deux compartiments se recoupent : CVC-PE consacre 19 % de son portefeuille au secondaire (23 % fin juin) et tous deux ont investi dans Project Tyche en juin 2026. C'est le seul facteur de marché sur lequel une décision d'allocation peut jouer."},{"no":"4","text":"**L'écart entre la notation propre et la transparence est de 27 points** — 56,1 contre 83,1. Le Fonds est peu risqué dans ses mécanismes propres (pas d'emprunt, pas de dérivé, pas de change ouvert, juridiction et devise uniques) et très risqué dans ce qu'il détient. C'est le second chiffre que portent les Investisseurs."},{"no":"5","text":"**Les deux Fonds Sous-Jacents sont notés ÉLEVÉ**, CVC-PE à 86,1 et CVC-PESEC à 82,2, l'un et l'autre saturant la liquidité et le levier — plafonds AIFM de 400 % en engagement et 500 % en brut, atteints via véhicules intermédiaires et non transparisés au niveau du Fonds."},{"no":"6","text":"**Point ouvert.** Les bornes 34 et 56 sont arrêtées par la Société de Gestion et doivent figurer dans la procédure de notation des risques. Sans justification écrite de cette calibration, le classement ÉLEVÉ à 56,1 est attaquable."}],"internal_only":true},{"type":"note","text":"L'Initial Risk Profile est un document daté : il est établi sur la documentation disponible au 13 septembre 2026 et sur l'allocation validée au comité du 25 août 2026. Il est à revoir à chaque changement d'allocation, à chaque modification de la documentation d'un Fonds Sous-Jacent, et au minimum une fois par an.","internal_only":true},{"type":"numbered","title":"Limites paramétrées sur la plateforme — rapprochement au Prospectus","items":[{"no":"1","text":"**Sept lignes sur quinze constituent des limites contrôlables, et quatre seulement portent une valeur numérique.** Les huit autres sont des descriptions de stratégie, des mentions informatives — classification SFDR, devise de comptabilité, non-assujettissement aux ratios légaux du Code monétaire et financier — ou un constat d'absence de règle. Aucune ne contredit le Prospectus : le risque tient à ce qui manque, non à ce qui est saisi."},{"no":"2","text":"**Le levier est paramétré à 100 % en méthode brute comme en méthode de l'engagement**, conformément à l'article 4.3 et au DIC. La politique interne qui retenait 300 % est l'anomalie : c'est 100 % qui est opposable aux porteurs et qui doit être déclaré en Annexe IV."},{"no":"3","text":"**Cinq limites imposées par la documentation ne sont pas portées** : le plafond de commissions indirectes de 2 % de l'article 9.5, le Droit d'Entrée de 5 % annoncé au DIC, le préavis de quarante jours extensible à cent de l'article 6.3(b) et (g), la durée de suspension de douze mois de l'article 6.3(d), et le blocage souple de dix-huit mois appliqué à l'actif par les compartiments CVC. Le plafond de frais indirects est le plus sérieux : il est chiffré, donc contrôlable, et sa base de calcul doit préciser que le carried interest des Fonds Sous-Jacents en est exclu, faute de quoi le contrôle est inopérant."},{"no":"4","text":"**Quatre limites internes restent à créer là où aucun texte ne dit rien** : le poids maximal par Fonds Sous-Jacent, à traiter comme une limite dure puisqu'au-delà de 85 % c'est la qualification de fonds de fonds qui devient discutable ; un plancher de trésorerie, la poche actuelle ne couvrant que 3,9 % du plafond de rachat trimestriel ; l'exposition non euro en transparence, que le DIC cite parmi les risques non inclus dans l'indicateur synthétique ; et l'interdiction formelle des dérivés, de la vente à découvert et des opérations de financement sur titres, que ni le Prospectus ni le paramétrage ne prononcent alors que la gestion n'en fait pas usage."},{"no":"5","text":"**Trois défauts de forme empêchent tout contrôle automatique** : les valeurs 0, 100 et 5 sont saisies au format texte, de sorte qu'une comparaison numérique échoue sans alerte ; la colonne des montants est vide sur les quinze lignes ; et le plafonnement comme le blocage sont classés en « Other » sous le Transfer Agent, ce qui interdit de produire un état par nature de risque alors que ce sont les deux limites de liquidité les plus structurantes."}],"internal_only":true}],"special":null,"doc":"prospectus","internal_only":false},{"id":"dealing-calendar","sheet":"Calendrier de négociation","index":5,"group":"Dealing & VL","desc":"Les cycles de souscription et de rachat du Fonds adossés à ceux des Fonds Sous-Jacents, calculés en Jours Ouvrés.","blocks":[{"type":"dealing","title":"Calendrier de négociation — outil","lead":"Deux niveaux, deux calendriers : le Fonds en Jours Ouvrés français, les Fonds Sous-Jacents en Jours Ouvrés luxembourgeois. Chaque date est recalculée — Pâques calculée, jours fériés des deux places au-delà de 2040 — et non lue dans une table figée. Choisissez le sens, le cycle et la date d'observation : la chaîne se recalcule, une étape tombant un jour non ouvré est signalée sur la place concernée, et les marges d'adossement sont mesurées sous le cycle. Exports CSV et ICS."},{"type":"table","title":"Paramètres comparés — le Fonds et les Fonds Sous-Jacents","columns":["Paramètre","AirFund Conviction Value Capital","CVC-PE et CVC-PESEC"],"rows":[["Forme","FPS sous forme de FCP, droit français","Compartiments de CVC Private Equity Strategies Funds S.A. SICAV — FIA de Partie II, droit luxembourgeois, agréés CSSF"],["Gestionnaire","Fundcraft France SAS — AMF GP-20260008","CVC Europe Fund Management S.à r.l. — même AIFM pour les deux compartiments"],["Jours ouvrés de référence","France","Luxembourg"],["Date de valorisation","Dernier Jour Ouvré du mois","Dernier Jour Ouvré du mois"],["Publication de la VL","30 Jours Ouvrés après la date de VL","Environ 20 Jours Ouvrés après la Date de Valorisation"],["Périodicité des souscriptions","Mensuelle — VL de fin de mois","Mensuelle — **premier Jour Ouvré du mois**, à la VL de la Date de Valorisation correspondante"],["Cut-off souscription","13 Jours Ouvrés avant la date de VL, 12h00 Paris","3 Jours Ouvrés avant la Subscription Date, 17h00 CET"],["Règlement des souscriptions","Paiement dû à la Date de Centralisation, conservé sur compte bloqué ; livraison des Parts ≤ 10 Jours Ouvrés","Souscription intégralement libérée ; toute demande reçue après le cut-off bascule à la Subscription Date suivante"],["Périodicité des rachats","Trimestrielle — dernier Jour Ouvré de mars, juin, septembre, décembre","Trimestrielle — dernier Jour Ouvré de chaque trimestre civil, **mêmes dates**"],["Préavis de rachat","40 jours calendaires, prorogeable à 100","30 jours calendaires au moins, 17h00 CET"],["Règlement des rachats","≤ 34 Jours Ouvrés après la date de VL trimestrielle","Généralement dans les **45 jours calendaires** suivant la Redemption Date"],["Plafonnement","5 % de l'Actif Net par trimestre, sur la VL du trimestre ; report pari passu ; durée maximale de 18 mois","5 % de la VNI par trimestre, mesurés sur la **moyenne des VNI des trois derniers Jours Ouvrés de fin de mois** ; demandes non servies automatiquement représentées"],["Outil de liquidité complémentaire","Prorogation du préavis à 100 jours calendaires (Directive AIFM 2)","**Additional Redemption Programme** — la fraction non servie peut être rachetée sur option moyennant une **Liquidity Deduction de 10 %** de la VNI, acquise au compartiment"],["Blocage / lock-up","Période de Blocage de 18 mois à compter de la Date de Création","Early Redemption Deduction de 5 % de la VNI pour toute Action détenue moins de 18 mois"],["Minimum de souscription","100 000 € (30 000 € sous conditions)","Catégorie I : 25 000 €"],["Levier","Aucun emprunt ; levier AIFM ≤ 100 % de la VL","Leverage Ratio plafonné à 30 %"],["Concentration","Limite interne de 85 % par Fonds Sous-Jacent","20 % maximum de la VNI sur un même émetteur, en transparence"],["Discrétion du gérant sous-jacent","Sans objet","Le conseil peut accepter, rejeter, conditionner ou différer toute demande de rachat, en tout ou partie, à sa seule discrétion"]],"key":"","draft":false,"marks":[],"comments":[],"source_note":"Conditions reprises des prospectus de CVC Private Equity Strategies Funds S.A. SICAV (version e-identifiée par la CSSF le 16 janvier 2026) et des DIC des catégories I EUR — CVC-PE du 19 janvier 2026, CVC-PESEC du 3 décembre 2025."},{"type":"tasks","title":"Calendrier de négociation — le Fonds et les Fonds Sous-Jacents","lead":null,"columns":["N°","Description de la tâche","Délai convenu","Responsable"],"rows":[{"kind":"para","no":null,"text":"Dates calculées à partir des paramètres des Documents du Fonds et de ceux des Fonds Sous-Jacents, sur la base des jours fériés français pour le Fonds (Prospectus, définition de Jour Ouvré) et luxembourgeois pour les Fonds Sous-Jacents. Toute évolution des paramètres d'un Fonds Sous-Jacent (fréquence, préavis, délais de publication ou de règlement) est relevée par fundcraft Gestion et donne lieu à la mise à jour du présent calendrier et, le cas échéant, à un réexamen du profil de liquidité du Fonds.","timeline":"","resp":""}]},{"type":"tasks","title":"B. Souscriptions mensuelles — le Fonds et les Fonds Sous-Jacents","lead":null,"columns":["N°","Description de la tâche","Délai convenu","Responsable"],"rows":[{"kind":"para","no":null,"text":"Le règlement de la souscription par l'Investisseur intervient au plus tard à la Date de Centralisation (J-13 JO) ; le règlement du Fonds aux Fonds Sous-Jacents intervient après publication de leur VL (J+24 JO). La colonne « Trésorerie non investie » mesure cet intervalle en Jours Ouvrés : les sommes correspondantes sont placées en OPC monétaires ou conservées sur le compte à vue du Dépositaire (Prospectus 4.2(b)). Le Prospectus 6.1(b) autorise le versement anticipé aux Fonds Sous-Jacents lorsque leur date limite de souscription l'exige. La colonne « Livraison des Parts » applique littéralement le délai de dix (10) Jours Ouvrés de l'article 6.1(e) du Prospectus, qui place la livraison avant la Date d'Etablissement de la VL : à cours inconnu, le nombre définitif de Parts n'est arrêté qu'à la publication de la VL et l'inscription au registre intervient à ce moment. Cette incohérence rédactionnelle est signalée pour correction lors de la prochaine mise à jour du Prospectus.","timeline":"","resp":""}]},{"type":"tasks","title":"C. Rachats trimestriels — le Fonds et les Fonds Sous-Jacents","lead":null,"columns":["N°","Description de la tâche","Délai convenu","Responsable"],"rows":[{"kind":"para","no":null,"text":"Aucune demande de rachat ne peut être présentée avant la fin de la Période de Blocage, le 31 janvier 2028 : la première Date de Centralisation des Rachats utilisable est celle du 20 février 2028, pour la VL du 31 mars 2028. Les lignes antérieures sont maintenues pour mémoire. La colonne « Préavis prorogé » indique la Date de Centralisation applicable si la Société de Gestion active le mécanisme de prolongation du préavis jusqu'à cent (100) jours calendaires prévu par le Prospectus 6.3(g) en application de la directive AIFM 2.","timeline":"","resp":""}]},{"type":"tasks","title":"E. Jours fériés retenus","lead":null,"columns":["N°","Description de la tâche","Délai convenu","Responsable"],"rows":[{"kind":"para","no":null,"text":"Jours fériés retenus pour la France : 1er janvier, lundi de Pâques, 1er mai, 8 mai, Ascension, lundi de Pentecôte, 14 juillet, 15 août, 1er novembre, 11 novembre et 25 décembre. Pour le Luxembourg : 1er janvier, lundi de Pâques, 1er mai, 9 mai (Journée de l'Europe), Ascension, lundi de Pentecôte, 23 juin (fête nationale), 15 août, 1er novembre, 25 et 26 décembre. Les demi-journées et fermetures bancaires locales ne sont pas prises en compte ; le calendrier est revu chaque année en décembre pour l'exercice suivant.","timeline":"","resp":""}]}],"special":null,"doc":"prospectus","internal_only":false},{"id":"redemptions","sheet":"Rachats","index":6,"group":"Dealing & VL","desc":"Le cycle trimestriel de rachat, la Période de Blocage, le Seuil de Déclenchement, le coût d'un rachat pour le Fonds et la capitalisation des produits.","blocks":[{"type":"numbered","title":"Le coût d'un rachat pour le Fonds — première fenêtre ouverte","items":[{"no":"1","text":"**La première fenêtre de rachat est celle de la Valeur Liquidative du 31 mars 2028.** La Date de Création est établie au 31 juillet 2026 par l'attestation de dépôt initial du Dépositaire, ce qui porte la fin de la Période de Blocage au 31 janvier 2028. Les Dates d'Établissement de la Valeur Liquidative étant trimestrielles, la première utilisable est le 31 mars 2028, sur un Formulaire de Rachat déposé au plus tard le 20 février 2028 à midi. La Valeur Liquidative du 31 décembre 2027 est inaccessible : son préavis de quarante jours calendaires expirerait le 21 novembre 2027, pendant la Période de Blocage."},{"no":"2","text":"**La pénalité de sortie de 5 % des Fonds Sous-Jacents n'est pas atteignable sur les tranches initiales.** Les deux compartiments appliquent un blocage souple de dix-huit mois à compter de chaque souscription. La tranche souscrite le 31 août 2026 se libère le 28 février 2028, celle du 11 septembre 2026 le 11 mars 2028 : l'une et l'autre avant le 31 mars 2028. Un trimestre de plafonnement plein demande 497 500 € aux Fonds Sous-Jacents, quand la seule tranche d'août en porte environ 5 165 000 € de libre. Le coût de sortie est donc nul à la première fenêtre, sous la réserve de l'article suivant."},{"no":"3","text":"**La réserve qui commande la conclusion : l'ordre d'imputation des rachats sur les tranches.** Le raisonnement ci-dessus suppose que le Fonds peut désigner les parts cédées, ou que CVC impute du plus ancien au plus récent. Si les compartiments imposent un prorata sur l'ensemble de la position, chaque cession porte une pénalité mélangée dès qu'une tranche est encore bloquée. Cette règle n'est documentée dans aucune des pièces reçues : à obtenir par écrit auprès de CVC, et à inscrire ensuite dans la procédure de rachat sous la forme « céder d'abord la tranche la plus ancienne libérée »."},{"no":"4","text":"**L'asymétrie s'aggrave à chaque closing.** La Période de Blocage court depuis la Date de Création du Fonds, non depuis chaque souscription : un Investisseur entré en 2027 peut demander le rachat dès le 31 mars 2028, alors que les parts CVC acquises avec son apport resteront bloquées jusqu'en 2028 ou 2029. Le stock de parts libérées est donc l'indicateur de liquidité à suivre, davantage que la pénalité elle-même, qui n'est que sa conséquence."},{"no":"5","text":"**Ce qui subsiste comme coût réel.** La dilution par les frais fixes, d'environ cinq points de base : le plancher de Commission de Gestion de 60 000 € et les forfaits Dépositaire, Délégataire Comptable et Commissaire aux Comptes ne diminuent pas avec l'Actif Net, de sorte que la charge directe passe d'environ 2,37 % à 2,42 % après un trimestre de plafonnement plein. Et le décalage de valorisation, non chiffrable en l'état : l'article 6.3(e) impose le rachat à cours inconnu, ce qui protège le Fonds au passif, mais les valeurs liquidatives des compartiments sont trimestrielles et lissées."},{"no":"6","text":"**Le risque de cette fenêtre n'est pas un prix, c'est un règlement.** Les compartiments règlent leurs rachats « généralement dans les 45 jours calendaires », soit vers le 15 mai 2028 ; le Fonds doit régler ses Investisseurs dans les 34 Jours Ouvrés suivant sa date de valeur liquidative, soit le 23 mai 2028. La marge est de huit jours calendaires sur cette première échéance, et tombe à quatre sur les valeurs liquidatives des 29 septembre et 29 décembre 2028. Avec 20 000 € de trésorerie, le Fonds n'a aucun tampon. Le plafond de 5 % appliqué par les compartiments à leurs propres rachats n'est pas la contrainte — le besoin du Fonds représente 0,05 % de l'actif net de CVC-PESEC — : la contrainte est que le rachat trimestriel y est « expected, but not guaranteed, and subject to the discretion of the board of managers ». Le risque est binaire, non gradué."}]},{"type":"numbered","title":"Rachats — deux points de documentation à trancher","items":[{"no":"1","text":"**Le Prospectus se contredit sur la faculté de faire supporter au sortant le coût de sa sortie.** L'article 6.3(e) dispose que le prix de rachat est calculé sur la première Valeur Liquidative trimestrielle établie après la Date de Centralisation « ainsi que de tous autres coûts et frais éventuellement applicables ». Cette incise ouvrirait la voie au mécanisme anti-dilution naturel. Mais le tableau de l'article 9.1 porte deux fois la mention « Aucune », pour la commission de rachat acquise comme non acquise au Fonds, et le DIC du 10 août 2026 en a fait un engagement envers le porteur : « le Fonds ne prélève aucune commission de rachat ni pénalité de sortie anticipée ». S'appuyer sur le 6.3(e) pour prélever un coût de sortie serait contestable tant que les deux autres textes disent le contraire. Un mécanisme anti-dilution suppose donc une modification documentaire et une information des porteurs, non une décision de gestion."},{"no":"2","text":"**Le DIC est muet sur la pénalité supportée par le Fonds.** Un Investisseur lisant le document conclut, à juste titre pour lui-même, qu'une sortie ne coûte rien. Elle peut néanmoins coûter au Fonds, donc aux porteurs restants, dès lors que des parts encore bloquées doivent être cédées. L'exactitude du DIC n'est pas en cause — il décrit les frais du produit, non les moins-values de cession à l'actif — mais l'écart mérite d'être documenté au dossier, la question étant de celles que pose un contrôle."}],"internal_only":true},{"type":"tasks","title":"A. Rachats trimestriels — D = Date d'Etablissement de la VL trimestrielle (dernier Jour Ouvré de mars, juin, septembre et décembre)","lead":null,"columns":["N°","Description de la tâche","Délai convenu","Responsable"],"rows":[{"kind":"note","no":null,"text":"**RAPPEL** — Période de Blocage : aucun rachat n'est autorisé pendant dix-huit (18) mois à compter de la Date de Création (Prospectus 6.3(a)), soit jusqu'au 31 janvier 2028. Première Date de Centralisation des Rachats : 20 février 2028 (12h00) pour la VL du 31 mars 2028. Les demandes de rachat sont irrévocables, exécutées en numéraire uniquement, sans commission de rachat.","timeline":"","resp":"","r":4},{"kind":"task","no":"1","text":"Réception du Formulaire de Rachat (100 % des Parts ou montant / nombre de Parts, fractions admises), daté et signé, par la Société de Gestion via la plateforme AirFund, au plus tard à 12h00 (heure de Paris) le 40e jour calendaire précédant D (Date de Centralisation des Rachats — Prospectus 6.3(b)). En cas d'activation de la prolongation du préavis (6.3(g)), le délai applicable peut être porté jusqu'à 100 jours calendaires ; AirFund relaie l'information aux Investisseurs et aux Distributeurs. Les demandes reçues après la Date de Centralisation sont reportées au trimestre suivant.","timeline":"D-40 jours calendaires, 12h00","resp":"AirFund / Investisseur","r":5},{"kind":"task","no":"2","text":"Consolidation des demandes sur la Plateforme et contrôles : Parts disponibles au registre, dossier KYC à jour (un Investisseur bloqué ou suspendu ne peut être réglé), exclusion des opérations d'aller-retour du calcul du Seuil de Déclenchement ; estimation du ratio demandes / Actif Net attendu à D ; alerte à la Société de Gestion dès que le ratio dépasse le seuil d'alerte interne fixé par fundcraft Risques en deçà du Seuil de Déclenchement de 5 %.","timeline":"D-38 jours calendaires","resp":"fundcraft TA ; fundcraft Risques","r":6},{"kind":"task","no":"3","text":"Décision de la Société de Gestion sur les outils de gestion de la liquidité (Prospectus 6.3(c), (d) et (g)) : exécution intégrale ; plafonnement à titre provisoire au Seuil de Déclenchement (5 % de l'Actif Net à D) avec réduction proportionnelle de toutes les demandes, report irrévocable et pari passu de la fraction non exécutée sur le trimestre suivant, durée maximale de 18 mois à compter de la première demande ; prolongation du préavis jusqu'à 100 jours (durée maximale 12 mois sauf renouvellement motivé) ; suspension des rachats (durée maximale 12 mois). Décision documentée (dirigeants effectifs, sur avis de fundcraft Risques et du RCCI) ; information des Investisseurs par tout moyen, du Dépositaire et, en cas de suspension, de l'AMF.","timeline":"D-35 jours calendaires","resp":"Société de Gestion (dirigeants ; fundcraft Risques ; RCCI)","r":7},{"kind":"task","no":"4","text":"Plan de liquidité : couverture des rachats par la trésorerie de gestion (OPC monétaires, compte à vue) et, si nécessaire, par des rachats auprès des Fonds Sous-Jacents — préavis de 30 jours calendaires avant la fin du trimestre auprès de CVC, plafonnement de 5 % et soft lock-up de 18 mois (frais de 5 %) applicables au niveau des Fonds Sous-Jacents. Transmission des ordres de rachat aux Fonds Sous-Jacents (voir onglet « Investissements », section C).","timeline":"D-32 jours calendaires (au plus tard D-30)","resp":"fundcraft Gestion","r":8},{"kind":"task","no":"5","text":"Notification aux Investisseurs via la plateforme AirFund : confirmation de la prise en compte, ou information du plafonnement (prorata appliqué, fraction reportée) ; en cas d'exécution partielle, information particulière par lettre au porteur (Prospectus 6.3(c)).","timeline":"D-25 jours calendaires","resp":"fundcraft TA via AirFund","r":9},{"kind":"task","no":"6","text":"Date d'Etablissement de la VL trimestrielle ; le prix de rachat est calculé sur la première VL trimestrielle établie après la Date de Centralisation (cours inconnu — Prospectus 6.3(e)).","timeline":"D","resp":"CIC ; Société de Gestion","r":10},{"kind":"task","no":"7","text":"Validation et publication de la VL trimestrielle (au plus tard D+30 JO — Prospectus 1.10) ; calcul du nombre de Parts rachetées et des montants à régler par Investisseur sur la Plateforme ; contrôle 4 yeux.","timeline":"D+30 JO au plus tard","resp":"CIC ; fundcraft Risques ; Société de Gestion ; fundcraft TA","r":11},{"kind":"task","no":"8","text":"Instruction de paiement (double signature) et instruction d'annulation des Parts au registre ; règlement en numéraire par le Dépositaire au plus tard trente-quatre (34) Jours Ouvrés après D (Prospectus 6.3(f)) sur le compte bancaire de l'Investisseur enregistré (Annexe D). Les produits des rachats auprès des Fonds Sous-Jacents sont attendus 24 JO après la VL trimestrielle CVC.","timeline":"D+34 JO au plus tard","resp":"fundcraft Paiements ; BFCM","r":12},{"kind":"task","no":"9","text":"Avis d'opéré aux Investisseurs via AirFund ; mise à jour du registre et de la plateforme AirFund ; écritures comptables (annulation des Parts) ; investigation immédiate de tout paiement rejeté ou retourné avec AirFund.","timeline":"Règlement + 1 JO","resp":"BFCM ; AirFund ; CIC ; fundcraft Paiements","r":13},{"kind":"task","no":"10","text":"Rachats à l'initiative de la Société de Gestion (Prospectus 6.3(h)) et suivi de l'actif minimum : aucune Part ne peut être rachetée si la VL devient inférieure à 300 000 € ; si les Actifs restent inférieurs à ce montant pendant 30 jours calendaires, la Société de Gestion en informe l'AMF et procède à la fusion ou à la dissolution du Fonds (Règlement, art. 2 et 11).","timeline":"Continu","resp":"Société de Gestion ; fundcraft Risques","r":14},{"kind":"note","no":null,"text":"**NOTE** — Sauf accord écrit contraire, fundcraft n'interagit pas directement avec les Investisseurs à propos de leurs demandes de rachat ; les relances et explications relèvent d'AirFund et des Distributeurs. Les notifications prévues par le Prospectus (plafonnement, prolongation, suspension) sont émises par la Société de Gestion et relayées par AirFund.","timeline":"","resp":"","r":15}]},{"type":"tasks","title":"B. Distributions — politique de capitalisation (Prospectus 7)","lead":null,"columns":["N°","Description de la tâche","Délai convenu","Responsable"],"rows":[{"kind":"task","no":"1","text":"Les Parts A et B sont des Parts de capitalisation : la Société de Gestion réinvestit l'intégralité des Montants Distribuables ainsi que tout produit reçu des Fonds Sous-Jacents (Prospectus 7.2). Aucun flux de distribution vers les Investisseurs n'est prévu en régime courant ; toute décision contraire suivrait l'article 9 du Règlement et l'onglet « Gouvernance & Secrétariat ».","timeline":"N/A","resp":"Société de Gestion","r":19},{"kind":"task","no":"2","text":"Calcul des Montants Distribuables à chaque Date Comptable (31 décembre) par le Délégataire Comptable ; les intérêts sont comptabilisés selon la méthode de trésorerie ; une perte nette est amortie et déduite de la valeur des Actifs.","timeline":"Clôture annuelle","resp":"CIC","r":20},{"kind":"task","no":"3","text":"Distributions et produits reçus des Fonds Sous-Jacents (dividendes, retours de capital) : encaissement sur le compte courant du Fonds, rapprochement avec les avis des Fonds Sous-Jacents (Canoe / portail investisseur), information de fundcraft Gestion pour réinvestissement selon l'allocation cible.","timeline":"Réception + 2 JO","resp":"fundcraft Paiements ; fundcraft Gestion ; CIC","r":21}]}],"special":null,"doc":"prospectus","internal_only":false},{"id":"ops-nav","sheet":"VL & comptabilité","index":7,"group":"Dealing & VL","desc":"Le calcul de la VL mensuelle : dépendance aux VL des Fonds Sous-Jacents, fenêtre de revue, pack comptable.","blocks":[{"type":"tasks","title":"Processus de calcul de la VL mensuelle — J = Date d'Etablissement de la VL (dernier Jour Ouvré du mois)","lead":null,"columns":["N°","Description de la tâche","Délai convenu","Responsable"],"rows":[{"kind":"task","no":"1","text":"Tenue de la comptabilité du Fonds par le Délégataire Comptable (règlement ANC 2020-07 modifié ; Prospectus 14.1) : enregistrement des opérations sur les Fonds Sous-Jacents et la trésorerie, des souscriptions et rachats, des factures et provisions de frais. fundcraft transmet au fil de l'eau les instructions comptables issues de la Plateforme (souscriptions, rachats, investissements, factures) et met à disposition les relevés MT940.","timeline":"Continu","resp":"CIC ; fundcraft","r":4},{"kind":"task","no":"2","text":"Cut-off des factures, provisions et mises à jour comptables du mois : les éléments non transmis à cette date sont provisionnés sur la base des barèmes et pris en compte le mois suivant.","timeline":"J-5 JO","resp":"fundcraft Comptabilité ; AirFund (factures de conseil et de distribution)","r":5},{"kind":"task","no":"3","text":"Collecte des VL des Fonds Sous-Jacents (publiées 20 JO après la fin du mois par CVC) et des relevés de parts via le portail investisseur / Canoe et la side letter de transmission ; contrôle de cohérence (VL, nombre de parts, devise, mouvements du mois) ; conversion des positions en USD au cours de référence.","timeline":"J+20 JO","resp":"fundcraft Gestion","r":6},{"kind":"task","no":"4","text":"Transmission au Délégataire Comptable du dossier de VL : VL et relevés des Fonds Sous-Jacents, VL des OPC monétaires, mouvements de souscriptions et rachats (registre BFCM), barèmes et échéanciers de frais, taux de change.","timeline":"J+21 JO","resp":"fundcraft Gestion ; fundcraft Comptabilité","r":7},{"kind":"task","no":"5","text":"Rapprochements : bancaires (comptes courant et de collecte), titres (positions dans les Fonds Sous-Jacents et OPC monétaires vs relevés des agents de transfert), passif (registre tenu par BFCM vs Plateforme et Nombre Total de Parts).","timeline":"J+24 JO","resp":"CIC ; fundcraft Paiements","r":8},{"kind":"task","no":"6","text":"Calcul de la VL du Fonds et de la Valeur de chaque catégorie de Parts (Prospectus 3.1(c) et 14.2 : Fonds Sous-Jacents à leur dernière VL définitive ou, à défaut, estimée, avec décote discrétionnaire documentée le cas échéant ; OPC monétaires à leur VL ; liquidités à leur valeur nominale) ; projet de VL et pack comptable mis à disposition sur la Plateforme.","timeline":"J+25 JO","resp":"CIC","r":9},{"kind":"task","no":"7","text":"Contrôle de second niveau par fundcraft Risques : variation de la VL rapprochée des VL des Fonds Sous-Jacents et de l'effet de change, contrôle des frais et provisions (gestion, conseil, distribution, dépositaire, CAC, constitution), cohérence du Nombre Total de Parts et des flux de passif, respect des règles d'investissement et des limites internes, checklist VL. Les écarts sont traités avec CIC dans les 24 heures ; seules les erreurs dépassant le seuil de matérialité approuvé rouvrent le calcul.","timeline":"J+26 JO","resp":"fundcraft Risques","r":10},{"kind":"task","no":"8","text":"Validation de la VL et de la Valeur des Parts par la Société de Gestion (dirigeant ou gérant habilité) dans le processus Reporting Period Close de la Plateforme ; comité de valorisation en cas d'ajustement discrétionnaire ou d'événement significatif sur un Fonds Sous-Jacent.","timeline":"J+27 JO","resp":"Société de Gestion","r":11},{"kind":"task","no":"9","text":"Publication : transmission de la VL à l'AMF à la date de son calcul (Prospectus 1.10), au teneur de registre (inscription des Parts souscrites, annulation des Parts rachetées), à AirFund (plateforme, Distributeurs, site) et au Portail ; au plus tard trente (30) Jours Ouvrés après J.","timeline":"≤ J+30 JO","resp":"fundcraft Reporting ; fundcraft TA","r":12},{"kind":"task","no":"10","text":"Clôture du Reporting Period Close ; archivage du dossier de VL (calcul, contrôles, validation, communications) sur la Plateforme ; alimentation des indicateurs de risque et du calendrier des rachats (règlement au plus tard J+34 JO pour les VL trimestrielles).","timeline":"J+30 JO","resp":"fundcraft Risques ; fundcraft TA","r":13}]},{"type":"kv","title":"Suivi comptable avant VL","rows":[{"k":"AirFund dispose d'une visibilité quotidienne, via…","v":"AirFund dispose d'une visibilité quotidienne, via le tableau de bord de la Plateforme, des opérations enregistrées, des factures en attente et des points ouverts du processus Reporting Period Close ; cela réduit les surprises au moment de la VL."},{"k":"Le cycle d'une VL commence à…","v":"Le cycle d'une VL commence à la validation formelle de la VL précédente ; les dates de cut-off, de transmission et de revue s'y rattachent. Les provisions annuelles (CAC, Dépositaire, Frais de Constitution) sont convenues avant le premier cycle de l'exercice et revues avant la VL du 31 décembre."}]},{"type":"kv","title":"Inputs, formats et contenus convenus","rows":[{"k":"La VL est un calcul «…","v":"La VL est un calcul « à inputs complets » : VL définitives des Fonds Sous-Jacents, relevés du registre et relevés bancaires. Lorsqu'une VL définitive n'est pas disponible à la date prévue, la dernière VL définitive ou estimée communiquée par le gestionnaire du Fonds Sous-Jacent peut être utilisée (Prospectus 14.2) ; le cas est documenté (motif, impact, suite donnée) et revu au comité de valorisation."},{"k":"Les formats du pack comptable (VL…","v":"Les formats du pack comptable (VL, balance, grand livre, inventaire, état des souscriptions et rachats, rapprochements) sont convenus avec le Délégataire Comptable lors de l'onboarding et ne changent pas en cours de cycle."}]},{"type":"kv","title":"Fenêtre de revue unique et seuil de matérialité","rows":[{"k":"La revue du projet de VL…","v":"La revue du projet de VL est réalisée en une fois, dans les 24 heures suivant sa mise à disposition ; seules des erreurs ou omissions matérielles rouvrent le calcul. Le seuil de matérialité des erreurs de VL est approuvé par la gouvernance de la Société de Gestion conformément à la doctrine AMF ; les erreurs constatées après publication suivent la politique d'erreurs de VL (correction, information des Investisseurs et du Dépositaire, indemnisation le cas échéant)."},{"k":"Le délai maximal de publication est…","v":"Le délai maximal de publication est de trente (30) Jours Ouvrés après la Date d'Etablissement de la VL (Prospectus 1.10) ; il tient compte de la réception des VL définitives des Fonds Sous-Jacents (J+20 JO). Le calendrier interne vise J+27 JO pour la validation afin de préserver une marge de trois Jours Ouvrés."}]},{"type":"kv","title":"Signature et VL semestrielles","rows":[{"k":"La validation formelle de la VL…","v":"La validation formelle de la VL par la Société de Gestion est enregistrée sur la Plateforme. La VL du 30 juin est contrôlée et celle du 31 décembre certifiée par le Commissaire aux Comptes (Prospectus 1.10) ; l'inventaire semestriel est établi dans les six semaines sous le contrôle du Dépositaire et la composition des Actifs, certifiée par le CAC, est mise à disposition des Investisseurs dans les huit semaines (Prospectus 11.3(a))."},{"k":"Comptes annuels : le rapport du…","v":"Comptes annuels : le rapport du Commissaire aux Comptes est produit dans les quatre mois de la clôture et le rapport annuel mis à disposition des Investisseurs dans les cinq mois (Prospectus 11.3(c)). Un calendrier d'audit est convenu chaque année entre fundcraft, CIC, BFCM et Aplitec, avec une répartition des responsabilités et un chemin d'escalade."}]},{"type":"kv","title":"Pack comptable (Délégataire Comptable)","rows":[{"k":"- VL et Valeur des Parts par catégorie","v":"- VL et Valeur des Parts par catégorie"},{"k":"- Balance générale et grand livre (mensuel)","v":"- Balance générale et grand livre (mensuel)"},{"k":"- Inventaire détaillé du portefeuille (mensuel)","v":"- Inventaire détaillé du portefeuille (mensuel)"},{"k":"- État des souscriptions, rachats et mouvements de Parts (mensuel)","v":"- État des souscriptions, rachats et mouvements de Parts (mensuel)"},{"k":"- Rapprochements bancaires, titres et passif (mensuel)","v":"- Rapprochements bancaires, titres et passif (mensuel)"},{"k":"- Bilan, compte de résultat et annexe (semestriel et annuel)","v":"- Bilan, compte de résultat et annexe (semestriel et annuel)"},{"k":"- Liasse fiscale et attestation de performance (annuel)","v":"- Liasse fiscale et attestation de performance (annuel)"},{"k":"- Formats PDF et Excel, déposés sur la Plateforme","v":"- Formats PDF et Excel, déposés sur la Plateforme"}]}],"special":null,"doc":"prospectus","internal_only":false},{"id":"ops-cash","sheet":"Trésorerie & factures","index":8,"group":"Dealing & VL","desc":"Paiements d'investissement, transferts de trésorerie et circuit d'approbation des factures.","blocks":[{"type":"tasks","title":"A. Paiements d'investissement et transferts de trésorerie (T = date de règlement)","lead":null,"columns":["N°","Description de la tâche","Délai convenu","Responsable"],"rows":[{"kind":"task","no":"1","text":"Instruction écrite de paiement émise par fundcraft Gestion après approbation de l'opération (Comité d'investissement ou cadre de déploiement approuvé) : montant et devise, bénéficiaire et IBAN (agent de transfert du Fonds Sous-Jacent ou OPC monétaire), référence de l'opération, date de règlement souhaitée. Préavis minimal de trois (3) Jours Ouvrés.","timeline":"T-3 JO","resp":"fundcraft Gestion","r":4},{"kind":"task","no":"2","text":"Vérification de l'instruction : processus d'investissement approuvé sur la Plateforme, KYA finalisé, documents signés présents, cohérence de l'IBAN avec la documentation du Fonds Sous-Jacent, disponibilité de la trésorerie, information préalable du Dépositaire effectuée.","timeline":"T-2 JO","resp":"fundcraft Paiements (4 yeux)","r":5},{"kind":"task","no":"3","text":"Saisie de l'ordre dans l'outil de connectivité bancaire (message SWIFT MT101 vers BFCM via Finologee) à partir du compte courant du Fonds, ou du compte de collecte pour un déploiement anticipé ; validation par deux signataires habilités selon la matrice de pouvoirs bancaires.","timeline":"T-1 JO","resp":"fundcraft Paiements ; signataires habilités","r":6},{"kind":"task","no":"4","text":"Exécution par le Dépositaire sous réserve de provision suffisante et des heures limites de la banque ; le Dépositaire exerce son suivi des flux de trésorerie (AIFMD art. 21) et vérifie la conformité de l'opération aux Documents du Fonds.","timeline":"T","resp":"BFCM","r":7},{"kind":"task","no":"5","text":"Confirmation d'exécution, rapprochement du relevé MT940, mise à jour de la position et du suivi de trésorerie ; information d'AirFund via le tableau de bord de la Plateforme. Tout rejet (frais de 20 € par rejet) est analysé le jour même.","timeline":"T+1 JO","resp":"fundcraft Paiements ; fundcraft Risques","r":8}]},{"type":"tasks","title":"B. Factures du Fonds — réception, approbation et paiement","lead":null,"columns":["N°","Description de la tâche","Délai convenu","Responsable"],"rows":[{"kind":"task","no":"1","text":"Tous les prestataires du Fonds (AirFund pour la Commission de Conseil et la Commission de Distribution, Dépositaire, Délégataire Comptable, CAC, conseils) adressent leurs factures à la Shared Mailbox airfund@clients.fundcraft.fr avec l'objet « Facture — AirFund CVC » ; fundcraft accuse réception sous 24 à 48 heures. AirFund n'enregistre pas elle-même de facture sur la Plateforme.","timeline":"Réception","resp":"Prestataires ; AirFund","r":12},{"kind":"task","no":"2","text":"Enregistrement de la facture dans le module Factures & Paiements de la Plateforme (boîte de réception) et saisie des données (compte, nature de charge, période, lignes).","timeline":"Réception + 1 JO","resp":"fundcraft Paiements","r":13},{"kind":"task","no":"3","text":"Contrôle de la facture au regard des barèmes du Prospectus (art. 9) et des conventions : assiette (Actif Net de la catégorie de Parts), taux par tranche, période et prorata temporis, montants minimums, TVA applicable ; rapprochement avec les provisions du Délégataire Comptable ; passage en approbation sous 24 à 48 heures.","timeline":"Réception + 2 JO","resp":"fundcraft Comptabilité","r":14},{"kind":"task","no":"4","text":"Approbation par la Société de Gestion (dirigeant habilité) des factures du Fonds. Pour les factures de fundcraft (Commission de Gestion, diligences KYC), AirFund est informée pour information ; le Dépositaire vérifie la conformité au barème du Prospectus dans le cadre de son suivi des flux.","timeline":"Approbation","resp":"Société de Gestion","r":15},{"kind":"task","no":"5","text":"Contrôle 4 yeux et double signature de l'ordre de paiement (SWIFT MT101) ; exécution par le Dépositaire ; statut « En paiement » puis « Payé » après rapprochement du relevé MT940. Le tableau de bord de la Plateforme permet à AirFund de suivre le statut de chaque facture.","timeline":"Approbation + 2 JO","resp":"fundcraft Paiements ; BFCM","r":16},{"kind":"task","no":"6","text":"Provisions : fundcraft transmet au Délégataire Comptable les barèmes, échéanciers et factures afin que les frais soient provisionnés dans chaque VL mensuelle (Commission de Gestion, Commission de Conseil, Commission de Distribution, Dépositaire, Délégataire Comptable, CAC, amortissement des Frais de Constitution).","timeline":"Mensuel, avant J+21 JO","resp":"fundcraft Comptabilité ; CIC","r":17},{"kind":"note","no":null,"text":"**NOTE** — Les factures présentant une anomalie (écart de barème, période, TVA, IBAN) sont revues au comité opérationnel mensuel ; un membre de fundcraft Paiements y participe en cas d'incident. Le suivi de la disponibilité de la trésorerie du Fonds relève de la Société de Gestion ; tous les flux transitent par les comptes du Fonds ouverts chez le Dépositaire.","timeline":"","resp":"","r":18}]}],"special":null,"doc":"prospectus","internal_only":false},{"id":"fees-tool","sheet":"Modèle de frais","index":9,"group":"Dealing & VL","desc":"Modèle de frais Fundcraft intégré (classeur v3) : saisie des paramètres et du barème à cinq tranches, récap par palier d'Actif Net, détail Dépositaire / Valorisation, provision à la VL et prévisionnel de trésorerie.","blocks":[],"special":"fees","doc":"prospectus","internal_only":false},{"id":"ops-reporting","sheet":"Reporting","index":10,"group":"Reporting & gouvernance","desc":"Les obligations de reporting du Fonds — AMF, Annex IV, FATCA/CRS, PRIIPs, rapport de gestion — et qui les porte.","blocks":[{"type":"table","title":null,"columns":["Document","Contenu et diffusion","Délai","Producteur / diffusion"],"rows":[["Avis d'opéré","Confirmation de chaque souscription, rachat ou cession inscrite au registre.","Inscription + 2 JO","BFCM (teneur de registre) via AirFund"],["VL et Valeur des Parts","VL mensuelle du Fonds et Valeur des Parts A et B ; communiquée sur demande écrite (Prospectus 1.11) et mise à disposition sur la plateforme AirFund.","≤ J+30 JO","fundcraft Reporting ; AirFund"],["Relevé de situation","Position de l'Investisseur (nombre de Parts, Valeur, montant investi).","Mensuel, VL + 2 JO","fundcraft TA / BFCM via AirFund"],["Rapport de gestion trimestriel","Commentaire de gestion et de marché (AirFund), composition du portefeuille, VL et performance, souscriptions et rachats, liquidité (utilisation du Seuil de Déclenchement), risques. Validé par AirFund au titre de la convention de conseil et approuvé par la Société de Gestion.","Dans les 8 semaines suivant la fin du trimestre","fundcraft Reporting ; AirFund"],["Composition des Actifs (semestrielle)","Inventaire certifié par le CAC, sous la supervision du Dépositaire (Prospectus 11.3(a)).","8 semaines après chaque semestre","CIC ; Aplitec ; fundcraft Reporting"],["Rapport semestriel","Rapport au 30 juin incluant les informations de l'art. 421-34 IV RGAMF : part des Actifs faisant l'objet d'un traitement spécial du fait de leur illiquidité, nouvelles dispositions de gestion de la liquidité, profil de risque et systèmes de gestion des risques (Prospectus 1.12 et 11.3(b)).","2 m  FRANCE SAS ET CIC\" signé le 24/06/2026, section II.B.1 \"Rapport annuel\" : commission forfaitaire de 800€HT par an et par FIA. ⚠ Précédemment classée par erreur sous \"Valorisation\" — c'est une prestation de reporting.","tva":0.2,"freq":"Annuel","regle_facturation":"standard","prorata_lancement":"Oui"},{"id":"valorisation","n":9,"actif":"Oui","nom":"Valorisation (CIC)","beneficiaire":"Valorisateur (CIC / SOC Asset Servicing)","recurrent":"Oui","mode":"bareme","classe_taux":"global","plancher":0,"plafond":null,"tranches":[{"inf":0,"sup":40000000,"nature":"Palier","valeur":{"ref":"valo_p1"}},{"inf":40000000,"sup":80000000,"nature":"Palier","valeur":{"ref":"valo_p2"}},{"inf":80000000,"sup":120000000,"nature":"Palier","valeur":{"ref":"valo_p3"}},{"inf":120000000,"sup":null,"nature":"Palier","valeur":{"ref":"valo_p4"}},{"inf":0,"sup":null,"nature":"Forfait","valeur":{"ref":"valo_supplement"}}],"source":"Annexe Tarifaire du \"CONTRAT DE DELEGATION DE VALORISATION ENTRE FUNDCRAFT FRANCE SAS ET CIC\" signé le 24/06/2026, section I.B. 4 tranches \"Palier\" exclusives par Actif Net (0-40M/40-80M/80-120M/>120M€), montant selon la fréquence de VL choisie en §3C, majoré de +10% (3-4 catégories de parts) ou +15% (5 et plus, cas d'Openstone avec 9 classes), + supplément de 500€ par tranche de 10 lignes de portefeuille au-delà de 10 (tranche Forfait séparée, toujours active). ⚠ Remplace le précédent forfait de 12.000€ (recopié par erreur du Dépositaire). Le barème \"Période de liquidation de l'OPC\" (14.000€/12.000€) n'est pas modélisé ici (dépend du statut du fonds, pas de l'AUM) : à activer manuellement le cas échéant.","tva":0.2,"freq":"Semestriel","regle_facturation":"standard","prorata_lancement":"Oui"},{"id":"reporting_aifm","n":10,"actif":"Non","nom":"Reporting AIFM (part refacturée au fonds)","beneficiaire":"Prestataire reporting","recurrent":"Oui","mode":"bareme","classe_taux":"global","plancher":0,"plafond":null,"tranches":[{"inf":0,"sup":null,"nature":"Forfait","vale eur":0},{"inf":0,"sup":0,"nature":"Taux","valeur":0},{"inf":0,"sup":0,"nature":"Taux","valeur":0}],"source":"116€HT par OPC et par mois, soit 1.392€HT/an (116 x 12) — forfait fixe indépendant de l'Actif Net du fonds. Facturé et payé mensuellement (virement automatique le 10 de chaque mois, par fonds) — fréquence \"Mensuel\" pré-réglée dans 05_Tresorerie §3 en conséquence. SANS PRORATA sur le mois de lancement (confirmé par Apolline, 14/09/2026 : \"un mois entamé est dû en totalité\") — contrairement aux autres postes mensuels, dont le tout premier mois est proratisé en jours ouvrés (05_Tresorerie §1/§5) : le virement Finologee est un forfait mensuel fixe, pas un service facturé au prorata du temps réellement presté. Poste TOUJOURS présent, sur tous les fonds Fundcraft (confirmé par Apolline, 14/09/2026) : traité comme les autres plaquettes tarifaires prestataires (Dépositaire BFCM, Valorisation/Reporting CIC) — verrouillé (gris), pas une donnée propre au fonds testé. ⚠ Confiance MOYENNE sur le montant : information communiquée directement par Apolline en conversation, non retrouvée à ce jour dans une convention Finologee signée dans les pièces disponibles pour AirFund — à sourcer avec le contrat Finologee dès qu'il est disponible et à corriger ici si le montant réel diffère.","tva":0.2,"freq":"Mensuel","regle_facturation":"standard","prorata_lancement":"Non"},{"id":"kyc","n":13,"actif":"Oui","nom":"Frais KYC (au-delà du forfait inclus)","beneficiaire":"Société de Gestion (Fundcraft)","recurrent":"Oui","mode":"kyc","classe_taux":"global","plancher":0,"plafond":null,"tranches":[{"inf":0,"sup":0,"nature":"Taux","valeur":0},{"inf":0,"sup":0,"nature":"Taux","valeur":0},{"inf":0,"sup":0,"nature":"Taux","valeur":0},{"inf":0,"sup":0,"nature":"Taux","valeur":0},{"inf":0,"sup":0,"nature":"Taux","valeur":0}],"source":"Prospectus Art. 9.2(f)(i) : 100 diligences KYC incluses par tranche cumulée de 100 M€ ; au-delà, 10 € par diligence. Formule du classeur : MAX(0 ; Investisseurs PUT - 4. FRAIS & PROVISIONS DU FONDS","items":[{"k":"Description","v":"Une ligne par frais ou provision du fonds (jusqu'à 5 tranches Forfait/Taux/Palier chacune). Forfait = montant fixe dès que l'AUM atteint la borne inférieure (plusieurs Forfait sur une même ligne se cumulent — utile pour un forfait de base + un montant variable par ailleurs, comme la Tenue du Passif). Taux = portion de l'AUM dans la tranche x taux, par palier d'imposition si plusieurs tranches Taux se suivent. Palier = montant fixe EXCLUSIF de la tranche atteinte (ne se cumule PAS avec les autres — ex. barème de Valorisation CIC par tranche d'actif). Le résultat est plafonné par le bas par le \"Plancher annuel\" ET par le haut par le \"Plafond annuel\". Le barème Forfait/Taux/Palier n'est utilisé que si \"Mode de calcul\" = \"Barème\" (colonne dédiée du tableau)."},{"k":"Mode de calcul","v":"Par défaut \"Barème (Forfait/Taux/Palier)\" : utilise le barème de la ligne. Pour un fonds où un poste varie par classe de parts (ex. Openstone) : \"Résiduel vs Gestion\" = Cible Gestion+Conseil de la classe sélectionnée (01_Input §3B) x AUM − Commission de Gestion (sans son plancher) ; \"Taux Classe sélectionnée\" = Taux (ex. de Distribution) de la classe sélectionnée x AUM. Optionnel : ignorez si votre fonds n'a pas ce mécanisme (voir 02_Classes_de_Parts)."},{"k":"Méthode","v":"Basculez \"Actif\" sur Non plutôt que de supprimer une ligne : 04_Recap s'ajuste automatiquement. Désactivez ou dupliquez une ligne pour représenter un frais propre à une classe de parts spécifique si nécessaire. Les postes à tranches multiples (Commission de Conseil, Délégataire Comptable) se paramètrent en 01_Input §3D plutôt que dans le tableau : les cases Valeur correspondantes y sont verrouillées et suivent automatiquement ces paramètres. Les 2 lignes de Distribution (mode \"Taux Classe sélectionnée\") suivent, de la même façon, 02_Classes_de_Parts."},{"k":"Source","v":"Prospectus Openstone Infraworld du 03/09/2026 (Article 27) ; grille tarifaire dépositaire BFCM - Fundcraft France du 01/03/2026 ; offre tarifaire valorisation/reporting CIC / SOC Asset Servicing du 25/03/2026 ; lettre de mission / e-mail du Commissaire aux Comptes (Maxime Gallet, Aplitec) du 11/09/2026."}]},{"title":"02_CLASSES_DE_PARTS","items":[{"k":"Description","v":"Chaque classe porte ses propres taux de Commission de Distribution : \"Distributeur Global\" et \"Sous-distributeurs\" sont 2 étages distincts, à 2 bénéficiaires différents, mis à 0% l'un d'eux si votre fonds n'a qu'un seul étage (cas d'Openstone : Sous-distributeurs = 0% partout). La colonne \"Distribuante ?\" est un attribut structurel séparé (capitalisante vs distribuante) — sert notamment à activer le forfait CAC \"par distribution\" (01_Input) selon la classe testée, indépendamment du taux de rétrocession. Dans 01_Input, vous choisissez UNE classe — celle sur laquelle 04_Recap calcule le détail. Un poste en mode \"Taux Classe sélectionnée\" = Taux de cette classe x AUM. Le nombre de lignes renseignées (nom non vide) est aussi repris automatiquement en 01_Input §3C comme \"Nombre de catégories de parts du fonds\"."},{"k":"Méthode","v":"Calcul \"une classe à la fois\" (pas de mix pondéré multi-classes) : plus simple à lire, à condition de relancer le calcul pour chaque classe qui vous intéresse en changeant la sélection en 01_Input. Reste valable même si le taux \"Distributeur Global\" porte, au Prospectus, sur une assiette combinant plusieurs classes (ex. Parts A+B) TANT QUE ce taux est identique pour toutes les classes concernées — sinon, le résultat dépend de la classe choisie dans le sélecteur, ce qui ne représente plus une répartition réelle multi-classes de l'AUM (limite structurelle de l'onglet, pas un point de saisie). Une ligne avec un nom de classe vide n'apparaît pas dans la liste déroulante du sélecteur (ni dans le décompte du nombre de catégories)."},{"k":"Source","v":"Grille de frais transmise par Nadim ; Prospectus Openstone Infraworld du 03/09/2026, Article 27 (exemple vivant — à effacer/adapter pour un autre fonds). Structure à 2 étages (Distributeur Global / Sous-distributeurs) ajoutée suite à la revue du Prospectus AirFund Conviction Value Capital du 22/06/2026, Article 9.7. Colonne \"Distribuante ?\" ajoutée suite à la lettre de mission / e-mail du Commissaire aux Comptes (Maxime Gallet, Aplitec) du 11/09/2026."}]},{"title":"03_DETAIL_DEPOSITAIRE_VALO","items":[{"k":"Description","v":"Deux mécanismes rendent ces postes moins lisibles qu'un simple taux : le Dépositaire a un plancher ET un plafond annuels (le taux plein ne s'applique qu'entre les deux) ; la Valorisation dépend de la tranche d'actif atteinte (barème \"Palier\", exclusif), de la fréquence de VL choisie, d'une majoration selon le nombre de catégories de parts, et d'un supplément si le portefeuille dépasse 10 lignes."},{"k":"Méthode","v":"Les paramètres actifs (taux, plancher, plafond, fréquence VL, majoration...) sont rappelés une seule fois en tête de l'onglet. Le tableau plus bas répète ensuite le calcul complet sur toute l'échelle d'AUM testée en 01_Input (mêmes colonnes que 04_Recap), pour voir à quel niveau d'actif chaque mécanisme prend le relais. Les lignes \"Écart vs 04_Recap\" doivent toujours afficher 0 : elles prouvent que ce détail correspond exactement au calcul de 04_Recap."},{"k":"Source","v":"Grille tarifaire dépositaire BFCM - Fundcraft France du 01/03/2026 ; offre tarifaire valorisation/reporting CIC / SOC Asset Servicing du 25/03/2026."}]},{"title":"05_TRESORERIE - FRAIS DE CONSTITUTION","items":[{"k":"Principe","v":"Les Frais de Constitution sont actifs par défaut (60.000€, Article 27.1 : MAX(60.000€, 1,25% Actif Net au 1er anniversaire)), amortis mensuellement jusqu'à la fin de l'exercice comptable 1. Indication du CAC : l'amortissement sur 5 exercices n'est pas autorisé — plus de lissage au-delà de l'exercice qui contient le 1er anniversaire du fonds."},{"k":"Ré-amortissement dynamique","v":"Dès qu'une facture réelle (avec sa Date de facturation) est saisie dans le tableau de suivi, elle est déduite du montant cible de la fenêtre en cours (60.000€ pour l'exercice 1, complément éventuel pour l'exercice de l'anniversaire) ; le solde restant est ré-étalé automatiquement, à parts égales, sur les mois restants de cette fenêtre — recalculé mois par mois à chaque nouvelle facture saisie, jusqu'à absorber tout le solde au dernier mois de la fenêtre. La vue cash reste pilotée séparément par la Date de paiement de chaque facture (décision du 11/09/2026)."}]}],"ref_labels":{"seuil_t1":"Seuil tranche 1 → 2 (§3D)","seuil_t2":"Seuil tranche 2 → 3 (§3D)","gestion_t1":"Commission de Gestion, tranche 1 (§3D)","gestion_t2":"Commission de Gestion, tranche 2 (§3D)","gestion_t3":"Commission de Gestion, tranche 3 (§3D)","conseil_t1":"Commission de Conseil, tranche 1 (§3D)","conseil_t2":"Commission de Conseil, tranche 2 (§3D)","conseil_t3":"Commission de Conseil, tranche 3 (§3D)","distrib_global_classe":"Taux Distributeur Global de la classe sélectionnée (§3B)","distrib_sous_classe":"Taux Sous-distributeurs de la classe sélectionnée (§3B)","cac_distribution":"Nombre de distributions × coût par distribution, si la classe distribue (§3)","valo_p1":"Palier CIC 0–40 M€ selon la fréquence de VL, majoration comprise (§3C)","valo_p2":"Palier CIC 40–80 M€ (§3C)","valo_p3":"Palier CIC 80–120 M€ (§3C)","valo_p4":"Palier CIC > 120 M€ (§3C)","valo_supplement":"Supplément de 500 € par tranche de 10 lignes au-delà de 10 (§3C)","tenue_passif_variable":"Coût marginal par investisseur × nombre d’investisseurs (§3)","constitution_montant":"MAX(plancher ; taux × Actif Net au 1er anniversaire) (§3)","constitution_plancher":"Plancher des Frais de Constitution (§3)"},"sensitivities":[{"id":"gestion-1bp","label":"± 1 bp sur la Commission de Gestion (3 tranches)","ops":[{"path":"baremes.gestion.0","delta":0.0001},{"path":"baremes.gestion.1","delta":0.0001},{"path":"baremes.gestion.2","delta":0.0001}]},{"id":"conseil-5bp"
