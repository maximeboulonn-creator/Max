<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Risk Studio Alerte précoce</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Carlito:ital,wght@0,400;0,700;1,400&display=swap">
<style>
/* Risk Studio - famille des consoles. Feuille commune aux quatre consoles :
   jetons de couleur, en-tête, statuts, indicateurs, vues secondaires.
   Calibri 9, palette Fundcraft ; rouge et ocre réservés aux alertes, en texte.
   Rien n'est figé : la page défile d'un bloc. Aucun quadrillage : filets horizontaux. */
:root {
  --bg: #F4F7F7;
  --surface: #FFFFFF;
  --ink: #1A2027;
  --muted: #5A6B72;
  --faint: #9AA6AB;
  --rule: #E0E0E0;
  --navy: #2F4858;
  --bar: #2F4858;
  --bar-soft: #C9D6DC;
  --teal: #218E8E;
  --lime: #D9F785;
  --crit: #A3221B;
  --warn: #8A5A00;
  --sel: #EBFCF9;
  --hover: #F0F4F4;
  --font: Calibri, Carlito, "Segoe UI", Arial, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0F1417; --surface: #161D21; --ink: #E4EAEC; --muted: #9AA8AE; --faint: #66757C; --rule: #283238;
    --navy: #C9D6DC; --bar: #8FB0C2; --bar-soft: #2C3A42; --teal: #5CC3C3; --crit: #F08A80; --warn: #E2B85A;
    --sel: #183034; --hover: #1B2428; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0F1417; --surface: #161D21; --ink: #E4EAEC; --muted: #9AA8AE; --faint: #66757C; --rule: #283238;
  --navy: #C9D6DC; --bar: #8FB0C2; --bar-soft: #2C3A42; --teal: #5CC3C3; --crit: #F08A80; --warn: #E2B85A;
  --sel: #183034; --hover: #1B2428; color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 9pt; line-height: 1.4; }
[hidden] { display: none !important; }
button, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--teal); outline-offset: 1px; }
a { color: var(--teal); text-decoration: none; }
a:hover { text-decoration: underline; }
h1, h2, h3 { text-wrap: balance; }

.shell { max-width: 1360px; margin-inline: auto; padding-inline: 24px; padding-block: 0 56px; }
.bar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 28px; padding-block: 14px 0; border-bottom: 1px solid var(--rule); }
.brand { display: flex; align-items: baseline; gap: 10px; padding-bottom: 10px; }
.brand .name { font-size: 12pt; font-weight: 700; color: var(--navy); }
.brand .ent { color: var(--muted); }
.views { display: flex; flex-wrap: wrap; gap: 0 18px; }
.views button { background: none; border: 0; border-bottom: 3px solid transparent; padding: 2px 0 9px; color: var(--muted); cursor: pointer; }
.views button:hover { color: var(--ink); }
.views button[aria-selected="true"] { color: var(--ink); font-weight: 700; border-bottom-color: var(--lime); }
.tools { margin-left: auto; display: flex; align-items: center; gap: 14px; padding-bottom: 10px; }
.tools label { color: var(--muted); }
.tools select { background: var(--surface); border: 1px solid var(--rule); padding: 1px 4px; }
.quiet { background: none; border: 0; padding: 0; color: var(--muted); cursor: pointer; }
.quiet:hover { color: var(--ink); text-decoration: underline; }
.demo { margin: 8px 0 0; color: var(--muted); font-size: 8pt; }
.foot { margin-top: 28px; color: var(--muted); font-size: 8pt; }

.lbl { margin: 0 0 8px; font-size: 8pt; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.muted { color: var(--muted); }
.faint { color: var(--faint); }
.n { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
.nw { white-space: nowrap; }
.lk { background: none; border: 0; padding: 0; color: var(--teal); cursor: pointer; text-align: left; }
.lk:hover { text-decoration: underline; }
.scroll { overflow-x: auto; }
.panel { background: var(--surface); border: 1px solid var(--rule); padding: 14px 16px 16px; min-width: 0; }
p.note { margin: 8px 0 0; color: var(--muted); }

.c-DEP { color: var(--crit); font-weight: 700; }
.c-SURV { color: var(--warn); }
.c-MAN { font-style: italic; }
.c-OK { color: var(--muted); }
.c-NA { color: var(--faint); }
.prio-Haute { color: var(--crit); font-weight: 700; }
.prio-Moyenne { color: var(--ink); }
.prio-Basse { color: var(--muted); }
.st-risk { color: var(--crit); font-weight: 700; }

/* chiffres de synthèse */
.summary { display: flex; flex-wrap: wrap; gap: 10px 40px; margin: 18px 0 20px; }
.fig { background: none; border: 0; padding: 0; text-align: left; display: grid; }
button.fig { cursor: pointer; }
button.fig:hover span { text-decoration: underline; }
.fig b { font-size: 20pt; line-height: 1.05; font-variant-numeric: tabular-nums; }
.fig span { color: var(--muted); }

/* indicateur détaillé */
.it { display: grid; grid-template-columns: minmax(0, 2.2fr) minmax(120px, 1fr) 164px minmax(120px, 1fr); gap: 6px 18px;
      padding: 12px 0; border-bottom: 1px solid var(--rule); align-items: start; }
.it:last-child { border-bottom: 0; }
.it .nm b { display: block; }
.it .val b { display: block; font-size: 14pt; line-height: 1.1; font-variant-numeric: tabular-nums; }
.it .more { grid-column: 1 / -1; display: grid; grid-template-columns: 90px minmax(0, 1fr); gap: 2px 12px; margin: 0; }
.it .more dt { color: var(--muted); }
.it .more dd { margin: 0; }
.flash { animation: flash 1.6s ease-out; }
@keyframes flash { from { background: var(--sel); } to { background: transparent; } }
.spark { display: block; max-width: 100%; height: auto; }
.spark .ln { fill: none; stroke: var(--ink); stroke-width: 1.5; }
.spark .pt { fill: var(--surface); stroke: var(--ink); stroke-width: 1.2; }
.spark .pt.cur { fill: var(--ink); }
.spark .al { stroke: var(--warn); stroke-width: 1; stroke-dasharray: 3 3; }
.spark .lim { stroke: var(--crit); stroke-width: 1; stroke-dasharray: 3 3; }
.sx { display: flex; justify-content: space-between; color: var(--faint); font-size: 8pt; width: 164px; max-width: 100%; }

/* listes d'actions et d'échéances */
ol.plain, ul.plain { list-style: none; margin: 0; padding: 0; }
.todo { display: grid; grid-template-columns: 58px minmax(0, 1fr); gap: 2px 10px; padding: 8px 0; border-bottom: 1px solid var(--rule); }
.todo:first-child { padding-top: 0; }
.todo:last-child { border-bottom: 0; }
.todo .when b { display: block; font-variant-numeric: tabular-nums; }
.todo .when span { color: var(--muted); font-size: 8pt; }
.todo .what p { margin: 0 0 2px; }

.seg { display: flex; gap: 2px; margin: 4px 0; max-width: 220px; }
.seg i { flex: 1; height: 5px; background: var(--rule); }
.seg i.done { background: var(--bar); }
.seg i.cur { background: var(--teal); }

/* vues secondaires */
.view-h { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: baseline; gap: 6px 20px; margin: 20px 0 12px; }
.view-h h1 { margin: 0; font-size: 12pt; }
.chips { display: flex; flex-wrap: wrap; gap: 4px 6px; align-items: center; margin-bottom: 8px; }
.chips .k { color: var(--muted); margin-right: 4px; min-width: 46px; }
.chip { background: var(--surface); border: 1px solid var(--rule); padding: 2px 9px; cursor: pointer; }
.chip:hover { border-color: var(--muted); }
.chip[aria-pressed="true"] { background: var(--navy); border-color: var(--navy); color: var(--surface); font-weight: 700; }
.chip .ct { opacity: .7; margin-left: 4px; font-variant-numeric: tabular-nums; }
table { border-collapse: collapse; width: 100%; }
.list th { text-align: left; font-weight: 700; color: var(--muted); padding: 0 12px 6px 0; border-bottom: 1px solid var(--rule); vertical-align: bottom; white-space: nowrap; }
.list td { padding: 6px 12px 6px 0; border-bottom: 1px solid var(--rule); vertical-align: top; }
.list th.n, .list td.n { text-align: right; }
.list tbody tr.go { cursor: pointer; }
.list tbody tr.go:hover > td { background: var(--hover); }
.list tr.grp td { padding-top: 16px; font-size: 8pt; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.list tr.det > td { padding: 0 0 4px; }
.list tr.det .it { border-bottom: 0; }

/* barres de couverture de liquidité */
.liq { display: grid; gap: 4px; }
.liq-row { display: grid; grid-template-columns: 64px minmax(0, 1fr) 56px; gap: 10px; align-items: center; }
.track { position: relative; height: 16px; }
.track .b { position: absolute; left: 0; top: 2px; bottom: 2px; background: var(--bar); }
.track .b.low { background: var(--crit); }
.track .ref { position: absolute; top: -3px; bottom: -3px; border-left: 1px dashed var(--crit); }
.track .ref.al { border-left-color: var(--warn); }
.axis { position: relative; height: 14px; margin-left: 74px; margin-right: 66px; color: var(--faint); font-size: 8pt; }
.axis span { position: absolute; transform: translateX(-50%); white-space: nowrap; }
.liq-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(380px, 1fr)); gap: 18px; }
.liq-grid > .panel h2 { margin: 0 0 2px; font-size: 10pt; }
.hyp { margin: 0; padding-left: 16px; max-width: 120ch; }
.hyp li { margin-bottom: 3px; }
.studios { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 0 28px; }
.studio { padding: 10px 0; border-bottom: 1px solid var(--rule); }
.studio b { display: block; }

@media (max-width: 760px) {
  .it { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
  .it .nm { grid-column: 1 / -1; }
  .it .more { grid-template-columns: 1fr; }
  .liq-grid { grid-template-columns: 1fr; }
}
@media (max-width: 600px) {
  .shell { padding-inline: 16px; }
  .tools { margin-left: 0; }
  .summary { gap: 10px 26px; }
}
@media (prefers-reduced-motion: reduce) { .flash { animation: none; } }

/* Console 4 - alerte précoce. Question : qu'est-ce qui va casser, et quand ?
   Chaque indicateur est lu comme une trajectoire : marge consommée, pente mensuelle,
   date projetée d'atteinte du seuil d'alerte et de la limite, sur une frise à l'échelle. */
.lead { margin: 18px 0 4px; font-size: 10pt; max-width: 120ch; }
.caveat { margin: 0 0 16px; color: var(--muted); max-width: 140ch; }
.stack { display: grid; gap: 18px; }
.gh { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: baseline; gap: 4px 16px; margin-bottom: 8px; }
.gh h2 { margin: 0; }
.leg { display: flex; flex-wrap: wrap; gap: 4px 16px; color: var(--muted); font-size: 8pt; }
.leg i { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 4px; vertical-align: -1px; }
.leg i.al { background: var(--warn); }
.leg i.lim { background: var(--crit); }
.leg i.run { border-radius: 0; width: 14px; height: 6px; background: var(--bar-soft); }
.g-row { display: grid; grid-template-columns: minmax(0, 290px) minmax(0, 1fr) 120px; gap: 12px; align-items: center; padding: 5px 0; border-bottom: 1px solid var(--rule); cursor: pointer; }
.g-row:hover { background: var(--hover); }
.g-row:last-child { border-bottom: 0; }
.g-lab { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.g-lab .muted { margin-right: 4px; }
.g-tr { position: relative; height: 18px; }
.g-tr .run { position: absolute; left: 0; top: 6px; height: 6px; background: var(--bar-soft); }
.g-tr .dot { position: absolute; top: 4px; width: 10px; height: 10px; border-radius: 50%; transform: translateX(-50%); }
.g-tr .dot.al { background: var(--warn); }
.g-tr .dot.lim { background: var(--crit); }
.g-tr .now, .g-axis .now { position: absolute; top: -4px; bottom: -4px; border-left: 1px dashed var(--muted); }
.g-tr .mo { position: absolute; top: 0; bottom: 0; border-left: 1px solid var(--rule); }
.g-row.g-ax { cursor: default; padding: 0 0 2px; }
.g-row.g-ax:hover { background: none; }
.g-axis { position: relative; height: 14px; color: var(--faint); font-size: 8pt; }
.g-axis span { position: absolute; white-space: nowrap; padding-left: 3px; }
.g-when { text-align: right; white-space: nowrap; }
.ub { position: relative; width: 130px; height: 10px; background: var(--rule); }
.ub .f { position: absolute; left: 0; top: 0; bottom: 0; background: var(--bar); }
.ub .f.SURV { background: var(--warn); }
.ub .f.DEP { background: var(--crit); }
.ub .t100 { position: absolute; top: -3px; bottom: -3px; border-left: 2px solid var(--ink); }
.ub .tal { position: absolute; top: -3px; bottom: -3px; border-left: 1px dashed var(--ink); }
.tools2 { display: flex; flex-wrap: wrap; gap: 4px 22px; }
@media (max-width: 760px) {
  .g-row { grid-template-columns: minmax(0, 1fr) 96px; }
  .g-row .g-tr { grid-column: 1 / -1; grid-row: 2; }
  .g-row.g-ax .g-axis { grid-column: 1 / -1; grid-row: 1; }
}
</style>
</head>

<div id="app"></div>

    { texte: "Règlement délégué (UE) 2017/653", niveau: "Règlement UE, 2017", objet: "KID PRIIPs, art. 15 réexamen au moins annuel" },
    { texte: "Lignes directrices IPEV", niveau: "Pratique de marché, 2022", objet: "Évaluation des participations non cotées" }
  ]
};

/* ------------------------------------------------------------------ outils */

const STATUTS = {
  DEP:  { lib: "Dépassement",       court: "Dépassement",  rang: 4 },
  MAN:  { lib: "Donnée manquante",  court: "Manquant",     rang: 3 },
  SURV: { lib: "Sous surveillance", court: "Surveillance", rang: 2 },
  OK:   { lib: "Conforme",          court: "Conforme",     rang: 1 },
  NA:   { lib: "Non applicable",    court: "n.a.",         rang: 0 }
};
const ORDRE_STATUTS = ["DEP", "MAN", "SURV", "OK"];
const MOIS = ["janvier", "février", "mars", "avril", "mai", "juin", "juillet", "août",
              "septembre", "octobre", "novembre", "décembre"];
const EPS = 1e-9;

const fondsById = {}; DATA.fonds.forEach(f => { fondsById[f.id] = f; });
const domById = {}; DATA.domaines.forEach(d => { domById[d.id] = d; });
const indById = {}; DATA.indicateurs.forEach(i => { indById[i.id] = i; });
const actById = {}; DATA.actions.forEach(a => { actById[a.id] = a; });
const pipeById = {}; DATA.pipeline.forEach(p => { pipeById[p.id] = p; });

function esc(s) {
  return String(s == null ? "" : s).replace(/&/g, "&amp;").replace(/</g, "&lt;")
    .replace(/>/g, "&gt;").replace(/"/g, "&quot;");
}
/* typographie française : espace insécable avant : ; ? ! % */
function fr(s) {
  return String(s == null ? "" : s).replace(/ ([:;?!%])/g, " $1");
}
function t(s) { return esc(fr(s)); }
/* « de » élidé devant une voyelle : d'AirFund, de FPS */
function de(nom) { return (/^[AEIOUYÉÈÊaeiouyéèê]/.test(nom) ? "d'" : "de ") + nom; }

function nombre(v, dec) {
  return new Intl.NumberFormat("fr-FR", { minimumFractionDigits: dec, maximumFractionDigits: dec }).format(v);
}
const DEC = { "%": 1, "x": 2, "pb": 0, "j": 0, "nb": 0, "EUR m": 1, "% VL": 1 };
function val(v, u) {
  if (v === null || v === undefined || isNaN(v)) return "n.d.";
  const d = DEC[u] !== undefined ? DEC[u] : 1;
  const n = nombre(v, d);
  if (u === "x") return n + "x";
  if (u === "nb") return n;
  if (u === "% VL") return n + " %";
  return n + " " + u;
}
function signe(v, u) {
  if (v === null || v === undefined || isNaN(v)) return "-";
  const s = val(Math.abs(v), u);
  if (Math.abs(v) < EPS) return s;
  return (v > 0 ? "+" : "-") + s;
}

function date(iso) { const p = iso.split("-"); return p[2] + "/" + p[1] + "/" + p[0]; }
function dateCourte(iso) { const p = iso.split("-"); return p[2] + "/" + p[1]; }
function dateLongue(iso) {
  const p = iso.split("-"); return Number(p[2]) + " " + MOIS[Number(p[1]) - 1] + " " + p[0];
}
function moisAnnee(iso) { const p = iso.split("-"); return MOIS[Number(p[1]) - 1] + " " + p[0]; }
function jours(a, b) { return Math.round((Date.parse(b) - Date.parse(a)) / 86400000); }
function delai(iso) {
  const n = jours(DATA.meta.aujourdhui, iso);
  if (n < 0) return "en retard de " + (-n) + " j";
  if (n === 0) return "aujourd'hui";
  return "dans " + n + " j";
}

/* ------------------------------------------------------------------ moteur */

function valeur(ind, i) { const v = ind.h[i]; return v === undefined ? null : v; }

function statut(ind, i) {
  const v = valeur(ind, i);
  if (v === null) return "MAN";
  if (ind.sens === "max") {
    if (ind.lim !== null && v > ind.lim + EPS) return "DEP";
    if (ind.al !== null && v >= ind.al - EPS) return "SURV";
    return "OK";
  }
  if (ind.lim !== null && v < ind.lim - EPS) return "DEP";
  if (ind.al !== null && v <= ind.al + EPS) return "SURV";
  return "OK";
}

/* marge restante avant la limite, dans l'unité de l'indicateur (négative = dépassement) */
function marge(ind, i) {
  const v = valeur(ind, i);
  if (v === null || ind.lim === null) return null;
  return ind.sens === "max" ? ind.lim - v : v - ind.lim;
}

function tendance(ind, i) {
  if (i === 0) return { code: "nd", lib: "n.d." };
  const a = valeur(ind, i - 1), b = valeur(ind, i);
  if (a === null || b === null) return { code: "nd", lib: "n.d." };
  if (Math.abs(b - a) < EPS) return { code: "stable", lib: "Stable" };
  const hausse = b > a;
  const degrade = ind.sens === "max" ? hausse : !hausse;
  return degrade ? { code: "deg", lib: "Dégradation" } : { code: "ame", lib: "Amélioration" };
}

function pire(codes) {
  let w = "NA";
  codes.forEach(c => { if (STATUTS[c].rang > STATUTS[w].rang) w = c; });
  return w;
}

function indicateursDe(f, d) {
  return DATA.indicateurs.filter(x => (!f || x.f === f) && (!d || x.d === d));
}

function statutDomaine(f, d, i) {
  const l = indicateursDe(f, d);
  if (!l.length) return "NA";
  return pire(l.map(x => statut(x, i)));
}

function statutFonds(f, i) { return pire(indicateursDe(f).map(x => statut(x, i))); }

function compte(i, perimetre) {
  const c = { DEP: 0, MAN: 0, SURV: 0, OK: 0, total: 0 };
  DATA.indicateurs.forEach(x => {
    if (perimetre && perimetre.indexOf(x.f) < 0) return;
    c[statut(x, i)] += 1; c.total += 1;
  });
  return c;
}

/* indicateurs hors statut conforme, du plus grave au moins grave */
function pointsAttention(i, perimetre) {
  return DATA.indicateurs
    .filter(x => (!perimetre || perimetre.indexOf(x.f) >= 0) && statut(x, i) !== "OK")
    .sort((a, b) => STATUTS[statut(b, i)].rang - STATUTS[statut(a, i)].rang
      || DATA.fonds.indexOf(fondsById[a.f]) - DATA.fonds.indexOf(fondsById[b.f]));
}

function actionsOuvertes(perimetre) {
  return DATA.actions
    .filter(a => !perimetre || !a.f || perimetre.indexOf(a.f) >= 0)
    .slice().sort((a, b) => a.ech < b.ech ? -1 : a.ech > b.ech ? 1 : 0);
}

function echeancesDans(nbJours, perimetre) {
  return DATA.echeances.filter(e => {
    const n = jours(DATA.meta.aujourdhui, e.date);
    if (n < 0 || n > nbJours) return false;
    return !perimetre || e.f.some(x => perimetre.indexOf(x) >= 0);
  });
}

/* ------------------------------------------------------------------ liquidité */

const SCENARIOS = [
  { k: "base", lib: "Base" },
  { k: "adverse", lib: "Adverse" },
  { k: "extreme", lib: "Extrême" }
];

function copieLiquidite(id) { return JSON.parse(JSON.stringify(DATA.liquidite[id])); }

function paramsMap(cfg) { const m = {}; cfg.params.forEach(p => { m[p.k] = Number(p.v) || 0; }); return m; }
function scenMap(cfg, s) { const m = {}; cfg.scen.forEach(p => { m[p.k] = Number(p.v[s]) || 0; }); return m; }

function liqOuvert(cfg, s) {
  const p = paramsMap(cfg), q = scenMap(cfg, s);
  const ressources = p.vl * (p.poche + p.obtenable) / 100 + p.credit;
  const demande = p.vl * q.rachats / 100;
  const servis = p.vl * Math.min(q.rachats, p.gate) / 100;
  const appels = p.vl * q.appels / 100;
  const besoins = servis + appels;
  return { ressources, demande, servis, differes: demande - servis, appels, besoins,
           solde: ressources - besoins, couverture: besoins > 0 ? ressources / besoins : null };
}

function liqFerme(cfg, s) {
  const p = paramsMap(cfg), q = scenMap(cfg, s);
  const encaisses = p.appels * (1 - q.defaut / 100);
  const ligne = p.ligne * q.maintien / 100;
  const ressources = p.treso + encaisses + ligne;
  return { appels: p.appels, defautMontant: p.appels - encaisses, encaisses, treso: p.treso, ligne,
           ressources, besoins: p.decaiss, solde: ressources - p.decaiss,
           couverture: p.decaiss > 0 ? ressources / p.decaiss : null };
}

function liquidite(cfg, s) { return cfg.type === "ouvert" ? liqOuvert(cfg, s) : liqFerme(cfg, s); }

/* reverse stress test : le niveau de choc qui ramène la couverture à 1,00x */
function reverse(cfg) {
  const p = paramsMap(cfg);
  if (cfg.type === "ouvert") {
    const q = scenMap(cfg, "base");
    const ressources = p.vl * (p.poche + p.obtenable) / 100 + p.credit;
    const rmax = p.vl > 0 ? (ressources - p.vl * q.appels / 100) / p.vl * 100 : null;
    const gateProtege = rmax !== null && rmax >= p.gate;
    return {
      type: "ouvert", rmax, gate: p.gate, gateProtege,
      texte: rmax === null ? "Données insuffisantes." :
        rmax < 0 ? "Les ressources ne couvrent pas les seuls appels des fonds cibles du scénario de base, avant tout rachat." :
        "Les ressources couvrent au plus " + val(rmax, "% VL") + " de rachats par fenêtre, après les appels du scénario de base. " +
        (gateProtege ? "La gate (" + val(p.gate, "% VL") + ") s'applique avant l'épuisement des ressources." :
                       "Ce niveau est inférieur à la gate (" + val(p.gate, "% VL") + ") : le Fonds ne peut pas servir une fenêtre pleine sans cession ni financement.")
    };
  }
  const dmax = p.appels > 0 ? (1 - (p.decaiss - p.treso - p.ligne) / p.appels) * 100 : null;
  const dmaxSans = p.appels > 0 ? (1 - (p.decaiss - p.treso) / p.appels) * 100 : null;
  const borne = x => x === null ? "n.d." : x <= 0 ? "aucun défaut" : x >= 100 ? "plus de 100 %" : val(x, "%");
  return {
    type: "ferme", dmax, dmaxSans,
    texte: "Défaut des investisseurs supportable avant que la couverture ne tombe sous 1,00x : " + borne(dmax) +
      " avec la ligne relais, " + borne(dmaxSans) + " sans la ligne relais."
  };
}

/* ------------------------------------------------------------------ trajectoire */
/* Projection linéaire indicative : pente des moindres carrés sur les arrêtés disponibles
   jusqu'à la date choisie, en unités par mois. Ne capte ni rupture ni saisonnalité. */

function pente(ind, i) {
  const pts = [];
  for (let k = 0; k <= i; k++) if (ind.h[k] !== null && ind.h[k] !== undefined) pts.push([k, ind.h[k]]);
  if (pts.length < 2) return null;
  const mx = pts.reduce((a, p) => a + p[0], 0) / pts.length;
  const my = pts.reduce((a, p) => a + p[1], 0) / pts.length;
  let num = 0, den = 0;
  pts.forEach(p => { num += (p[0] - mx) * (p[1] - my); den += (p[0] - mx) * (p[0] - mx); });
  return den ? num / den : null;
}

function ajouterMois(iso, m) {
  return new Date(Date.parse(iso) + m * 30.44 * 86400000).toISOString().slice(0, 10);
}
function periode(iso) {
  const j = Number(iso.slice(8, 10));
  return (j <= 10 ? "début " : j <= 20 ? "mi-" : "fin ") + moisAnnee(iso);
}

/* cible : "lim" (limite) ou "al" (seuil d'alerte) */
function projection(ind, i, cible) {
  const s = ind[cible], v = valeur(ind, i);
  if (s === null) return { code: "sans", lib: cible === "lim" ? "Sans limite" : "Sans alerte" };
  if (v === null) return { code: "nd", lib: "Donnée manquante" };
  const franchi = ind.sens === "max"
    ? (cible === "lim" ? v > s + EPS : v >= s - EPS)
    : (cible === "lim" ? v < s - EPS : v <= s + EPS);
  if (franchi) return { code: "franchi", lib: cible === "lim" ? "Franchie" : "Franchi", mois: 0, date: DATA.meta.arretes[i] };
  const p = pente(ind, i);
  if (p === null) return { code: "nd", lib: "Historique insuffisant" };
  const vers = ind.sens === "max" ? p > EPS : p < -EPS;
  if (!vers) return { code: "aucun", lib: "Aucun franchissement projeté", pente: p };
  const mois = Math.abs(s - v) / Math.abs(p);
  const date = ajouterMois(DATA.meta.arretes[i], mois);
  return { code: mois <= 3 ? "proche" : "lointain", mois, date, pente: p, lib: periode(date) };
}

/* part de la marge consommée : 1 = limite atteinte, au-delà = dépassement */
function utilisation(ind, i) {
  const v = valeur(ind, i);
  if (v === null || ind.lim === null) return null;
  if (ind.sens === "max") return ind.lim ? v / ind.lim : null;
  return v ? ind.lim / v : null;
}
function utilisationAlerte(ind) {
  if (ind.lim === null || ind.al === null) return null;
  if (ind.sens === "max") return ind.lim ? ind.al / ind.lim : null;
  return ind.al ? ind.lim / ind.al : null;
}

/* ------------------------------------------------------------------ thème */

function theme(btn) {
  const libs = { auto: "automatique", light: "clair", dark: "sombre" };
  let cur = "auto";
  try { const s = localStorage.getItem("riskstudio_theme"); if (s === "light" || s === "dark") cur = s; } catch (e) {}
  function apply() {
    if (cur === "auto") document.documentElement.removeAttribute("data-theme");
    else document.documentElement.setAttribute("data-theme", cur);
    if (btn) btn.textContent = "Thème : " + libs[cur];
  }
  apply();
  if (btn) btn.addEventListener("click", () => {
    cur = cur === "auto" ? "light" : cur === "light" ? "dark" : "auto";
    try { localStorage.setItem("riskstudio_theme", cur); } catch (e) {}
    apply();
  });
}

window.RS = {
  DATA, STATUTS, ORDRE_STATUTS, SCENARIOS, fondsById, domById, indById, actById, pipeById,
  esc, fr, t, de, nombre, val, signe, date, dateCourte, dateLongue, moisAnnee, jours, delai,
  valeur, statut, marge, tendance, pire, indicateursDe, statutDomaine, statutFonds, compte,
  pointsAttention, actionsOuvertes, echeancesDans,
  copieLiquidite, liquidite, reverse, theme,
  pente, ajouterMois, periode, projection, utilisation, utilisationAlerte
};
})();
</script>
<script>/* Risk Studio - kit commun aux consoles : cadre, fragments réutilisables,
   vues secondaires (liquidité, indicateurs, échéancier, onboarding, studios)
   et routage. Chaque console fournit seulement son écran d'accueil. */
(function () {
"use strict";
const R = window.RS, D = R.DATA;
const st = { i: D.meta.arretes.length - 1, vue: "accueil", filtre: { statut: "", fonds: "" }, focus: null };
let page = null, VUES = [];
const PROPRES = {};
const $ = id => document.getElementById(id);

const C = (code, long) => '<span class="c-' + code + '">' + R.esc(long ? R.STATUTS[code].lib : R.STATUTS[code].court) + '</span>';
const seuil = (ind, k) => ind[k] === null ? "-" : R.val(ind[k], ind.u);
const pl = (n, s, p) => n > 1 ? p : s;
const arrete = () => D.meta.arretes[st.i];

/* ------------------------------------------------------------ fragments */
function spark(ind, w, h) {
  w = w || 164; h = h || 44;
  const vals = ind.h.filter(v => v !== null);
  const pool = vals.concat([ind.al, ind.lim].filter(v => v !== null));
  let lo = Math.min.apply(null, pool), hi = Math.max.apply(null, pool);
  if (hi - lo < 1e-9) { lo -= 1; hi += 1; }
  const pad = (hi - lo) * 0.12; lo -= pad; hi += pad;
  const px = 5, py = 5;
  const X = k => px + k * (w - 2 * px) / (ind.h.length - 1);
  const Y = v => py + (hi - v) * (h - 2 * py) / (hi - lo);
  let s = '<svg class="spark" width="' + w + '" height="' + h + '" viewBox="0 0 ' + w + ' ' + h + '" role="img" aria-label="' +
    R.esc("Évolution sur quatre arrêtés : " + ind.h.map(v => R.val(v, ind.u)).join(", ")) + '">';
  if (ind.al !== null) s += '<line class="al" x1="0" x2="' + w + '" y1="' + Y(ind.al).toFixed(1) + '" y2="' + Y(ind.al).toFixed(1) + '"/>';
  if (ind.lim !== null) s += '<line class="lim" x1="0" x2="' + w + '" y1="' + Y(ind.lim).toFixed(1) + '" y2="' + Y(ind.lim).toFixed(1) + '"/>';
  let path = "", open = false;
  ind.h.forEach((v, k) => { if (v === null) { open = false; return; } path += (open ? " L" : " M") + X(k).toFixed(1) + " " + Y(v).toFixed(1); open = true; });
  if (path) s += '<path class="ln" d="' + path.trim() + '"/>';
  ind.h.forEach((v, k) => {
    if (v !== null) s += '<circle class="pt' + (k === st.i ? ' cur' : '') + '" cx="' + X(k).toFixed(1) + '" cy="' + Y(v).toFixed(1) + '" r="' + (k === st.i ? 3.2 : 2.4) + '"/>';
  });
  return s + '</svg>';
}

function article(ind) {
  const i = st.i, code = R.statut(ind, i), m = R.marge(ind, i), tr = R.tendance(ind, i);
  const a = ind.act ? R.actById[ind.act] : null;
  const seuils = ind.lim === null ? "Alerte " + seuil(ind, "al") + ", sans limite"
    : (ind.sens === "max" ? "Plafond " : "Plancher ") + seuil(ind, "lim") + " - alerte " + seuil(ind, "al");
  return '<article class="it" id="it-' + ind.id + '">' +
    '<div class="nm"><b>' + R.t(ind.lib) + '</b><span class="muted">' + R.t(ind.def) + '</span></div>' +
    '<div class="val"><b class="c-' + code + '">' + R.val(R.valeur(ind, i), ind.u) + '</b><span class="muted">' + R.t(seuils) + '</span></div>' +
    '<div>' + spark(ind) + '<div class="sx"><span>' + R.dateCourte(D.meta.arretes[0]) + '</span><span>' + R.dateCourte(D.meta.arretes[D.meta.arretes.length - 1]) + '</span></div></div>' +
    '<div>' + C(code, true) + '<br><span class="muted">' + (m === null ? "Marge n.d." : "Marge " + R.signe(m, ind.u)) + '<br>' + R.esc(tr.lib) + '</span></div>' +
    '<dl class="more">' +
    (ind.com ? '<dt>Commentaire</dt><dd>' + R.t(ind.com) + '</dd>' : '') +
    (a ? '<dt>Action</dt><dd>' + R.t(a.objet) + ' <span class="muted">' + R.esc(a.resp + ", " + R.date(a.ech) + ", priorité " + a.prio.toLowerCase()) + '</span></dd>' : '') +
    '<dt>Nature</dt><dd>' + R.t(ind.type + ", " + ind.nat.toLowerCase() + ". " + ind.ref) + '</dd>' +
    '<dt>Source</dt><dd class="muted">' + R.t(ind.src) + '</dd>' +
    '</dl></article>';
}

function todo(a) {
  const qui = a.f ? R.fondsById[a.f].court : R.pipeById[a.pipe].nom;
  const ind = a.ind ? R.indById[a.ind] : null;
  return '<li class="todo"><div class="when"><b>' + R.dateCourte(a.ech) + '</b><span>' + R.esc(R.delai(a.ech)) + '</span></div><div class="what">' +
    '<p><span class="prio-' + a.prio + '">' + R.esc("Priorité " + a.prio.toLowerCase()) + '</span> <span class="muted">- ' + R.esc(qui) + '</span></p>' +
    '<p>' + R.t(a.objet) + '</p>' +
    (ind ? '<button type="button" class="lk" data-open="' + ind.id + '">Voir l\'indicateur</button>'
         : '<button type="button" class="lk" data-dossier="' + a.pipe + '">Voir le dossier</button>') +
    '</div></li>';
}

function echItem(e) {
  return '<li class="todo"><div class="when"><b>' + R.dateCourte(e.date) + '</b><span>' + R.esc(R.delai(e.date)) + '</span></div><div class="what">' +
    '<p>' + R.t(e.objet) + '</p><p class="muted">' + R.esc(e.f.map(x => R.fondsById[x].court).join(", ")) + ' - <span class="' +
    (e.statut === "À risque" || e.statut === "Non lancé" ? "st-risk" : "") + '">' + R.esc(e.statut) + '</span></p></div></li>';
}

/* barres de couverture de liquidité d'un fonds, dessinées à l'échelle */
function liqBlock(id) {
  const cfg = R.copieLiquidite(id), res = {};
  R.SCENARIOS.forEach(s => { res[s.k] = R.liquidite(cfg, s.k); });
  const kri = D.indicateurs.find(x => x.f === id && x.d === "LIQ" && x.u === "x");
  const al = kri ? kri.al : null;
  const maxv = Math.max.apply(null, R.SCENARIOS.map(s => res[s.k].couverture || 0).concat([al || 0, 1]));
  const xmax = Math.max(2, Math.ceil(maxv * 1.1 * 2) / 2);
  const pc = v => (Math.max(0, Math.min(v, xmax)) / xmax * 100).toFixed(2) + "%";
  const refs = '<span class="ref" style="left:' + pc(1) + '"></span>' + (al ? '<span class="ref al" style="left:' + pc(al) + '"></span>' : '');
  const bars = R.SCENARIOS.map(s => {
    const v = res[s.k].couverture;
    return '<div class="liq-row"><span>' + s.lib + '</span><div class="track"><span class="b' + (v < 1 ? ' low' : '') + '" style="width:' + pc(v) + '"></span>' + refs + '</div>' +
      '<span class="n' + (v < 1 ? ' c-DEP' : '') + '">' + R.val(v, "x") + '</span></div>';
  }).join("");
  const ticks = [];
  for (let x = 0; x <= xmax + 1e-9; x += 0.5) ticks.push('<span style="left:' + pc(x) + '">' + R.nombre(x, 1) + 'x</span>');
  const eur = v => R.nombre(v, 1);
  const sg = v => (v > 0.05 ? "+" : v < -0.05 ? "-" : "") + R.nombre(Math.abs(v), 1);
  const tab = '<table class="list" style="margin-top:12px"><thead><tr><th>EUR m</th>' + R.SCENARIOS.map(s => '<th class="n">' + s.lib + '</th>').join("") + '</tr></thead><tbody>' +
    '<tr><td>Ressources</td>' + R.SCENARIOS.map(s => '<td class="n">' + eur(res[s.k].ressources) + '</td>').join("") + '</tr>' +
    '<tr><td>' + (cfg.type === "ouvert" ? "Rachats servis et appels" : "Décaissements prévus") + '</td>' + R.SCENARIOS.map(s => '<td class="n">' + eur(res[s.k].besoins) + '</td>').join("") + '</tr>' +
    (cfg.type === "ouvert" ? '<tr><td>Rachats différés par la gate</td>' + R.SCENARIOS.map(s => '<td class="n">' + eur(res[s.k].differes) + '</td>').join("") + '</tr>' : '') +
    '<tr><td><b>Solde</b></td>' + R.SCENARIOS.map(s => '<td class="n' + (res[s.k].solde < 0 ? ' c-DEP' : '') + '">' + sg(res[s.k].solde) + '</td>').join("") + '</tr></tbody></table>';
  return '<p class="muted" style="margin:0 0 12px">' +
    R.t(cfg.type === "ouvert" ? "Couverture des rachats servis et des appels des fonds cibles à 3 mois" : "Couverture des décaissements à 12 mois") + '</p>' +
    '<div class="liq">' + bars + '</div><div class="axis">' + ticks.join("") + '</div>' +
    '<p class="note">' + R.t("Pointillés : plancher 1,00x" + (al ? " et seuil d'alerte " + R.val(al, "x") : "") + ".") + '</p>' + tab +
    '<p style="margin:10px 0 0"><b>Reverse stress test.</b> ' + R.t(R.reverse(cfg).texte) + '</p>';
}

/* ------------------------------------------------------------ vues secondaires */
function vLiquidite() {
  const blocs = ["AIR", "OPN", "ALE"].map(id => '<div class="panel"><h2>' + R.esc(R.fondsById[id].nom) + '</h2>' + liqBlock(id) + '</div>').join("");
  return '<div class="view-h"><h1>Liquidité</h1><span class="muted">' + R.t("Scénarios calibrés au 30/09/2026") + '</span></div>' +
    '<div class="panel" style="margin-bottom:18px"><h2 class="lbl">Hypothèses clés et limites</h2><ul class="hyp">' +
    D.hypothesesLiquidite.map(x => '<li>' + R.t(x) + '</li>').join("") + '</ul></div><div class="liq-grid">' + blocs + '</div>';
}

function vIndicateurs() {
  const i = st.i, F = st.filtre;
  const base = D.indicateurs.filter(x => !F.fonds || x.f === F.fonds);
  const l = base.filter(x => !F.statut || R.statut(x, i) === F.statut)
    .sort((a, b) => R.STATUTS[R.statut(b, i)].rang - R.STATUTS[R.statut(a, i)].rang);
  const cnt = c => base.filter(x => R.statut(x, i) === c).length;
  const chipsS = '<div class="chips" role="group" aria-label="Filtrer par statut"><span class="k">Statut</span>' +
    [["", "Tous", base.length]].concat(R.ORDRE_STATUTS.map(c => [c, R.STATUTS[c].lib, cnt(c)])).map(c =>
      '<button type="button" class="chip" data-fs="' + c[0] + '" aria-pressed="' + (F.statut === c[0]) + '">' + R.esc(c[1]) + '<span class="ct">' + c[2] + '</span></button>').join("") + '</div>';
  const chipsF = '<div class="chips" role="group" aria-label="Filtrer par fonds"><span class="k">Fonds</span>' +
    [["", "Tous"]].concat(D.fonds.map(f => [f.id, f.court])).map(c =>
      '<button type="button" class="chip" data-ff="' + c[0] + '" aria-pressed="' + (F.fonds === c[0]) + '">' + R.esc(c[1]) + '</button>').join("") + '</div>';
  const rows = l.map(x => {
    const m = R.marge(x, i), code = R.statut(x, i);
    return '<tr class="go" data-open="' + x.id + '" tabindex="0"><td class="nw">' + C(code, true) + '</td><td class="nw">' + R.esc(R.fondsById[x.f].court) + '</td>' +
      '<td class="nw">' + R.esc(R.domById[x.d].nom) + '</td><td>' + R.t(x.lib) + '</td><td class="n">' + R.val(R.valeur(x, i), x.u) + '</td>' +
      '<td class="n">' + seuil(x, "al") + '</td><td class="n">' + seuil(x, "lim") + '</td><td class="n">' + (m === null ? "-" : R.signe(m, x.u)) + '</td>' +
      '<td class="nw muted">' + R.esc(R.tendance(x, i).lib) + '</td><td>' + spark(x, 84, 22) + '</td></tr>';
  }).join("");
  return '<div class="view-h"><h1>Indicateurs</h1><span class="muted">' + l.length + ' sur ' + D.indicateurs.length + ', du plus grave au moins grave</span></div>' +
    '<div class="panel">' + chipsS + chipsF + '<div class="scroll"><table class="list"><thead><tr><th>Statut</th><th>Fonds</th><th>Domaine</th><th>Indicateur</th><th class="n">Valeur</th>' +
    '<th class="n">Alerte</th><th class="n">Limite</th><th class="n">Marge</th><th>Tendance</th><th>Évolution</th></tr></thead><tbody>' +
    (rows || '<tr><td colspan="10" class="muted">Aucun indicateur ne correspond aux filtres.</td></tr>') + '</tbody></table></div>' +
    '<p class="note">' + R.t("Sélectionner une ligne pour l'ouvrir " + (page.cibleOuverture || "dans l'écran " + page.accueil.toLowerCase()) + ".") + '</p></div>';
}

function vEcheancier() {
  let mois = "";
  const rows = D.echeances.map(e => {
    const m = R.moisAnnee(e.date), g = m !== mois ? '<tr class="grp"><td colspan="6">' + m + '</td></tr>' : '';
    mois = m;
    return g + '<tr><td class="nw"><b>' + R.date(e.date) + '</b></td><td class="nw muted">' + R.esc(R.delai(e.date)) + '</td><td>' + R.t(e.objet) + '</td>' +
      '<td>' + R.esc(e.f.map(x => R.fondsById[x].court).join(", ")) + '</td><td class="muted">' + R.t(e.ref) + '</td>' +
      '<td class="nw ' + (e.statut === "À risque" || e.statut === "Non lancé" ? "st-risk" : "") + '">' + R.esc(e.statut) + '</td></tr>';
  }).join("");
  return '<div class="view-h"><h1>Échéancier</h1><span class="muted">Réglementaire et interne</span></div>' +
    '<div class="panel"><div class="scroll"><table class="list"><thead><tr><th>Date</th><th>Délai</th><th>Objet</th><th>Fonds</th><th>Référence</th><th>Statut</th></tr></thead><tbody>' +
    rows + '</tbody></table></div></div>';
}

function etapes(p) {
  return '<div class="seg" aria-hidden="true">' + p.etapes.map((e, k) => '<i class="' + (k < p.cur ? "done" : k === p.cur ? "cur" : "") + '"></i>').join("") + '</div>' +
    R.t("Étape " + (p.cur + 1) + " sur " + p.etapes.length + " : " + p.etapes[p.cur]);
}

function vPipeline() {
  const rows = D.pipeline.map(p => '<tr><td><b>' + (p.url ? '<a href="' + p.url + '" target="_blank" rel="noopener">' + R.esc(p.nom) + '</a>' : R.esc(p.nom)) + '</b><br><span class="muted">' + R.esc(p.nature) + '</span></td>' +
    '<td>' + etapes(p) + '</td>' +
    '<td>' + R.esc(p.prochaine) + '<br><span class="muted">' + R.date(p.ech) + ', ' + R.esc(R.delai(p.ech)) + '</span></td><td>' + R.t(p.point) + '</td></tr>').join("");
  return '<div class="view-h"><h1>Onboarding et due diligence</h1><span class="muted">' + D.pipeline.length + ' dossiers</span></div>' +
    '<div class="panel"><div class="scroll"><table class="list"><thead><tr><th>Dossier</th><th>Avancement</th><th>Prochaine étape</th><th>Point d\'attention</th></tr></thead><tbody>' + rows + '</tbody></table></div></div>';
}

function vStudios() {
  return '<div class="view-h"><h1>Studios</h1><span class="muted">Outils de la fonction de gestion des risques</span></div>' +
    '<div class="panel"><div class="studios">' + D.studios.map(s => '<div class="studio"><b>' +
      (s.url ? '<a href="' + s.url + '" target="_blank" rel="noopener">' + R.esc(s.nom) + '</a>' : R.esc(s.nom)) + '</b>' +
      '<span>' + R.esc(s.objet) + '</span><br><span class="' + (s.etat === "En service" ? "muted" : "faint") + '">' + R.esc(s.etat) + '</span></div>').join("") + '</div></div>';
}

/* ------------------------------------------------------------ cadre et routage */
const RENDU = { liquidite: vLiquidite, indicateurs: vIndicateurs, echeancier: vEcheancier, pipeline: vPipeline, studios: vStudios };

function shell() {
  $("app").innerHTML = '<div class="shell"><header class="bar">' +
    '<div class="brand"><span class="name">Risk Studio</span><span class="ent">' + R.esc(page.nom) + '</span></div>' +
    '<nav class="views" role="tablist" id="views" aria-label="Vues"></nav>' +
    '<div class="tools"><label for="arrete">Arrêté</label><select id="arrete"></select>' +
    '<button type="button" class="quiet" id="theme">Thème&nbsp;: automatique</button></div></header>' +
    '<p class="demo" id="demo"></p><main id="view"></main><p class="foot" id="foot"></p></div>';
}

function cadre() {
  $("views").innerHTML = VUES.map(v => '<button type="button" role="tab" id="tab-' + v[0] + '" data-vue="' + v[0] + '" aria-selected="' + (v[0] === st.vue) + '">' + v[1] + '</button>').join("");
  $("arrete").innerHTML = D.meta.arretes.map((a, k) => '<option value="' + k + '"' + (k === st.i ? " selected" : "") + '>' + R.date(a) + '</option>').join("");
  $("demo").textContent = R.fr("Fundcraft France. Données de démonstration : valeurs fictives, non issues des fonds. Produit le " + D.meta.produit + ".");
  $("foot").textContent = R.fr(page.pied || "Risk Studio, " + page.nom.toLowerCase() + ". Les quatre consoles partagent les mêmes données, les mêmes calculs et les mêmes vues secondaires ; seul l'écran d'accueil change.");
}

function rendu() {
  cadre();
  const v = $("view");
  v.setAttribute("role", "tabpanel");
  v.setAttribute("aria-labelledby", "tab-" + st.vue);
  v.innerHTML = PROPRES[st.vue] ? PROPRES[st.vue]() : RENDU[st.vue]();
  if (page.apres) page.apres();
  if (st.focus) {
    const el = $("it-" + st.focus) || document.querySelector('[data-focus="' + st.focus + '"]');
    st.focus = null;
    if (el) { el.scrollIntoView({ block: "center" }); el.classList.remove("flash"); void el.offsetWidth; el.classList.add("flash"); }
  }
}

function vue(v) {
  st.vue = v;
  try { history.replaceState(null, "", "#" + v); } catch (e) {}
  rendu(); window.scrollTo(0, 0);
}

function ouvrir(id) {
  const cible = page.ouvrir(id) || VUES[0][0];
  st.focus = id; st.vue = cible;
  try { history.replaceState(null, "", "#" + cible); } catch (e) {}
  window.scrollTo(0, 0);
  rendu();
}

function boot(p) {
  page = p;
  /* une page peut déclarer ses propres écrans : [clé, libellé, fonction] ou le nom d'une vue du kit */
  const LIBS = { liquidite: "Liquidité", indicateurs: "Indicateurs", echeancier: "Échéancier", pipeline: "Onboarding et due diligence", studios: "Studios" };
  const decl = p.vues || [["accueil", p.accueil, p.accueilHtml], "liquidite", "indicateurs", "echeancier", "pipeline", "studios"];
  VUES = decl.map(v => typeof v === "string" ? [v, LIBS[v]] : (PROPRES[v[0]] = v[2], [v[0], v[1]]));
  st.vue = VUES[0][0];
  shell();
  $("views").addEventListener("click", e => { const b = e.target.closest("[data-vue]"); if (b) vue(b.dataset.vue); });
  $("arrete").addEventListener("change", e => { st.i = Number(e.target.value); rendu(); });
  $("view").addEventListener("click", e => {
    if (page.click && page.click(e)) return;
    const o = e.target.closest("[data-open]"); if (o) { ouvrir(o.dataset.open); return; }
    const g = e.target.closest("[data-vue-go]"); if (g) { vue(g.dataset.vueGo); return; }
    const ds = e.target.closest("[data-dossier]"); if (ds) { if (page.dossier) page.dossier(ds.dataset.dossier); else vue("pipeline"); return; }
    const fg = e.target.closest("[data-filtre]"); if (fg) { st.filtre = { statut: fg.dataset.filtre, fonds: "" }; vue("indicateurs"); return; }
    const fs = e.target.closest("[data-fs]"); if (fs) { st.filtre.statut = fs.dataset.fs; rendu(); return; }
    const ff = e.target.closest("[data-ff]"); if (ff) { st.filtre.fonds = ff.dataset.ff; rendu(); }
  });
  $("view").addEventListener("keydown", e => {
    if (page.key && page.key(e)) return;
    const row = e.target.closest("tr.go[data-open]");
    if (row && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); ouvrir(row.dataset.open); }
  });
  const h0 = (location.hash || "").slice(1);
  if (VUES.some(v => v[0] === h0)) st.vue = h0;
  R.theme($("theme"));
  rendu();
}

window.RK = { st, C, seuil, pl, arrete, spark, article, todo, echItem, liqBlock, etapes, rendu, vue, ouvrir, boot,
  vues: { liquidite: vLiquidite, indicateurs: vIndicateurs, echeancier: vEcheancier, pipeline: vPipeline, studios: vStudios } };
})();
</script>
<script>
(function () {
"use strict";
const R = window.RS, D = R.DATA, K = window.RK, st = K.st;
const loc = { fonds: "", vue: "risque", tri: "date", open: new Set() };
const HORIZON_MOIS = 6;

const projs = x => ({ al: R.projection(x, st.i, "al"), lim: R.projection(x, st.i, "lim") });
const rangLim = p => p.code === "franchi" ? -1 : (p.code === "proche" || p.code === "lointain") ? p.mois : p.code === "aucun" ? 1e6 : p.code === "sans" ? 2e6 : 3e6;
function libProj(p, court) {
  if (p.code === "proche" || p.code === "lointain") return p.mois > 12 ? "Au-delà de 12 mois" : p.lib;
  if (p.code === "aucun") return court ? "Aucun" : "Aucun franchissement projeté";
  return p.lib;
}
function cls(p, cible) {
  if (p.code === "franchi") return cible === "lim" ? "c-DEP" : "c-SURV";
  return p.code === "proche" ? "c-SURV" : "muted";
}

function frise(liste) {
  const debut = K.arrete(), fin = R.ajouterMois(debut, HORIZON_MOIS), H = R.jours(debut, fin);
  const pos = iso => Math.max(0, Math.min(100, R.jours(debut, iso) / H * 100)).toFixed(2) + "%";
  const mois = [];
  let d = new Date(Date.parse(debut));
  d = new Date(Date.UTC(d.getUTCFullYear(), d.getUTCMonth() + 1, 1));
  while (d.toISOString().slice(0, 10) < fin) { mois.push(d.toISOString().slice(0, 10)); d = new Date(Date.UTC(d.getUTCFullYear(), d.getUTCMonth() + 1, 1)); }
  const ABR = ["janv.", "févr.", "mars", "avr.", "mai", "juin", "juil.", "août", "sept.", "oct.", "nov.", "déc."];
  const nomMois = iso => ABR[Number(iso.slice(5, 7)) - 1];
  const now = R.jours(debut, D.meta.aujourdhui) >= 0 ? '<span class="now" style="left:' + pos(D.meta.aujourdhui) + '"></span>' : '';
  const lignes = liste.map(x => {
    const p = projs(x), inH = q => (q.code === "proche" || q.code === "lointain") && q.date <= fin;
    const limDate = p.lim.code === "franchi" ? debut : inH(p.lim) ? p.lim.date : null;
    const run = limDate ? '<span class="run" style="width:' + pos(limDate) + '"></span>' : '';
    const dots = (inH(p.al) ? '<span class="dot al" style="left:' + pos(p.al.date) + '" title="' + R.esc("Alerte " + p.al.lib) + '"></span>' : '') +
      (limDate ? '<span class="dot lim" style="left:' + pos(limDate) + '" title="' + R.esc("Limite " + (p.lim.code === "franchi" ? "franchie" : p.lim.lib)) + '"></span>' : '');
    const quand = p.lim.code === "franchi" ? '<span class="c-DEP">Limite franchie</span>' :
      limDate ? '<span class="c-SURV">' + R.esc("Limite " + p.lim.lib.replace(/ \d{4}$/, "")) + '</span>' :
      '<span class="muted">' + R.esc("Alerte " + p.al.lib.replace(/ \d{4}$/, "")) + '</span>';
    return '<div class="g-row" data-g="' + x.id + '" role="button" tabindex="0" aria-label="' + R.esc(R.fondsById[x.f].court + ", " + x.lib + " : afficher le détail") + '"><div class="g-lab"><span class="muted">' + R.esc(R.fondsById[x.f].court) + '</span>' + R.t(x.lib) + '</div>' +
      '<div class="g-tr">' + mois.map(m => '<span class="mo" style="left:' + pos(m) + '"></span>').join("") + now + run + dots + '</div><div class="g-when">' + quand + '</div></div>';
  }).join("");
  const axe = '<div class="g-row g-ax" aria-hidden="true"><div></div><div class="g-axis">' + mois.map(m => '<span style="left:' + pos(m) + '">' + nomMois(m) + '</span>').join("") +
    '</div><div></div></div>';
  return { lignes, axe };
}

function accueilHtml() {
  const i = st.i;
  const base = D.indicateurs.filter(x => !loc.fonds || x.f === loc.fonds);
  const fin = R.ajouterMois(K.arrete(), HORIZON_MOIS);
  const enRisque = base.filter(x => {
    const p = projs(x), inH = q => (q.code === "proche" || q.code === "lointain") && q.date <= fin;
    return p.lim.code === "franchi" || inH(p.lim) || inH(p.al);
  }).sort((a, b) => {
    const pa = projs(a), pb = projs(b);
    const ka = pa.lim.code === "franchi" ? -1 : (pa.lim.date && pa.lim.date <= fin ? pa.lim.mois : 100 + (pa.al.mois || 0));
    const kb = pb.lim.code === "franchi" ? -1 : (pb.lim.date && pb.lim.date <= fin ? pb.lim.mois : 100 + (pb.al.mois || 0));
    return ka - kb;
  });
  const all = D.indicateurs.map(x => projs(x).lim);
  const n3 = all.filter(p => p.code === "proche").length;
  const n6 = all.filter(p => (p.code === "proche" || p.code === "lointain") && p.mois <= HORIZON_MOIS).length;
  const nf = all.filter(p => p.code === "franchi").length;
  const lead = "Au rythme observé jusqu'au " + R.date(K.arrete()) + ", " + n3 + " " + K.pl(n3, "limite serait atteinte", "limites seraient atteintes") + " d'ici 3 mois et " + n6 +
    " d'ici 6 mois ; " + (nf ? nf + " " + K.pl(nf, "est déjà franchie", "sont déjà franchies") : "aucune n'est déjà franchie") + ".";
  const fr = frise(enRisque);

  const chipsF = '<div class="chips" role="group" aria-label="Filtrer par fonds"><span class="k">Fonds</span>' +
    [["", "Tous"]].concat(D.fonds.map(f => [f.id, f.court])).map(c =>
      '<button type="button" class="chip" data-lf="' + c[0] + '" aria-pressed="' + (loc.fonds === c[0]) + '">' + R.esc(c[1]) + '</button>').join("") + '</div>';
  const chipsV = '<div class="chips" role="group" aria-label="Indicateurs affichés"><span class="k">Afficher</span>' +
    [["risque", "Limite à 6 mois ou franchie"], ["tous", "Tous les indicateurs"]].map(c =>
      '<button type="button" class="chip" data-lv="' + c[0] + '" aria-pressed="' + (loc.vue === c[0]) + '">' + c[1] + '</button>').join("") + '</div>';
  const chipsT = '<div class="chips" role="group" aria-label="Tri"><span class="k">Trier par</span>' +
    [["date", "Échéance projetée"], ["util", "Marge consommée"]].map(c =>
      '<button type="button" class="chip" data-lt="' + c[0] + '" aria-pressed="' + (loc.tri === c[0]) + '">' + c[1] + '</button>').join("") + '</div>';

  let l = base.slice();
  if (loc.vue === "risque") l = l.filter(x => { const p = projs(x).lim; return p.code === "franchi" || ((p.code === "proche" || p.code === "lointain") && p.mois <= HORIZON_MOIS); });
  l.sort(loc.tri === "date" ? (a, b) => rangLim(projs(a).lim) - rangLim(projs(b).lim)
    : (a, b) => (R.utilisation(b, i) === null ? -1 : R.utilisation(b, i)) - (R.utilisation(a, i) === null ? -1 : R.utilisation(a, i)));
  const rows = l.map(x => {
    const p = projs(x), u = R.utilisation(x, i), ua = R.utilisationAlerte(x), code = R.statut(x, i), open = loc.open.has(x.id);
    const pc = v => (Math.max(0, Math.min(v, 1.25)) / 1.25 * 100).toFixed(1) + "%";
    const barre = u === null ? '<span class="muted">' + (x.lim === null ? "Sans limite" : "n.d.") + '</span>' :
      '<div class="ub" role="img" aria-label="' + R.esc("Marge consommée : " + R.nombre(u * 100, 0) + " %") + '"><span class="f ' + code + '" style="width:' + pc(u) + '"></span>' +
      (ua !== null ? '<span class="tal" style="left:' + pc(ua) + '"></span>' : '') + '<span class="t100" style="left:' + pc(1) + '"></span></div>';
    const pente = p.lim.pente !== undefined ? p.lim.pente : R.pente(x, i);
    return '<tr class="go" data-row="' + x.id + '" tabindex="0" aria-expanded="' + open + '"><td class="nw">' + R.esc(R.fondsById[x.f].court) + '</td><td>' + R.t(x.lib) + '</td>' +
      '<td>' + barre + '</td><td class="n">' + (u === null ? "-" : R.nombre(u * 100, 0) + " %") + '</td>' +
      '<td class="n c-' + code + '">' + R.val(R.valeur(x, i), x.u) + '</td><td class="n">' + K.seuil(x, "lim") + '</td>' +
      '<td class="n muted">' + (pente === null || pente === undefined ? "-" : R.signe(pente, x.u)) + '</td>' +
      '<td class="nw ' + cls(p.al, "al") + '">' + R.esc(libProj(p.al, true)) + '</td><td class="nw ' + cls(p.lim, "lim") + '">' + R.esc(libProj(p.lim, true)) + '</td>' +
      '<td>' + K.spark(x, 84, 22) + '</td></tr>' + (open ? '<tr class="det"><td colspan="10">' + K.article(x) + '</td></tr>' : '');
  }).join("");

  return '<p class="lead">' + R.t(lead) + '</p>' +
    '<p class="caveat">' + R.t("Méthode : pente des moindres carrés sur les arrêtés mensuels disponibles, quatre au plus. Projection indicative : elle ne capte ni rupture ni saisonnalité, et elle est biaisée pour les séries trimestrielles et les VL lissées. Niveau de confiance faible au-delà de 3 mois.") + '</p>' +
    '<div class="stack"><section class="panel"><div class="gh"><h2 class="lbl">Franchissements projetés à 6 mois</h2>' +
    '<div class="leg"><span><i class="run"></i>Piste avant la limite</span><span><i class="al"></i>Seuil d\'alerte</span><span><i class="lim"></i>Limite</span><span>Pointillé : aujourd\'hui</span></div></div>' +
    chipsF + (enRisque.length ? fr.axe + fr.lignes : '<p class="muted">Aucun franchissement projeté sur l\'horizon pour ce périmètre.</p>') + '</section>' +
    '<section class="panel"><h2 class="lbl">Distance aux limites</h2><div class="tools2">' + chipsV + chipsT + '</div>' +
    '<div class="scroll"><table class="list"><thead><tr><th>Fonds</th><th>Indicateur</th><th>Marge consommée</th><th class="n">Part</th><th class="n">Valeur</th><th class="n">Limite</th>' +
    '<th class="n">Pente par mois</th><th>Alerte projetée</th><th>Limite projetée</th><th>Évolution</th></tr></thead><tbody>' +
    (rows || '<tr><td colspan="10" class="muted">Aucun indicateur ne correspond.</td></tr>') + '</tbody></table></div>' +
    '<p class="note">' + R.t("Marge consommée : 100 % = limite atteinte (trait plein) ; trait pointillé = seuil d'alerte. Pour un plancher, rapport limite / valeur.") + '</p></section></div>';
}

function basculer(id) {
  if (loc.open.has(id)) loc.open.delete(id); else loc.open.add(id);
  K.rendu();
  const r = document.querySelector('tr[data-row="' + id + '"]');
  if (r) { r.focus(); if (loc.open.has(id)) r.scrollIntoView({ block: "nearest" }); }
}

/* depuis la frise : ouvre la ligne du tableau, au besoin en affichant tous les indicateurs */
function voir(id) {
  loc.open.add(id);
  const p = projs(R.indById[id]).lim;
  if (loc.vue === "risque" && !(p.code === "franchi" || ((p.code === "proche" || p.code === "lointain") && p.mois <= HORIZON_MOIS))) loc.vue = "tous";
  K.rendu();
  const it = document.getElementById("it-" + id);
  if (it) { it.scrollIntoView({ block: "center" }); it.classList.remove("flash"); void it.offsetWidth; it.classList.add("flash"); }
}

K.boot({
  nom: "Console alerte précoce", accueil: "Trajectoires", accueilHtml,
  ouvrir(id) { loc.vue = "tous"; loc.fonds = ""; loc.open.add(id); },
  click(e) {
    const f = e.target.closest("[data-lf]"); if (f) { loc.fonds = f.dataset.lf; K.rendu(); return true; }
    const v = e.target.closest("[data-lv]"); if (v) { loc.vue = v.dataset.lv; K.rendu(); return true; }
    const t = e.target.closest("[data-lt]"); if (t) { loc.tri = t.dataset.lt; K.rendu(); return true; }
    const g = e.target.closest("[data-g]"); if (g) { voir(g.dataset.g); return true; }
    const r = e.target.closest("[data-row]"); if (r) { basculer(r.dataset.row); return true; }
    return false;
  },
  key(e) {
    const g = e.target.closest("[data-g]");
    if (g && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); voir(g.dataset.g); return true; }
    const r = e.target.closest("[data-row]");
    if (r && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); basculer(r.dataset.row); return true; }
    return false;
  }
});
})();
</script>
</body>
</html>
