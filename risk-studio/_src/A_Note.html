<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Risk Studio Note</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Carlito:ital,wght@0,400;0,700;1,400&display=swap">
<style>
/* Proposition A - la note. Une colonne de lecture, typographie seule, monochrome.
   Le teal est réservé aux liens ; la hiérarchie des statuts passe par la graisse,
   pas par la couleur. Aucun élément figé, aucun quadrillage. */
:root {
  --bg: #FFFFFF;
  --ink: #1A2027;
  --muted: #5A6B72;
  --faint: #8A979D;
  --rule: #E0E0E0;
  --rule-strong: #1A2027;
  --link: #218E8E;
  --hover: #F5F7F7;
  --flash: #EBFCF9;
  --font: Calibri, Carlito, "Segoe UI", Arial, sans-serif;
  --fs: 9pt; --fs-s: 8pt; --fs-h: 10pt; --fs-t: 13pt;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #14191C; --ink: #E4EAEC; --muted: #9AA8AE; --faint: #6F7E85; --rule: #2C363C;
    --rule-strong: #C9D3D7; --link: #5CC3C3; --hover: #1B2226; --flash: #1A2B2F; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #14191C; --ink: #E4EAEC; --muted: #9AA8AE; --faint: #6F7E85; --rule: #2C363C;
  --rule-strong: #C9D3D7; --link: #5CC3C3; --hover: #1B2226; --flash: #1A2B2F; color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font-family: var(--font); font-size: var(--fs); line-height: 1.45; }
[hidden] { display: none !important; }
button, select { font: inherit; color: inherit; }
:focus-visible { outline: 1px solid var(--link); outline-offset: 2px; }
a { color: var(--link); text-decoration: none; }
a:hover { text-decoration: underline; }

.page { max-width: 1040px; margin-inline: auto; padding-inline: 32px; padding-block: 32px 64px; }

.mast { display: grid; gap: 3px; padding-bottom: 12px; border-bottom: 1px solid var(--rule-strong); }
.mast .top { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: baseline; gap: 6px 16px; }
.kicker { margin: 0; color: var(--muted); font-size: var(--fs-s); letter-spacing: .08em; text-transform: uppercase; }
h1 { margin: 0; font-size: var(--fs-t); font-weight: 700; text-wrap: balance; }
.lede { margin: 0; font-size: var(--fs-h); }
.lede select { border: 0; border-bottom: 1px solid var(--ink); background: transparent; padding: 0 2px; cursor: pointer; font-size: var(--fs-h); }
.demo { margin: 4px 0 0; color: var(--muted); font-size: var(--fs-s); }
.quiet { background: none; border: 0; padding: 0; color: var(--muted); cursor: pointer; font-size: var(--fs-s); }
.quiet:hover { color: var(--ink); text-decoration: underline; }

.toc { display: flex; flex-wrap: wrap; gap: 2px 18px; margin-top: 12px; }
.scope { display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 16px; margin-top: 8px; }
.scope .lbl { color: var(--muted); }
.scope button { background: none; border: 0; border-bottom: 1px solid transparent; padding: 1px 0; color: var(--muted); cursor: pointer; }
.scope button:hover { color: var(--ink); }
.scope button[aria-pressed="true"] { color: var(--ink); font-weight: 700; border-bottom-color: var(--ink); }

section { margin-top: 30px; }
h2 { margin: 0 0 8px; font-size: var(--fs-h); font-weight: 700; text-wrap: balance; }
h3 { margin: 20px 0 6px; font-size: var(--fs); font-weight: 700; }
p { margin: 0 0 8px; max-width: 82ch; }
.chapeau { font-size: var(--fs-h); line-height: 1.5; max-width: 78ch; }
.note { color: var(--muted); font-size: var(--fs-s); margin-top: 6px; }
ul.hyp { margin: 0 0 10px; padding-left: 18px; max-width: 82ch; }
ul.hyp li { margin-bottom: 3px; }

.tbl { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; border-bottom: 1px solid var(--rule-strong); }
th { text-align: left; font-weight: 700; padding: 3px 12px 4px 0; border-bottom: 1px solid var(--rule-strong); vertical-align: bottom; }
td { padding: 3px 12px 3px 0; vertical-align: top; }
th:last-child, td:last-child { padding-right: 0; }
.n { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
.nw { white-space: nowrap; }
tbody tr.row:hover { background: var(--hover); }
tr.grp td { font-weight: 700; padding-top: 10px; }
tr.det td { padding: 4px 0 12px; }
.mx td, .mx th { white-space: nowrap; }
.mx td:first-child { white-space: normal; min-width: 180px; }

.s-DEP { font-weight: 700; }
.s-MAN { font-style: italic; }
.s-OK { color: var(--muted); }
.s-NA { color: var(--faint); }
.t-deg { color: var(--ink); }
.t-ame, .t-stable, .t-nd { color: var(--muted); }

.lk { background: none; border: 0; padding: 0; color: var(--link); cursor: pointer; text-align: left; }
.lk:hover, .lk[aria-expanded="true"] { text-decoration: underline; }
td > .lk { min-width: 150px; }
.cell { background: none; border: 0; padding: 0; cursor: pointer; text-align: left; }
.cell:hover { text-decoration: underline; }

dl.kv { display: grid; grid-template-columns: 120px minmax(0, 1fr); gap: 3px 14px; margin: 0; max-width: 820px; }
dl.kv dt { color: var(--muted); }
dl.kv dd { margin: 0; }
.facts { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 6px 24px; margin: 0 0 10px; }
.facts div { min-width: 0; }
.facts dt { color: var(--muted); font-size: var(--fs-s); }
.facts dd { margin: 0; }

.flash { animation: flash 1.6s ease-out; }
@keyframes flash { from { background: var(--flash); } to { background: transparent; } }
@media (prefers-reduced-motion: reduce) { .flash { animation: none; } }

footer { margin-top: 40px; padding-top: 8px; border-top: 1px solid var(--rule); color: var(--muted); font-size: var(--fs-s); }

@media (max-width: 640px) {
  .page { padding-inline: 16px; padding-block: 20px 48px; }
  dl.kv { grid-template-columns: 1fr; }
  dl.kv dt { margin-top: 4px; }
}
@page { size: A4; margin: 15mm; }
@media print {
  :root { --bg: #FFFFFF; --ink: #000000; --muted: #444444; --link: #000000; }
  .toc, .scope, .quiet { display: none !important; }
  .tbl { overflow: visible; }
  h2, h3 { break-after: avoid; }
  tr { break-inside: avoid; }
}
</style>
</head>
<body>
<div class="page">
  <header class="mast">
    <div class="top">
      <p class="kicker">Fundcraft France - Fonction de gestion des risques</p>
      <button class="quiet" id="theme" type="button">Thème&nbsp;: automatique</button>
    </div>
    <h1>Risk Studio</h1>
    <p class="lede">Situation des risques au <select id="arrete" aria-label="Date d'arrêté"></select></p>
    <p class="demo" id="demo"></p>
  </header>

  <nav class="toc" aria-label="Sommaire">
    <a href="#synthese">1. Synthèse</a>
    <a href="#attention">2. Points d'attention</a>
    <a href="#actions">3. Actions ouvertes</a>
    <a href="#fonds">4. Situation par fonds</a>
    <a href="#liquidite">5. Liquidité</a>
    <a href="#echeancier">6. Échéancier</a>
    <a href="#pipeline">7. Onboarding et due diligence</a>
    <a href="#studios">8. Studios</a>
    <a href="#references">9. Références</a>
  </nav>
  <div class="scope" id="scope" role="group" aria-label="Périmètre"></div>

  <main id="doc"></main>

  <footer id="foot"></footer>
</div>

<script>/*@CORE*/</script>
<script>
(function () {
"use strict";
const R = window.RS, D = R.DATA;
const st = { i: D.meta.arretes.length - 1, scope: null, open: new Set() };
const $ = id => document.getElementById(id);

const perim = () => st.scope ? [st.scope] : D.fonds.map(f => f.id);
const fondsPerim = () => D.fonds.filter(f => perim().indexOf(f.id) >= 0);
const S = (code, long) => '<span class="s-' + code + '">' + R.esc(long ? R.STATUTS[code].lib : R.STATUTS[code].court) + '</span>';
const seuil = (ind, k) => ind[k] === null ? "-" : R.val(ind[k], ind.u);
const pl = (n, sing, plur) => n + " " + (n > 1 ? plur : sing);

/* ------------------------------------------------------------ en-tête */
function entete() {
  $("arrete").innerHTML = D.meta.arretes.map((a, k) =>
    '<option value="' + k + '"' + (k === st.i ? " selected" : "") + '>' + R.esc(R.dateLongue(a)) + '</option>').join("");
  $("demo").textContent = R.fr("Données de démonstration : valeurs fictives, non issues des fonds. Produit le " + D.meta.produit + ".");
  const opts = [{ id: "", nom: "Tous les fonds" }].concat(D.fonds);
  $("scope").innerHTML = '<span class="lbl">Périmètre&nbsp;:</span>' + opts.map(f =>
    '<button type="button" data-scope="' + f.id + '" aria-pressed="' + ((st.scope || "") === f.id) + '">' + R.esc(f.nom) + '</button>').join("");
  $("foot").textContent = R.fr("Risk Studio, proposition A : la note. Même socle de données et de calcul que les propositions B et C. Données de démonstration, valeurs fictives.");
}

/* ------------------------------------------------------------ fragments */
function detail(ind) {
  const i = st.i;
  const hist = D.meta.arretes.map((a, k) => R.dateCourte(a) + " : " + R.val(R.valeur(ind, k), ind.u)).join(" ; ");
  const a = ind.act ? R.actById[ind.act] : null;
  const sens = ind.sens === "max" ? "Plafond" : "Plancher";
  return '<dl class="kv">' +
    '<dt>Définition</dt><dd>' + R.t(ind.def) + '</dd>' +
    '<dt>Nature</dt><dd>' + R.t(ind.type + ", " + ind.nat.toLowerCase()) + '</dd>' +
    '<dt>Seuils</dt><dd>' + R.t(sens + " : alerte à " + seuil(ind, "al") + (ind.lim === null ? ", sans limite" : ", limite à " + seuil(ind, "lim"))) + '</dd>' +
    '<dt>Historique</dt><dd class="nw">' + R.esc(hist) + '</dd>' +
    '<dt>Source</dt><dd>' + R.t(ind.src) + '</dd>' +
    '<dt>Référence</dt><dd>' + R.t(ind.ref) + '</dd>' +
    (ind.com ? '<dt>Commentaire</dt><dd>' + R.t(ind.com) + '</dd>' : '') +
    (a ? '<dt>Action</dt><dd>' + R.t(a.objet + ". " + a.resp + ", échéance le " + R.date(a.ech) + ".") + '</dd>' : '') +
    '<dt>Statut</dt><dd>' + S(R.statut(ind, i), true) + '</dd>' +
    '</dl>';
}

function ligne(ind, ctx, avecFonds) {
  const i = st.i, code = R.statut(ind, i), tr = R.tendance(ind, i), m = R.marge(ind, i);
  const key = ctx + ":" + ind.id, open = st.open.has(key);
  const ncol = 8;
  return '<tr class="row">' +
    (avecFonds ? '<td class="nw">' + R.esc(R.fondsById[ind.f].court) + '</td>' : '') +
    '<td><button type="button" class="lk" data-key="' + key + '" aria-expanded="' + open + '" aria-controls="det-' + ctx + '-' + ind.id + '">' + R.t(ind.lib) + '</button></td>' +
    (avecFonds ? '' : '<td>' + R.esc(ind.type) + '</td>') +
    '<td class="n">' + R.val(R.valeur(ind, i), ind.u) + '</td>' +
    '<td class="n">' + seuil(ind, "al") + '</td>' +
    '<td class="n">' + seuil(ind, "lim") + '</td>' +
    '<td class="n">' + (m === null ? "-" : R.signe(m, ind.u)) + '</td>' +
    '<td class="t-' + tr.code + '">' + R.esc(tr.lib) + '</td>' +
    '<td class="nw">' + S(code, true) + '</td></tr>' +
    '<tr class="det" id="det-' + ctx + '-' + ind.id + '"' + (open ? "" : " hidden") + '><td colspan="' + ncol + '">' + detail(ind) + '</td></tr>';
}

const enteteInd = first => '<thead><tr><th>' + first + '</th><th>Indicateur</th><th class="n">Valeur</th><th class="n">Alerte</th>' +
  '<th class="n">Limite</th><th class="n">Marge</th><th>Tendance</th><th>Statut</th></tr></thead>';

/* ------------------------------------------------------------ 1. synthèse */
function synthese() {
  const i = st.i, fp = fondsPerim(), c = R.compte(i, perim());
  const arr = R.dateLongue(D.meta.arretes[i]);
  const pts = R.pointsAttention(i, perim());
  const dep = pts.filter(x => R.statut(x, i) === "DEP"), man = pts.filter(x => R.statut(x, i) === "MAN");
  let txt = "Au " + arr + ", " + (fp.length > 1 ? pl(fp.length, "fonds est suivi", "fonds sont suivis") : fp[0].nom + " est suivi") +
    " sur " + D.domaines.length + " domaines de risque, au travers de " + c.total + " indicateurs. ";
  if (dep.length) {
    txt += (dep.length > 1 ? dep.length + " dépassements sont ouverts : " : "Un dépassement est ouvert : ") +
      dep.map(x => x.lib.charAt(0).toLowerCase() + x.lib.slice(1) + " de " + R.fondsById[x.f].nom + " (" + R.val(R.valeur(x, i), x.u) +
        " pour " + (x.sens === "max" ? "un plafond de " : "un plancher de ") + R.val(x.lim, x.u) + ")").join(" ; ") + ". ";
  } else txt += "Aucun dépassement n'est ouvert. ";
  if (man.length) txt += (man.length > 1 ? man.length + " données sont manquantes : " : "Une donnée est manquante : ") +
    man.map(x => x.lib.charAt(0).toLowerCase() + x.lib.slice(1) + " de " + R.fondsById[x.f].nom).join(" ; ") + ". ";
  txt += pl(c.SURV, "indicateur est sous surveillance", "indicateurs sont sous surveillance") + " et " + pl(c.OK, "conforme", "conformes") + ".";
  const acts = R.actionsOuvertes(st.scope ? perim() : null);
  const hautes = acts.filter(a => a.prio === "Haute").length;
  let txt2 = "";
  if (acts.length) txt2 = pl(acts.length, "action est ouverte", "actions sont ouvertes") + (hautes ? ", dont " + pl(hautes, "de priorité haute", "de priorité haute") : "") +
    " ; la plus proche arrive à échéance " + R.delai(acts[0].ech) + " (" + R.date(acts[0].ech) + ").";

  const head = '<thead><tr><th>Fonds</th>' + D.domaines.map(d => '<th>' + R.esc(d.nom) + '</th>').join("") + '<th>Ensemble</th></tr></thead>';
  const body = fp.map(f => '<tr class="row"><td>' + R.esc(f.nom) + '</td>' + D.domaines.map(d => {
    const code = R.statutDomaine(f.id, d.id, i);
    return '<td>' + (code === "NA" ? S(code) : '<button type="button" class="cell" data-goto="' + f.id + '-' + d.id + '">' + S(code) + '</button>') + '</td>';
  }).join("") + '<td>' + S(R.statutFonds(f.id, i)) + '</td></tr>').join("");

  return '<section id="synthese"><h2>1. Synthèse</h2>' +
    '<p class="chapeau">' + R.t(txt) + (txt2 ? " " + R.t(txt2.charAt(0).toUpperCase() + txt2.slice(1)) : "") + '</p>' +
    '<div class="tbl"><table class="mx">' + head + '<tbody>' + body + '</tbody></table></div>' +
    '<p class="note">' + R.t("Lecture : statut le plus défavorable des indicateurs du domaine. Sélectionner un statut pour ouvrir le domaine dans la situation du fonds.") + '</p></section>';
}

/* ------------------------------------------------------------ 2. points d'attention */
function attention() {
  const pts = R.pointsAttention(st.i, perim());
  const body = pts.length ? pts.map(x => ligne(x, "pa", true)).join("") :
    '<tr><td colspan="8">Aucun indicateur hors statut conforme sur le périmètre.</td></tr>';
  return '<section id="attention"><h2>2. Points d\'attention</h2>' +
    '<p>' + R.t("Indicateurs en dépassement, sans donnée ou sous surveillance, du plus grave au moins grave. La marge est la distance restante jusqu'à la limite, négative en cas de dépassement.") + '</p>' +
    '<div class="tbl"><table>' + enteteInd("Fonds") + '<tbody>' + body + '</tbody></table></div></section>';
}

/* ------------------------------------------------------------ 3. actions */
function actions() {
  const l = R.actionsOuvertes(st.scope ? perim() : null);
  const body = l.map(a => {
    const qui = a.f ? R.fondsById[a.f].court : R.pipeById[a.pipe].nom;
    return '<tr class="row"><td class="nw">' + R.date(a.ech) + '</td><td class="nw">' + R.esc(R.delai(a.ech)) + '</td>' +
      '<td>' + R.esc(qui) + '</td><td>' + R.t(a.objet) + '</td><td>' + R.esc(a.resp) + '</td>' +
      '<td class="nw' + (a.prio === "Haute" ? ' s-DEP' : '') + '">' + R.esc(a.prio) + '</td><td class="nw">' + R.esc(a.statut) + '</td></tr>';
  }).join("");
  return '<section id="actions"><h2>3. Actions ouvertes</h2>' +
    '<div class="tbl"><table><thead><tr><th>Échéance</th><th>Délai</th><th>Fonds ou dossier</th><th>Action</th><th>Responsable</th><th>Priorité</th><th>Statut</th></tr></thead>' +
    '<tbody>' + (body || '<tr><td colspan="7">Aucune action ouverte.</td></tr>') + '</tbody></table></div></section>';
}

/* ------------------------------------------------------------ 4. fonds */
function fonds() {
  const i = st.i;
  const blocs = fondsPerim().map((f, k) => {
    const rows = D.domaines.map(d => {
      const l = R.indicateursDe(f.id, d.id);
      const g = '<tr class="grp" id="g-' + f.id + '-' + d.id + '"><td colspan="8">' + R.esc(d.nom) +
        (l.length ? '' : ' <span class="s-NA">: non applicable</span>') + '</td></tr>';
      return g + l.map(x => ligne(x, "f", false)).join("");
    }).join("");
    return '<h3 id="fonds-' + f.id + '">4.' + (k + 1) + ' ' + R.esc(f.nom) + '</h3>' +
      '<dl class="facts">' +
      '<div><dt>Nature</dt><dd>' + R.t(f.nature) + '</dd></div>' +
      '<div><dt>Liquidité</dt><dd>' + R.t(f.liquidite) + '</dd></div>' +
      '<div><dt>VL</dt><dd>' + R.val(f.encours, "EUR m") + ' au ' + R.date(f.dateVl) + ', fréquence ' + R.esc(f.freq.toLowerCase()) + '</dd></div>' +
      '<div><dt>Statut d\'ensemble</dt><dd>' + S(R.statutFonds(f.id, i), true) + '</dd></div>' +
      '</dl>' +
      '<div class="tbl"><table>' +
      '<thead><tr><th>Indicateur</th><th>Type</th><th class="n">Valeur</th><th class="n">Alerte</th><th class="n">Limite</th><th class="n">Marge</th><th>Tendance</th><th>Statut</th></tr></thead>' +
      '<tbody>' + rows + '</tbody></table></div>';
  }).join("");
  return '<section id="fonds"><h2>4. Situation par fonds</h2>' + blocs + '</section>';
}

/* ------------------------------------------------------------ 5. liquidité */
function liquidite() {
  const ordre = fondsPerim().map(f => f.id);
  const blocs = ordre.map((id, k) => {
    const cfg = R.copieLiquidite(id), f = R.fondsById[id];
    const res = {}; R.SCENARIOS.forEach(s => { res[s.k] = R.liquidite(cfg, s.k); });
    const col = (fn, u) => R.SCENARIOS.map(s => '<td class="n">' + fn(res[s.k], s.k) + '</td>').join("");
    const eur = v => R.nombre(v, 1);
    const sg = v => (v > 0.05 ? "+" : v < -0.05 ? "-" : "") + R.nombre(Math.abs(v), 1);
    let rows;
    if (cfg.type === "ouvert") {
      const q = {}; cfg.scen.forEach(x => { q[x.k] = x.v; });
      rows = [
        ["Rachats demandés", col((r, s) => eur(r.demande) + " (" + R.val(q.rachats[s], "% VL") + ")")],
        ["Rachats servis après gate", col(r => eur(r.servis))],
        ["Rachats différés", col(r => eur(r.differes))],
        ["Appels des fonds cibles à 3 mois", col(r => eur(r.appels))],
        ["Besoins de liquidité", col(r => eur(r.besoins))],
        ["Ressources liquides", col(r => eur(r.ressources))],
        ["Solde", col(r => sg(r.solde))]
      ];
    } else {
      rows = [
        ["Appels de capitaux programmés", col(r => eur(r.appels))],
        ["Défaut des investisseurs", col(r => eur(r.defautMontant))],
        ["Trésorerie disponible", col(r => eur(r.treso))],
        ["Ligne relais disponible", col(r => eur(r.ligne))],
        ["Ressources", col(r => eur(r.ressources))],
        ["Décaissements prévus à 12 mois", col(r => eur(r.besoins))],
        ["Solde", col(r => sg(r.solde))]
      ];
    }
    const cov = R.SCENARIOS.map(s => {
      const c = res[s.k].couverture;
      return '<td class="n' + (c !== null && c < 1 ? ' s-DEP' : '') + '">' + R.val(c, "x") + '</td>';
    }).join("");
    const premier = R.SCENARIOS.find(s => res[s.k].couverture !== null && res[s.k].couverture < 1);
    const lecture = "Couverture de " + R.val(res.base.couverture, "x") + " en base, " + R.val(res.adverse.couverture, "x") +
      " en adverse et " + R.val(res.extreme.couverture, "x") + " en extrême. " +
      (premier ? "Elle passe sous 1,00x dès le scénario " + premier.lib.toLowerCase() + "." : "Elle reste au-dessus de 1,00x dans les trois scénarios.");
    return '<h3>5.' + (k + 1) + ' ' + R.esc(f.nom) + '</h3>' +
      '<div class="tbl"><table><thead><tr><th>EUR m</th>' + R.SCENARIOS.map(s => '<th class="n">' + s.lib + '</th>').join("") + '</tr></thead><tbody>' +
      rows.map(r => '<tr class="row"><td>' + R.esc(r[0]) + '</td>' + r[1] + '</tr>').join("") +
      '<tr class="row"><td><b>Couverture</b></td>' + cov + '</tr></tbody></table></div>' +
      '<p class="note">' + R.t(lecture) + '</p>' +
      '<p><b>Reverse stress test.</b> ' + R.t(R.reverse(cfg).texte) + '</p>';
  }).join("");
  return '<section id="liquidite"><h2>5. Liquidité</h2>' +
    '<p><b>Hypothèses clés et limites.</b></p><ul class="hyp">' + D.hypothesesLiquidite.map(h => '<li>' + R.t(h) + '</li>').join("") + '</ul>' +
    '<p class="note">' + R.t("Scénarios calibrés au 30/09/2026, indépendamment de la date d'arrêté choisie.") + '</p>' + blocs + '</section>';
}

/* ------------------------------------------------------------ 6. échéancier */
function echeancier() {
  const l = D.echeances.filter(e => e.f.some(x => perim().indexOf(x) >= 0));
  const body = l.map(e => '<tr class="row"><td class="nw">' + R.date(e.date) + '</td><td class="nw">' + R.esc(R.delai(e.date)) + '</td>' +
    '<td>' + R.t(e.objet) + '</td><td>' + R.esc(e.f.map(x => R.fondsById[x].court).join(", ")) + '</td>' +
    '<td>' + R.t(e.ref) + '</td><td class="nw' + (e.statut === "À risque" || e.statut === "Non lancé" ? ' s-DEP' : '') + '">' + R.esc(e.statut) + '</td></tr>').join("");
  return '<section id="echeancier"><h2>6. Échéancier</h2>' +
    '<div class="tbl"><table><thead><tr><th>Date</th><th>Délai</th><th>Objet</th><th>Fonds</th><th>Référence</th><th>Statut</th></tr></thead><tbody>' +
    body + '</tbody></table></div></section>';
}

/* ------------------------------------------------------------ 7. pipeline */
function pipeline() {
  const body = D.pipeline.map(p => '<tr class="row"><td>' + (p.url ? '<a href="' + p.url + '" target="_blank" rel="noopener">' + R.esc(p.nom) + '</a>' : R.esc(p.nom)) + '</td>' +
    '<td>' + R.esc(p.nature) + '</td><td>' + R.esc(p.etapes[p.cur]) + ' <span class="s-OK">(' + (p.cur + 1) + ' sur ' + p.etapes.length + ')</span></td>' +
    '<td>' + R.esc(p.prochaine) + '</td><td class="nw">' + R.date(p.ech) + '</td><td>' + R.t(p.point) + '</td></tr>').join("");
  return '<section id="pipeline"><h2>7. Onboarding et due diligence</h2>' +
    '<div class="tbl"><table><thead><tr><th>Dossier</th><th>Nature</th><th>Étape en cours</th><th>Prochaine étape</th><th>Échéance</th><th>Point d\'attention</th></tr></thead><tbody>' +
    body + '</tbody></table></div></section>';
}

/* ------------------------------------------------------------ 8. studios, 9. références */
function studios() {
  const body = D.studios.map(s => '<tr class="row"><td>' + (s.url ? '<a href="' + s.url + '" target="_blank" rel="noopener">' + R.esc(s.nom) + '</a>' : R.esc(s.nom)) + '</td>' +
    '<td>' + R.esc(s.objet) + '</td><td class="nw' + (s.etat === "En service" ? '' : ' s-OK') + '">' + R.esc(s.etat) + '</td></tr>').join("");
  return '<section id="studios"><h2>8. Studios</h2>' +
    '<div class="tbl"><table><thead><tr><th>Studio</th><th>Objet</th><th>État</th></tr></thead><tbody>' + body + '</tbody></table></div></section>';
}
function references() {
  const body = D.references.map(r => '<tr class="row"><td>' + R.esc(r.texte) + '</td><td class="nw">' + R.esc(r.niveau) + '</td><td>' + R.esc(r.objet) + '</td></tr>').join("");
  return '<section id="references"><h2>9. Références</h2>' +
    '<div class="tbl"><table><thead><tr><th>Texte</th><th>Niveau et année</th><th>Objet</th></tr></thead><tbody>' + body + '</tbody></table></div></section>';
}

/* ------------------------------------------------------------ rendu et événements */
function rendu() {
  entete();
  $("doc").innerHTML = synthese() + attention() + actions() + fonds() + liquidite() + echeancier() + pipeline() + studios() + references();
}

$("arrete").addEventListener("change", e => { st.i = Number(e.target.value); rendu(); });
$("scope").addEventListener("click", e => {
  const b = e.target.closest("button[data-scope]"); if (!b) return;
  st.scope = b.dataset.scope || null; rendu();
});
$("doc").addEventListener("click", e => {
  const lk = e.target.closest(".lk[data-key]");
  if (lk) {
    const key = lk.dataset.key, row = document.getElementById(lk.getAttribute("aria-controls"));
    const open = !st.open.has(key);
    if (open) st.open.add(key); else st.open.delete(key);
    lk.setAttribute("aria-expanded", String(open));
    if (row) row.hidden = !open;
    return;
  }
  const c = e.target.closest(".cell[data-goto]");
  if (c) {
    const g = document.getElementById("g-" + c.dataset.goto);
    if (!g) return;
    g.scrollIntoView({ block: "start", behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth" });
    g.classList.remove("flash"); void g.offsetWidth; g.classList.add("flash");
  }
});

R.theme($("theme"));
rendu();
})();
</script>
</body>
</html>
