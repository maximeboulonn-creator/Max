<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Risk Studio Classeur</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Carlito:ital,wght@0,400;0,700;1,400&display=swap">
<style>
/* Proposition B - le classeur. Reprend la charte des classeurs Excel Fundcraft :
   onglets, contenu en B2, bandeau de bloc #2F4858, en-têtes #218E8E, résultat clé
   sur lime, saisie sur crème, sources en gris, filet bas de ligne #E0E0E0.
   Ni quadrillage, ni volet figé. */
:root {
  --bg: #FFFFFF;
  --ink: #1A2027;
  --muted: #5A6B72;
  --rule: #E0E0E0;
  --band: #2F4858;
  --band-ink: #FFFFFF;
  --head: #218E8E;
  --head-ink: #FFFFFF;
  --link: #218E8E;
  --lime: #D9F785;
  --on-lime: #1A2027;
  --cream: #FFF8F2;
  --alt: #EBFCF9;
  --tab: #EEF2F3;
  --tab-ink: #2F4858;
  --font: Calibri, Carlito, "Segoe UI", Arial, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #151B1F; --ink: #E4EAEC; --muted: #9AA8AE; --rule: #2C363C; --band: #2F4858; --band-ink: #FFFFFF;
    --head: #1D7272; --head-ink: #FFFFFF; --link: #5CC3C3; --cream: #2A2520; --alt: #182529;
    --tab: #1D2529; --tab-ink: #C9D6DC; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #151B1F; --ink: #E4EAEC; --muted: #9AA8AE; --rule: #2C363C; --band: #2F4858; --band-ink: #FFFFFF;
  --head: #1D7272; --head-ink: #FFFFFF; --link: #5CC3C3; --cream: #2A2520; --alt: #182529;
  --tab: #1D2529; --tab-ink: #C9D6DC; color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 9pt; line-height: 1.4; }
[hidden] { display: none !important; }
button, select, input { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--link); outline-offset: 1px; }
a { color: var(--link); }

/* colonne A étroite, contenu en B2 */
.wb { max-width: 1320px; padding-inline: 24px; padding-block: 18px 56px; }
.b2 h1 { margin: 0; font-size: 12pt; font-weight: 700; }
.b2 .sub { margin: 1px 0 0; color: var(--muted); }

.ctl { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 20px; margin: 12px 0 8px; }
.ctl label { display: inline-flex; align-items: center; gap: 6px; color: var(--muted); }
.in { background: var(--cream); color: var(--ink); border: 1px solid var(--rule); border-radius: 0; padding: 1px 4px; }
input.in.num { width: 84px; text-align: right; font-variant-numeric: tabular-nums; }
.btn { background: transparent; border: 1px solid var(--rule); color: var(--ink); padding: 2px 10px; cursor: pointer; border-radius: 0; }
.btn:hover { border-color: var(--muted); }

.tabs { display: flex; flex-wrap: wrap; gap: 2px; border-bottom: 2px solid var(--band); }
.tab { background: var(--tab); color: var(--tab-ink); border: 0; border-radius: 0; padding: 4px 14px; cursor: pointer; }
.tab:hover { text-decoration: underline; }
.tab[aria-selected="true"] { background: var(--band); color: var(--band-ink); font-weight: 700; text-decoration: none; }

.band { background: var(--band); color: var(--band-ink); font-weight: 700; padding: 3px 8px; margin-top: 16px; }
.band .hint { font-weight: 400; opacity: .8; }
.scroll { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; }
th { background: var(--head); color: var(--head-ink); font-weight: 700; text-align: left; padding: 3px 8px; white-space: nowrap; vertical-align: bottom; }
td { padding: 3px 8px; border-bottom: 1px solid var(--rule); vertical-align: top; }
tr.z > td { background: var(--alt); }
tr.grp > td { font-weight: 700; background: var(--alt); }
.n { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
.nw { white-space: nowrap; }
.src { color: var(--muted); }
.cur { font-weight: 700; }
table td.key { background: var(--lime); color: var(--on-lime); font-weight: 700; }
table td.st-DEP, span.st-DEP { background: var(--lime); color: var(--on-lime); font-weight: 700; }
span.st-DEP { padding: 0 4px; }
.st-SURV { font-weight: 700; }
.st-MAN { color: var(--muted); font-style: italic; }
.st-NA { color: var(--muted); }
.lnk { background: none; border: 0; padding: 0; color: var(--link); text-decoration: underline; cursor: pointer; text-align: left; }
td > .lnk[data-ind] { min-width: 150px; }
tr.sel > td { box-shadow: inset 0 -1px 0 var(--link), inset 0 1px 0 var(--link); }

.kpi th, .kpi td { text-align: center; }
.kpi td { font-size: 12pt; padding-block: 5px; font-variant-numeric: tabular-nums; }
.grid2 { display: grid; grid-template-columns: minmax(0, 1.3fr) minmax(0, 1fr); gap: 0 24px; }
.grid2 > div { min-width: 0; }
.notes { margin: 6px 0 0; padding-left: 16px; color: var(--muted); max-width: 110ch; }
.notes li { margin-bottom: 2px; }
p.src { margin: 6px 0 0; max-width: 110ch; }
.foot { margin-top: 28px; color: var(--muted); }

@media (max-width: 900px) { .grid2 { grid-template-columns: 1fr; } }
@media (max-width: 600px) { .wb { padding-inline: 16px; } .tab { padding: 4px 9px; } }
@page { size: A4 landscape; margin: 10mm; }
@media print {
  .ctl, .tabs { display: none !important; }
  .scroll { overflow: visible; }
  .band, th, td.key, .st-DEP { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
}
</style>
</head>
<body>
<div class="wb">
  <div class="b2">
    <h1>Risk Studio</h1>
    <p class="sub" id="sub"></p>
  </div>
  <div class="ctl">
    <label for="arrete">Arrêté</label><select id="arrete" class="in"></select>
    <span id="ctlFonds"><label for="fonds">Fonds</label> <select id="fonds" class="in"></select></span>
    <button type="button" class="btn" id="theme">Thème&nbsp;: automatique</button>
  </div>
  <div class="tabs" role="tablist" id="tabs" aria-label="Onglets"></div>
  <div id="sheet" role="tabpanel"></div>
  <p class="foot" id="foot"></p>
</div>

<script>/*@CORE*/</script>
<script>
(function () {
"use strict";
const R = window.RS, D = R.DATA;
const SHEETS = [["dashboard", "Dashboard"], ["fonds", "Fonds"], ["liquidite", "Liquidité"], ["indicateurs", "Indicateurs"],
                ["echeancier", "Échéancier"], ["pipeline", "Pipeline"], ["studios", "Studios"]];
const st = { i: D.meta.arretes.length - 1, sheet: "dashboard", fonds: "AIR",
             filtre: { fonds: "", dom: "", statut: "", type: "" }, sel: null, liq: {} };
const $ = id => document.getElementById(id);
const S = (code, long) => '<span class="st-' + code + '">' + R.esc(long ? R.STATUTS[code].lib : R.STATUTS[code].court) + '</span>';
const tdS = (code, long) => '<td class="nw st-' + code + '">' + R.esc(long ? R.STATUTS[code].lib : R.STATUTS[code].court) + '</td>';
const seuil = (ind, k) => ind[k] === null ? "-" : R.val(ind[k], ind.u);
const z = k => k % 2 ? ' class="z"' : '';
const arr = () => R.date(D.meta.arretes[st.i]);
const go = (sheet, attrs, label) => '<button type="button" class="lnk" data-go="' + sheet + '"' + (attrs || "") + '>' + label + '</button>';
const liqCfg = id => st.liq[id] || (st.liq[id] = R.copieLiquidite(id));

/* ------------------------------------------------------------ cadre */
function cadre() {
  $("sub").textContent = R.fr("Fundcraft France - situation au " + arr() + " - données de démonstration, valeurs fictives - produit le " + D.meta.produit);
  $("arrete").innerHTML = D.meta.arretes.map((a, k) => '<option value="' + k + '"' + (k === st.i ? " selected" : "") + '>' + R.date(a) + '</option>').join("");
  $("fonds").innerHTML = D.fonds.map(f => '<option value="' + f.id + '"' + (f.id === st.fonds ? " selected" : "") + '>' + R.esc(f.nom) + '</option>').join("");
  $("ctlFonds").hidden = !(st.sheet === "fonds" || st.sheet === "liquidite");
  $("tabs").innerHTML = SHEETS.map(s => '<button type="button" class="tab" role="tab" id="tab-' + s[0] + '" data-sheet="' + s[0] +
    '" aria-selected="' + (s[0] === st.sheet) + '">' + s[1] + '</button>').join("");
  $("foot").textContent = R.fr("Risk Studio, proposition B : le classeur. Même socle de données et de calcul que les propositions A et C.");
}

/* ------------------------------------------------------------ Dashboard */
function shDashboard() {
  const i = st.i, c = R.compte(i), acts = R.actionsOuvertes(), ech = R.echeancesDans(30);
  const kpi = [["Fonds gérés", D.fonds.length], ["Indicateurs suivis", c.total], ["Dépassements", c.DEP], ["Données manquantes", c.MAN],
               ["Sous surveillance", c.SURV], ["Actions ouvertes", acts.length], ["dont priorité haute", acts.filter(a => a.prio === "Haute").length],
               ["Échéances à 30 jours", ech.length]];
  let h = '<div class="band">Indicateurs clés au ' + arr() + '</div><div class="scroll"><table class="kpi"><thead><tr>' +
    kpi.map(k => '<th>' + R.esc(k[0]) + '</th>').join("") + '</tr></thead><tbody><tr>' +
    kpi.map(k => '<td class="key">' + k[1] + '</td>').join("") + '</tr></tbody></table></div>';

  const mx = '<div class="band">Matrice des risques</div><div class="scroll"><table><thead><tr><th>Fonds</th>' +
    D.domaines.map(d => '<th>' + R.esc(d.nom) + '</th>').join("") + '<th>Ensemble</th></tr></thead><tbody>' +
    D.fonds.map((f, k) => '<tr' + z(k) + '><td>' + go("fonds", ' data-fonds="' + f.id + '"', R.esc(f.court)) + '</td>' +
      D.domaines.map(d => tdS(R.statutDomaine(f.id, d.id, i))).join("") + tdS(R.statutFonds(f.id, i)) + '</tr>').join("") +
    '</tbody></table></div><p class="src">' + R.t("Statut le plus défavorable des indicateurs du domaine. Dépassement sur fond lime ; sous surveillance en gras.") + '</p>';

  const liq = '<div class="band">Couverture de liquidité par scénario</div><div class="scroll"><table><thead><tr><th>Fonds</th>' +
    R.SCENARIOS.map(s => '<th class="n">' + s.lib + '</th>').join("") + '<th class="n">Reverse</th></tr></thead><tbody>' +
    D.fonds.map((f, k) => {
      const cfg = liqCfg(f.id), rv = R.reverse(cfg);
      return '<tr' + z(k) + '><td>' + go("liquidite", ' data-fonds="' + f.id + '"', R.esc(f.court)) + '</td>' +
        R.SCENARIOS.map(s => { const v = R.liquidite(cfg, s.k).couverture; return '<td class="n' + (v !== null && v < 1 ? ' st-SURV' : '') + '">' + R.val(v, "x") + '</td>'; }).join("") +
        '<td class="n">' + (rv.type === "ouvert" ? R.val(rv.rmax, "% VL") + " rachats" : R.val(rv.dmax, "%") + " défaut") + '</td></tr>';
    }).join("") + '</tbody></table></div><p class="src">' + R.t("Reverse : rachats par fenêtre (fonds ouverts) ou défaut des investisseurs (fonds fermé) qui ramènent la couverture à 1,00x.") + '</p>';

  h += mx;

  const pts = R.pointsAttention(i);
  const pa = '<div class="band">Points d\'attention <span class="hint">(' + pts.length + ')</span></div><div class="scroll"><table><thead><tr>' +
    '<th>Fonds</th><th>Domaine</th><th>Indicateur</th><th class="n">Valeur</th><th class="n">Alerte</th><th class="n">Limite</th><th class="n">Marge</th><th>Statut</th></tr></thead><tbody>' +
    pts.map((x, k) => { const m = R.marge(x, i);
      return '<tr' + z(k) + '><td class="nw">' + R.esc(R.fondsById[x.f].court) + '</td><td class="nw">' + R.esc(R.domById[x.d].nom) + '</td>' +
        '<td>' + go("indicateurs", ' data-ind="' + x.id + '"', R.t(x.lib)) + '</td><td class="n">' + R.val(R.valeur(x, i), x.u) + '</td>' +
        '<td class="n">' + seuil(x, "al") + '</td><td class="n">' + seuil(x, "lim") + '</td><td class="n">' + (m === null ? "-" : R.signe(m, x.u)) + '</td>' +
        tdS(R.statut(x, i), true) + '</tr>'; }).join("") + '</tbody></table></div>';

  const ta = '<div class="band">Actions ouvertes</div><div class="scroll"><table><thead><tr><th>Échéance</th><th>Fonds</th><th>Action</th><th>Priorité</th></tr></thead><tbody>' +
    acts.map((a, k) => '<tr' + z(k) + '><td class="nw">' + R.date(a.ech) + '<br><span class="src">' + R.esc(R.delai(a.ech)) + '</span></td>' +
      '<td class="nw">' + R.esc(a.f ? R.fondsById[a.f].court : "Nourricier PG") + '</td><td>' + R.t(a.objet) + '</td>' +
      '<td class="nw' + (a.prio === "Haute" ? ' st-SURV' : '') + '">' + R.esc(a.prio) + '</td></tr>').join("") + '</tbody></table></div>';
  const te = '<div class="band">Échéances à 30 jours</div><div class="scroll"><table><thead><tr><th>Date</th><th>Objet</th><th>Fonds</th><th>Statut</th></tr></thead><tbody>' +
    ech.map((e, k) => '<tr' + z(k) + '><td class="nw">' + R.date(e.date) + '</td><td>' + R.t(e.objet) + '</td><td>' + R.esc(e.f.map(x => R.fondsById[x].court).join(", ")) + '</td>' +
      '<td class="nw' + (e.statut === "À risque" || e.statut === "Non lancé" ? ' st-SURV' : '') + '">' + R.esc(e.statut) + '</td></tr>').join("") + '</tbody></table></div>' +
    '<p class="src">' + go("echeancier", "", "Voir l'échéancier complet") + '</p>';
  h += '<div class="grid2"><div>' + liq + '</div><div>' + te + '</div></div>' + pa + ta;
  return h;
}

/* ------------------------------------------------------------ Fonds */
function shFonds() {
  const i = st.i, f = R.fondsById[st.fonds];
  const car = [["Dénomination", f.nom, "Documentation du fonds"], ["Nature", f.nature, "Documentation du fonds"],
               ["Liquidité", f.liquidite, "Prospectus ou règlement, à confirmer"], ["Fréquence de VL", f.freq, "Documentation du fonds"],
               ["Devise de référence", f.devise, "Documentation du fonds"], ["Dernière VL", R.val(f.encours, "EUR m") + " au " + R.date(f.dateVl), "Valorisateur"]];
  const sf = R.statutFonds(f.id, i);
  let h = '<div class="band">Caractéristiques</div><div class="scroll"><table><thead><tr><th>Rubrique</th><th>Valeur</th><th>Source</th></tr></thead><tbody>' +
    car.map((r, k) => '<tr' + z(k) + '><td class="nw">' + r[0] + '</td><td>' + R.t(r[1]) + '</td><td class="src">' + R.esc(r[2]) + '</td></tr>').join("") +
    '<tr><td>Statut d\'ensemble au ' + arr() + '</td>' + tdS(sf, true) + '<td class="src">Calcul</td></tr></tbody></table></div>';

  const cols = D.meta.arretes.map((a, k) => '<th class="n' + (k === st.i ? ' cur' : '') + '">' + R.dateCourte(a) + '</th>').join("");
  let k = 0;
  const rows = D.domaines.map(d => {
    const l = R.indicateursDe(f.id, d.id);
    if (!l.length) return '<tr' + z(k++) + '><td class="cur">' + R.esc(d.nom) + '</td><td colspan="11" class="st-NA">Non applicable</td></tr>';
    return l.map((x, j) => { const m = R.marge(x, i);
      return '<tr' + z(k++) + '><td class="cur nw">' + (j === 0 ? R.esc(d.nom) : "") + '</td>' +
        '<td>' + go("indicateurs", ' data-ind="' + x.id + '"', R.t(x.lib)) + '</td><td>' + R.esc(x.type) + '</td>' +
        D.meta.arretes.map((a, q) => '<td class="n' + (q === st.i ? ' cur' : '') + '">' + R.val(R.valeur(x, q), x.u) + '</td>').join("") +
        '<td class="n">' + seuil(x, "al") + '</td><td class="n">' + seuil(x, "lim") + '</td><td class="n">' + (m === null ? "-" : R.signe(m, x.u)) + '</td>' +
        tdS(R.statut(x, i), true) + '</tr>'; }).join("");
  }).join("");
  h += '<div class="band">Indicateurs par domaine</div><div class="scroll"><table><thead><tr><th>Domaine</th><th>Indicateur</th><th>Type</th>' + cols +
    '<th class="n">Alerte</th><th class="n">Limite</th><th class="n">Marge</th><th>Statut</th></tr></thead><tbody>' + rows + '</tbody></table></div>' +
    '<p class="src">' + R.t("Colonne en gras : date d'arrêté sélectionnée. Marge : distance restante jusqu'à la limite, négative en cas de dépassement.") + '</p>';

  const acts = R.actionsOuvertes([f.id]).filter(a => a.f === f.id);
  h += '<div class="band">Actions du fonds</div><div class="scroll"><table><thead><tr><th>Échéance</th><th>Action</th><th>Responsable</th><th>Priorité</th><th>Statut</th></tr></thead><tbody>' +
    (acts.length ? acts.map((a, q) => '<tr' + z(q) + '><td class="nw">' + R.date(a.ech) + '</td><td>' + R.t(a.objet) + '</td><td>' + R.esc(a.resp) + '</td>' +
      '<td class="nw' + (a.prio === "Haute" ? ' st-SURV' : '') + '">' + R.esc(a.prio) + '</td><td class="nw">' + R.esc(a.statut) + '</td></tr>').join("") :
      '<tr><td colspan="5" class="src">Aucune action ouverte.</td></tr>') + '</tbody></table></div>';
  return h;
}

/* ------------------------------------------------------------ Liquidité */
function shLiquidite() {
  const id = st.fonds, cfg = liqCfg(id), f = R.fondsById[id];
  let h = '<div class="band">Données <span class="hint">- ' + R.esc(f.nom) + '</span></div><div class="scroll"><table><thead><tr><th>Paramètre</th><th class="n">Valeur</th><th>Unité</th><th>Source</th></tr></thead><tbody>' +
    cfg.params.map((p, k) => '<tr' + z(k) + '><td>' + R.esc(p.lib) + '</td><td class="n"><input class="in num" type="number" step="0.1" id="p-' + id + '-' + p.k +
      '" data-p="' + k + '" value="' + p.v + '" aria-label="' + R.esc(p.lib) + '"></td><td class="src">' + R.esc(p.u) + '</td><td class="src">' + R.t(p.src) + '</td></tr>').join("") +
    '</tbody></table></div>';
  h += '<div class="band">Calibrage des scénarios</div><div class="scroll"><table><thead><tr><th>Hypothèse</th>' + R.SCENARIOS.map(s => '<th class="n">' + s.lib + '</th>').join("") +
    '<th>Unité</th><th>Source</th></tr></thead><tbody>' +
    cfg.scen.map((p, k) => '<tr' + z(k) + '><td>' + R.esc(p.lib) + '</td>' + R.SCENARIOS.map(s => '<td class="n"><input class="in num" type="number" step="0.1" id="s-' + id + '-' + p.k + '-' + s.k +
      '" data-s="' + k + '|' + s.k + '" value="' + p.v[s.k] + '" aria-label="' + R.esc(p.lib + ", " + s.lib) + '"></td>').join("") +
      '<td class="src">' + R.esc(p.u) + '</td><td class="src">' + R.t(p.src) + '</td></tr>').join("") + '</tbody></table></div>' +
    '<p class="src">Cellules crème&nbsp;: saisie. Le calcul se met à jour à chaque modification. <button type="button" class="lnk" id="reset">Rétablir les valeurs de démonstration</button></p>';
  h += '<div class="grid2"><div><div class="band">Calcul <span class="hint">- EUR m</span></div><div class="scroll" id="calc"></div></div>' +
    '<div><div class="band">Résultats</div><div class="scroll" id="res"></div></div></div>';
  h += '<div class="band">Hypothèses clés et limites</div><ul class="notes">' + D.hypothesesLiquidite.map(x => '<li>' + R.t(x) + '</li>').join("") + '</ul>';
  return h;
}

function majLiquidite() {
  const cfg = liqCfg(st.fonds), res = {};
  R.SCENARIOS.forEach(s => { res[s.k] = R.liquidite(cfg, s.k); });
  const eur = v => R.nombre(v, 1);
  const sg = v => (v > 0.05 ? "+" : v < -0.05 ? "-" : "") + R.nombre(Math.abs(v), 1);
  const lignes = cfg.type === "ouvert" ? [
    ["Rachats demandés", r => eur(r.demande)], ["Rachats servis après gate", r => eur(r.servis)], ["Rachats différés", r => eur(r.differes)],
    ["Appels des fonds cibles", r => eur(r.appels)], ["Besoins de liquidité", r => eur(r.besoins), true], ["Ressources liquides", r => eur(r.ressources), true],
    ["Solde", r => sg(r.solde), true]
  ] : [
    ["Appels de capitaux programmés", r => eur(r.appels)], ["Défaut des investisseurs", r => eur(r.defautMontant)], ["Appels encaissés", r => eur(r.encaisses)],
    ["Trésorerie disponible", r => eur(r.treso)], ["Ligne relais disponible", r => eur(r.ligne)], ["Ressources", r => eur(r.ressources), true],
    ["Décaissements prévus", r => eur(r.besoins), true], ["Solde", r => sg(r.solde), true]
  ];
  $("calc").innerHTML = '<table><thead><tr><th>Ligne</th>' + R.SCENARIOS.map(s => '<th class="n">' + s.lib + '</th>').join("") + '</tr></thead><tbody>' +
    lignes.map((l, k) => '<tr' + z(k) + '><td' + (l[2] ? ' class="cur"' : '') + '>' + l[0] + '</td>' +
      R.SCENARIOS.map(s => '<td class="n' + (l[2] ? ' cur' : '') + '">' + l[1](res[s.k]) + '</td>').join("") + '</tr>').join("") + '</tbody></table>';
  const rv = R.reverse(cfg);
  const premier = R.SCENARIOS.find(s => res[s.k].couverture !== null && res[s.k].couverture < 1);
  $("res").innerHTML = '<table><thead><tr><th>Résultat</th>' + R.SCENARIOS.map(s => '<th class="n">' + s.lib + '</th>').join("") + '</tr></thead><tbody>' +
    '<tr><td>Couverture</td>' + R.SCENARIOS.map(s => '<td class="n key">' + R.val(res[s.k].couverture, "x") + '</td>').join("") + '</tr>' +
    '<tr class="z"><td>Seuil de couverture</td>' + R.SCENARIOS.map(() => '<td class="n">1,00x</td>').join("") + '</tr>' +
    '<tr><td>Reverse stress test</td><td colspan="3" class="key">' + R.t(rv.type === "ouvert" ? R.val(rv.rmax, "% VL") + " de rachats par fenêtre" : R.val(rv.dmax, "%") + " de défaut des investisseurs") + '</td></tr>' +
    '</tbody></table><p class="src">' + R.t(rv.texte) + ' ' + R.t(premier ? "La couverture passe sous 1,00x dès le scénario " + premier.lib.toLowerCase() + "." : "La couverture reste au-dessus de 1,00x dans les trois scénarios.") + '</p>';
}

/* ------------------------------------------------------------ Indicateurs */
function shIndicateurs() {
  const i = st.i, F = st.filtre;
  const opt = (v, cur, lib) => '<option value="' + v + '"' + (v === cur ? " selected" : "") + '>' + R.esc(lib) + '</option>';
  const l = D.indicateurs.filter(x => (!F.fonds || x.f === F.fonds) && (!F.dom || x.d === F.dom) && (!F.statut || R.statut(x, i) === F.statut) && (!F.type || x.type === F.type));
  if (!st.sel || !l.some(x => x.id === st.sel)) st.sel = l.length ? l[0].id : null;
  let h = '<div class="ctl">' +
    '<label for="fF">Fonds</label><select class="in" id="fF" data-f="fonds">' + opt("", F.fonds, "Tous") + D.fonds.map(f => opt(f.id, F.fonds, f.court)).join("") + '</select>' +
    '<label for="fD">Domaine</label><select class="in" id="fD" data-f="dom">' + opt("", F.dom, "Tous") + D.domaines.map(d => opt(d.id, F.dom, d.nom)).join("") + '</select>' +
    '<label for="fS">Statut</label><select class="in" id="fS" data-f="statut">' + opt("", F.statut, "Tous") + R.ORDRE_STATUTS.map(c => opt(c, F.statut, R.STATUTS[c].lib)).join("") + '</select>' +
    '<label for="fT">Type</label><select class="in" id="fT" data-f="type">' + opt("", F.type, "Tous") + opt("KRI", F.type, "KRI") + opt("Limite", F.type, "Limite") + '</select></div>';
  h += '<div class="band">Registre des indicateurs <span class="hint">(' + l.length + ' sur ' + D.indicateurs.length + ')</span></div><div class="scroll"><table><thead><tr>' +
    '<th>Identifiant</th><th>Fonds</th><th>Domaine</th><th>Indicateur</th><th>Type</th><th class="n">Valeur</th><th class="n">Alerte</th><th class="n">Limite</th><th class="n">Marge</th><th>Tendance</th><th>Statut</th></tr></thead><tbody>' +
    (l.length ? l.map((x, k) => { const m = R.marge(x, i);
      return '<tr class="' + (k % 2 ? "z" : "") + (x.id === st.sel ? " sel" : "") + '"><td class="nw"><button type="button" class="lnk" data-pick="' + x.id + '">' + x.id + '</button></td>' +
        '<td class="nw">' + R.esc(R.fondsById[x.f].court) + '</td><td class="nw">' + R.esc(R.domById[x.d].nom) + '</td><td>' + R.t(x.lib) + '</td><td>' + x.type + '</td>' +
        '<td class="n">' + R.val(R.valeur(x, i), x.u) + '</td><td class="n">' + seuil(x, "al") + '</td><td class="n">' + seuil(x, "lim") + '</td>' +
        '<td class="n">' + (m === null ? "-" : R.signe(m, x.u)) + '</td><td class="nw">' + R.esc(R.tendance(x, i).lib) + '</td>' + tdS(R.statut(x, i), true) + '</tr>'; }).join("") :
      '<tr><td colspan="11" class="src">Aucun indicateur ne correspond aux filtres.</td></tr>') + '</tbody></table></div>';
  h += '<div id="detail">' + detail() + '</div>';
  return h;
}

function detail() {
  if (!st.sel) return "";
  const x = R.indById[st.sel], i = st.i, a = x.act ? R.actById[x.act] : null;
  const hist = '<table><thead><tr><th>Arrêté</th><th class="n">Valeur</th><th>Statut</th></tr></thead><tbody>' +
    D.meta.arretes.map((d, k) => '<tr' + z(k) + '><td class="nw' + (k === i ? ' cur' : '') + '">' + R.date(d) + '</td><td class="n' + (k === i ? ' cur' : '') + '">' +
      R.val(R.valeur(x, k), x.u) + '</td>' + tdS(R.statut(x, k), true) + '</tr>').join("") + '</tbody></table>';
  const rows = [["Identifiant", x.id], ["Indicateur", x.lib], ["Définition", x.def], ["Fonds", R.fondsById[x.f].nom], ["Domaine", R.domById[x.d].nom],
    ["Type et nature", x.type + ", " + x.nat.toLowerCase()], ["Sens", x.sens === "max" ? "Plafond" : "Plancher"],
    ["Seuil d'alerte", seuil(x, "al")], ["Limite", x.lim === null ? "Aucune" : seuil(x, "lim")], ["Source", x.src], ["Référence", x.ref]];
  if (x.com) rows.push(["Commentaire", x.com]);
  if (a) rows.push(["Action liée", a.objet + " (" + a.resp + ", échéance le " + R.date(a.ech) + ")"]);
  return '<div class="band">Détail de l\'indicateur <span class="hint">- ' + x.id + '</span></div><div class="grid2"><div class="scroll"><table><thead><tr><th>Rubrique</th><th>Valeur</th></tr></thead><tbody>' +
    rows.map((r, k) => '<tr' + z(k) + '><td class="nw">' + r[0] + '</td><td>' + R.t(r[1]) + '</td></tr>').join("") +
    '<tr><td>Statut au ' + arr() + '</td>' + tdS(R.statut(x, i), true) + '</tr></tbody></table></div>' +
    '<div class="scroll">' + hist + '</div></div>';
}

/* ------------------------------------------------------------ Échéancier, Pipeline, Studios */
function shEcheancier() {
  let mois = "", k = 0;
  const rows = D.echeances.map(e => {
    let g = "";
    const m = R.moisAnnee(e.date);
    if (m !== mois) { mois = m; k = 0; g = '<tr class="grp"><td colspan="6">' + m.charAt(0).toUpperCase() + m.slice(1) + '</td></tr>'; }
    return g + '<tr' + z(k++) + '><td class="nw">' + R.date(e.date) + '</td><td class="nw src">' + R.esc(R.delai(e.date)) + '</td><td>' + R.t(e.objet) + '</td>' +
      '<td>' + R.esc(e.f.map(x => R.fondsById[x].court).join(", ")) + '</td><td class="src">' + R.t(e.ref) + '</td>' +
      '<td class="nw' + (e.statut === "À risque" || e.statut === "Non lancé" ? ' st-SURV' : '') + '">' + R.esc(e.statut) + '</td></tr>';
  }).join("");
  return '<div class="band">Échéancier réglementaire et interne</div><div class="scroll"><table><thead><tr><th>Date</th><th>Délai</th><th>Objet</th><th>Fonds</th><th>Référence</th><th>Statut</th></tr></thead><tbody>' +
    rows + '</tbody></table></div>';
}

function shPipeline() {
  const bloc = (titre, l) => '<div class="band">' + titre + '</div><div class="scroll"><table><thead><tr><th>Dossier</th><th>Nature</th><th>Étape en cours</th><th class="n">Avancement</th>' +
    '<th>Prochaine étape</th><th>Échéance</th><th>Point d\'attention</th><th>Lien</th></tr></thead><tbody>' +
    l.map((p, k) => '<tr' + z(k) + '><td>' + R.esc(p.nom) + '</td><td class="nw">' + R.esc(p.nature) + '</td><td>' + R.esc(p.etapes[p.cur]) + '</td>' +
      '<td class="n">' + (p.cur + 1) + ' sur ' + p.etapes.length + '</td><td>' + R.esc(p.prochaine) + '</td><td class="nw">' + R.date(p.ech) + '</td>' +
      '<td>' + R.t(p.point) + '</td><td class="nw">' + (p.url ? '<a href="' + p.url + '" target="_blank" rel="noopener">Ouvrir</a>' : '<span class="src">-</span>') + '</td></tr>').join("") +
    '</tbody></table></div>';
  return bloc("Onboarding", D.pipeline.filter(p => p.nature === "Onboarding")) +
    bloc("Due diligence et Initial Risk Profile", D.pipeline.filter(p => p.nature !== "Onboarding"));
}

function shStudios() {
  return '<div class="band">Studios de la fonction de gestion des risques</div><div class="scroll"><table><thead><tr><th>Studio</th><th>Objet</th><th>État</th><th>Lien</th></tr></thead><tbody>' +
    D.studios.map((s, k) => '<tr' + z(k) + '><td class="nw cur">' + R.esc(s.nom) + '</td><td>' + R.esc(s.objet) + '</td><td class="nw' + (s.etat === "En service" ? '' : ' src') + '">' + R.esc(s.etat) + '</td>' +
      '<td class="nw">' + (s.url ? '<a href="' + s.url + '" target="_blank" rel="noopener">Ouvrir</a>' : '<span class="src">-</span>') + '</td></tr>').join("") +
    '</tbody></table></div>';
}

/* ------------------------------------------------------------ rendu et événements */
const RENDU = { dashboard: shDashboard, fonds: shFonds, liquidite: shLiquidite, indicateurs: shIndicateurs,
                echeancier: shEcheancier, pipeline: shPipeline, studios: shStudios };

function rendu() {
  cadre();
  $("sheet").setAttribute("aria-labelledby", "tab-" + st.sheet);
  $("sheet").innerHTML = RENDU[st.sheet]();
  if (st.sheet === "liquidite") majLiquidite();
}

function ouvrir(sheet) {
  st.sheet = sheet;
  try { history.replaceState(null, "", "#" + sheet); } catch (e) {}
  rendu();
  window.scrollTo(0, 0);
}

$("tabs").addEventListener("click", e => { const b = e.target.closest("[data-sheet]"); if (b) ouvrir(b.dataset.sheet); });
$("tabs").addEventListener("keydown", e => {
  if (e.key !== "ArrowRight" && e.key !== "ArrowLeft") return;
  const k = SHEETS.findIndex(s => s[0] === st.sheet), n = (k + (e.key === "ArrowRight" ? 1 : SHEETS.length - 1)) % SHEETS.length;
  ouvrir(SHEETS[n][0]); $("tab-" + SHEETS[n][0]).focus();
});
$("arrete").addEventListener("change", e => { st.i = Number(e.target.value); rendu(); });
$("fonds").addEventListener("change", e => { st.fonds = e.target.value; rendu(); });

$("sheet").addEventListener("click", e => {
  const g = e.target.closest("[data-go]");
  if (g) {
    if (g.dataset.fonds) st.fonds = g.dataset.fonds;
    if (g.dataset.ind) { st.filtre = { fonds: "", dom: "", statut: "", type: "" }; st.sel = g.dataset.ind; }
    ouvrir(g.dataset.go);
    if (g.dataset.ind) { const d = $("detail"); if (d) d.scrollIntoView({ block: "start" }); }
    return;
  }
  const p = e.target.closest("[data-pick]");
  if (p) { st.sel = p.dataset.pick; rendu(); const d = $("detail"); if (d) d.scrollIntoView({ block: "nearest" }); return; }
  if (e.target.id === "reset") { delete st.liq[st.fonds]; rendu(); }
});
$("sheet").addEventListener("change", e => {
  const f = e.target.closest("select[data-f]");
  if (f) { st.filtre[f.dataset.f] = f.value; rendu(); const el = $(f.id); if (el) el.focus(); }
});
$("sheet").addEventListener("input", e => {
  const el = e.target, cfg = liqCfg(st.fonds);
  if (el.dataset.p !== undefined) cfg.params[Number(el.dataset.p)].v = el.value === "" ? 0 : Number(el.value);
  else if (el.dataset.s !== undefined) { const q = el.dataset.s.split("|"); cfg.scen[Number(q[0])].v[q[1]] = el.value === "" ? 0 : Number(el.value); }
  else return;
  majLiquidite();
});

const h0 = (location.hash || "").slice(1);
if (RENDU[h0]) st.sheet = h0;
R.theme($("theme"));
rendu();
})();
</script>
</body>
</html>
