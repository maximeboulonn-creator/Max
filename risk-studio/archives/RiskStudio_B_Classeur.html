<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Risk Studio Classeur</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Carlito:ital,wght@0,400;0,700;1,400&display=swap">
<style>
/* Proposition B - le classeur. Reprend la charte des classeurs Excel Fundcraft :
   onglets, contenu en B2, bandeau de bloc #2F4858, en-têtes #218E8E, résultat clé
   sur lime, saisie sur crème, sources en gris, filet bas de ligne #E0E0E0.
   Ni quadrillage, ni volet figé. */
:root {
  --bg: #FFFFFF;
  --ink: #1A2027;
  --muted: #5A6B72;
  --rule: #E0E0E0;
  --band: #2F4858;
  --band-ink: #FFFFFF;
  --head: #218E8E;
  --head-ink: #FFFFFF;
  --link: #218E8E;
  --lime: #D9F785;
  --on-lime: #1A2027;
  --cream: #FFF8F2;
  --alt: #EBFCF9;
  --tab: #EEF2F3;
  --tab-ink: #2F4858;
  --font: Calibri, Carlito, "Segoe UI", Arial, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #151B1F; --ink: #E4EAEC; --muted: #9AA8AE; --rule: #2C363C; --band: #2F4858; --band-ink: #FFFFFF;
    --head: #1D7272; --head-ink: #FFFFFF; --link: #5CC3C3; --cream: #2A2520; --alt: #182529;
    --tab: #1D2529; --tab-ink: #C9D6DC; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #151B1F; --ink: #E4EAEC; --muted: #9AA8AE; --rule: #2C363C; --band: #2F4858; --band-ink: #FFFFFF;
  --head: #1D7272; --head-ink: #FFFFFF; --link: #5CC3C3; --cream: #2A2520; --alt: #182529;
  --tab: #1D2529; --tab-ink: #C9D6DC; color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 9pt; line-height: 1.4; }
[hidden] { display: none !important; }
button, select, input { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--link); outline-offset: 1px; }
a { color: var(--link); }

/* colonne A étroite, contenu en B2 */
.wb { max-width: 1320px; padding-inline: 24px; padding-block: 18px 56px; }
.b2 h1 { margin: 0; font-size: 12pt; font-weight: 700; }
.b2 .sub { margin: 1px 0 0; color: var(--muted); }

.ctl { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 20px; margin: 12px 0 8px; }
.ctl label { display: inline-flex; align-items: center; gap: 6px; color: var(--muted); }
.in { background: var(--cream); color: var(--ink); border: 1px solid var(--rule); border-radius: 0; padding: 1px 4px; }
input.in.num { width: 84px; text-align: right; font-variant-numeric: tabular-nums; }
.btn { background: transparent; border: 1px solid var(--rule); color: var(--ink); padding: 2px 10px; cursor: pointer; border-radius: 0; }
.btn:hover { border-color: var(--muted); }

.tabs { display: flex; flex-wrap: wrap; gap: 2px; border-bottom: 2px solid var(--band); }
.tab { background: var(--tab); color: var(--tab-ink); border: 0; border-radius: 0; padding: 4px 14px; cursor: pointer; }
.tab:hover { text-decoration: underline; }
.tab[aria-selected="true"] { background: var(--band); color: var(--band-ink); font-weight: 700; text-decoration: none; }

.band { background: var(--band); color: var(--band-ink); font-weight: 700; padding: 3px 8px; margin-top: 16px; }
.band .hint { font-weight: 400; opacity: .8; }
.scroll { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; }
th { background: var(--head); color: var(--head-ink); font-weight: 700; text-align: left; padding: 3px 8px; white-space: nowrap; vertical-align: bottom; }
td { padding: 3px 8px; border-bottom: 1px solid var(--rule); vertical-align: top; }
tr.z > td { background: var(--alt); }
tr.grp > td { font-weight: 700; background: var(--alt); }
.n { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
.nw { white-space: nowrap; }
.src { color: var(--muted); }
.cur { font-weight: 700; }
table td.key { background: var(--lime); color: var(--on-lime); font-weight: 700; }
table td.st-DEP, span.st-DEP { background: var(--lime); color: var(--on-lime); font-weight: 700; }
span.st-DEP { padding: 0 4px; }
.st-SURV { font-weight: 700; }
.st-MAN { color: var(--muted); font-style: italic; }
.st-NA { color: var(--muted); }
.lnk { background: none; border: 0; padding: 0; color: var(--link); text-decoration: underline; cursor: pointer; text-align: left; }
td > .lnk[data-ind] { min-width: 150px; }
tr.sel > td { box-shadow: inset 0 -1px 0 var(--link), inset 0 1px 0 var(--link); }

.kpi th, .kpi td { text-align: center; }
.kpi td { font-size: 12pt; padding-block: 5px; font-variant-numeric: tabular-nums; }
.grid2 { display: grid; grid-template-columns: minmax(0, 1.3fr) minmax(0, 1fr); gap: 0 24px; }
.grid2 > div { min-width: 0; }
.notes { margin: 6px 0 0; padding-left: 16px; color: var(--muted); max-width: 110ch; }
.notes li { margin-bottom: 2px; }
p.src { margin: 6px 0 0; max-width: 110ch; }
.foot { margin-top: 28px; color: var(--muted); }

@media (max-width: 900px) { .grid2 { grid-template-columns: 1fr; } }
@media (max-width: 600px) { .wb { padding-inline: 16px; } .tab { padding: 4px 9px; } }
@page { size: A4 landscape; margin: 10mm; }
@media print {
  .ctl, .tabs { display: none !important; }
  .scroll { overflow: visible; }
  .band, th, td.key, .st-DEP { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
}
</style>
</head>
<body>
<div class="wb">
  <div class="b2">
    <h1>Risk Studio</h1>
    <p class="sub" id="sub"></p>
  </div>
  <div class="ctl">
    <label for="arrete">Arrêté</label><select id="arrete" class="in"></select>
    <span id="ctlFonds"><label for="fonds">Fonds</label> <select id="fonds" class="in"></select></span>
    <button type="button" class="btn" id="theme">Thème&nbsp;: automatique</button>
  </div>
  <div class="tabs" role="tablist" id="tabs" aria-label="Onglets"></div>
  <div id="sheet" role="tabpanel"></div>
  <p class="foot" id="foot"></p>
</div>

const STATUTS = {
  DEP:  { lib: "Dépassement",       court: "Dépassement",  rang: 4 },
  MAN:  { lib: "Donnée manquante",  court: "Manquant",     rang: 3 },
  SURV: { lib: "Sous surveillance", court: "Surveillance", rang: 2 },
  OK:   { lib: "Conforme",          court: "Conforme",     rang: 1 },
  NA:   { lib: "Non applicable",    court: "n.a.",         rang: 0 }
};
const ORDRE_STATUTS = ["DEP", "MAN", "SURV", "OK"];
const MOIS = ["janvier", "février", "mars", "avril", "mai", "juin", "juillet", "août",
              "septembre", "octobre", "novembre", "décembre"];
const EPS = 1e-9;

const fondsById = {}; DATA.fonds.forEach(f => { fondsById[f.id] = f; });
const domById = {}; DATA.domaines.forEach(d => { domById[d.id] = d; });
const indById = {}; DATA.indicateurs.forEach(i => { indById[i.id] = i; });
const actById = {}; DATA.actions.forEach(a => { actById[a.id] = a; });
const pipeById = {}; DATA.pipeline.forEach(p => { pipeById[p.id] = p; });

function esc(s) {
  return String(s == null ? "" : s).replace(/&/g, "&amp;").replace(/</g, "&lt;")
    .replace(/>/g, "&gt;").replace(/"/g, "&quot;");
}
/* typographie française : espace insécable avant : ; ? ! % */
function fr(s) {
  return String(s == null ? "" : s).replace(/ ([:;?!%])/g, " $1");
}
function t(s) { return esc(fr(s)); }

function nombre(v, dec) {
  return new Intl.NumberFormat("fr-FR", { minimumFractionDigits: dec, maximumFractionDigits: dec }).format(v);
}
const DEC = { "%": 1, "x": 2, "pb": 0, "j": 0, "nb": 0, "EUR m": 1, "% VL": 1 };
function val(v, u) {
  if (v === null || v === undefined || isNaN(v)) return "n.d.";
  const d = DEC[u] !== undefined ? DEC[u] : 1;
  const n = nombre(v, d);
  if (u === "x") return n + "x";
  if (u === "nb") return n;
  if (u === "% VL") return n + " %";
  return n + " " + u;
}
function signe(v, u) {
  if (v === null || v === undefined || isNaN(v)) return "-";
  const s = val(Math.abs(v), u);
  if (Math.abs(v) < EPS) return s;
  return (v > 0 ? "+" : "-") + s;
}

function date(iso) { const p = iso.split("-"); return p[2] + "/" + p[1] + "/" + p[0]; }
function dateCourte(iso) { const p = iso.split("-"); return p[2] + "/" + p[1]; }
function dateLongue(iso) {
  const p = iso.split("-"); return Number(p[2]) + " " + MOIS[Number(p[1]) - 1] + " " + p[0];
}
function moisAnnee(iso) { const p = iso.split("-"); return MOIS[Number(p[1]) - 1] + " " + p[0]; }
function jours(a, b) { return Math.round((Date.parse(b) - Date.parse(a)) / 86400000); }
function delai(iso) {
  const n = jours(DATA.meta.aujourdhui, iso);
  if (n < 0) return "en retard de " + (-n) + " j";
  if (n === 0) return "aujourd'hui";
  return "dans " + n + " j";
}

/* ------------------------------------------------------------------ moteur */

function valeur(ind, i) { const v = ind.h[i]; return v === undefined ? null : v; }

function statut(ind, i) {
  const v = valeur(ind, i);
  if (v === null) return "MAN";
  if (ind.sens === "max") {
    if (ind.lim !== null && v > ind.lim + EPS) return "DEP";
    if (ind.al !== null && v >= ind.al - EPS) return "SURV";
    return "OK";
  }
  if (ind.lim !== null && v < ind.lim - EPS) return "DEP";
  if (ind.al !== null && v <= ind.al + EPS) return "SURV";
  return "OK";
}

/* marge restante avant la limite, dans l'unité de l'indicateur (négative = dépassement) */
function marge(ind, i) {
  const v = valeur(ind, i);
  if (v === null || ind.lim === null) return null;
  return ind.sens === "max" ? ind.lim - v : v - ind.lim;
}

function tendance(ind, i) {
  if (i === 0) return { code: "nd", lib: "n.d." };
  const a = valeur(ind, i - 1), b = valeur(ind, i);
  if (a === null || b === null) return { code: "nd", lib: "n.d." };
  if (Math.abs(b - a) < EPS) return { code: "stable", lib: "Stable" };
  const hausse = b > a;
  const degrade = ind.sens === "max" ? hausse : !hausse;
  return degrade ? { code: "deg", lib: "Dégradation" } : { code: "ame", lib: "Amélioration" };
}

function pire(codes) {
  let w = "NA";
  codes.forEach(c => { if (STATUTS[c].rang > STATUTS[w].rang) w = c; });
  return w;
}

function indicateursDe(f, d) {
  return DATA.indicateurs.filter(x => (!f || x.f === f) && (!d || x.d === d));
}

function statutDomaine(f, d, i) {
  const l = indicateursDe(f, d);
  if (!l.length) return "NA";
  return pire(l.map(x => statut(x, i)));
}

function statutFonds(f, i) { return pire(indicateursDe(f).map(x => statut(x, i))); }

function compte(i, perimetre) {
  const c = { DEP: 0, MAN: 0, SURV: 0, OK: 0, total: 0 };
  DATA.indicateurs.forEach(x => {
    if (perimetre && perimetre.indexOf(x.f) < 0) return;
    c[statut(x, i)] += 1; c.total += 1;
  });
  return c;
}

/* indicateurs hors statut conforme, du plus grave au moins grave */
function pointsAttention(i, perimetre) {
  return DATA.indicateurs
    .filter(x => (!perimetre || perimetre.indexOf(x.f) >= 0) && statut(x, i) !== "OK")
    .sort((a, b) => STATUTS[statut(b, i)].rang - STATUTS[statut(a, i)].rang
      || DATA.fonds.indexOf(fondsById[a.f]) - DATA.fonds.indexOf(fondsById[b.f]));
}

function actionsOuvertes(perimetre) {
  return DATA.actions
    .filter(a => !perimetre || !a.f || perimetre.indexOf(a.f) >= 0)
    .slice().sort((a, b) => a.ech < b.ech ? -1 : a.ech > b.ech ? 1 : 0);
}

function echeancesDans(nbJours, perimetre) {
  return DATA.echeances.filter(e => {
    const n = jours(DATA.meta.aujourdhui, e.date);
    if (n < 0 || n > nbJours) return false;
    return !perimetre || e.f.some(x => perimetre.indexOf(x) >= 0);
  });
}

function paramsMap(cfg) { const m = {}; cfg.params.forEach(p => { m[p.k] = Number(p.v) || 0; }); return m; }
function scenMap(cfg, s) { const m = {}; cfg.scen.forEach(p => { m[p.k] = Number(p.v[s]) || 0; }); return m; }

function liqOuvert(cfg, s) {
  const p = paramsMap(cfg), q = scenMap(cfg, s);
  const ressources = p.vl * (p.poche + p.obtenable) / 100 + p.credit;
  const demande = p.vl * q.rachats / 100;
  const servis = p.vl * Math.min(q.rachats, p.gate) / 100;
  const appels = p.vl * q.appels / 100;
  const besoins = servis + appels;
  return { ressources, demande, servis, differes: demande - servis, appels, besoins,
           solde: ressources - besoins, couverture: besoins > 0 ? ressources / besoins : null };
}

function liqFerme(cfg, s) {
  const p = paramsMap(cfg), q = scenMap(cfg, s);
  const encaisses = p.appels * (1 - q.defaut / 100);
  const ligne = p.ligne * q.maintien / 100;
  const ressources = p.treso + encaisses + ligne;
  return { appels: p.appels, defautMontant: p.appels - encaisses, encaisses, treso: p.treso, ligne,
           ressources, besoins: p.decaiss, solde: ressources - p.decaiss,
           couverture: p.decaiss > 0 ? ressources / p.decaiss : null };
}

function liquidite(cfg, s) { return cfg.type === "ouvert" ? liqOuvert(cfg, s) : liqFerme(cfg, s); }

/* reverse stress test : le niveau de choc qui ramène la couverture à 1,00x */
function reverse(cfg) {
  const p = paramsMap(cfg);
  if (cfg.type === "ouvert") {
    const q = scenMap(cfg, "base");
    const ressources = p.vl * (p.poche + p.obtenable) / 100 + p.credit;
    const rmax = p.vl > 0 ? (ressources - p.vl * q.appels / 100) / p.vl * 100 : null;
    const gateProtege = rmax !== null && rmax >= p.gate;
    return {
      type: "ouvert", rmax, gate: p.gate, gateProtege,
      texte: rmax === null ? "Données insuffisantes." :
        rmax < 0 ? "Les ressources ne couvrent pas les seuls appels des fonds cibles du scénario de base, avant tout rachat." :
        "Les ressources couvrent au plus " + val(rmax, "% VL") + " de rachats par fenêtre, après les appels du scénario de base. " +
        (gateProtege ? "La gate (" + val(p.gate, "% VL") + ") s'applique avant l'épuisement des ressources." :
                       "Ce niveau est inférieur à la gate (" + val(p.gate, "% VL") + ") : le Fonds ne peut pas servir une fenêtre pleine sans cession ni financement.")
    };
  }
  const dmax = p.appels > 0 ? (1 - (p.decaiss - p.treso - p.ligne) / p.appels) * 100 : null;
  const dmaxSans = p.appels > 0 ? (1 - (p.decaiss - p.treso) / p.appels) * 100 : null;
  const borne = x => x === null ? "n.d." : x <= 0 ? "aucun défaut" : x >= 100 ? "plus de 100 %" : val(x, "%");
  return {
    type: "ferme", dmax, dmaxSans,
    texte: "Défaut des investisseurs supportable avant que la couverture ne tombe sous 1,00x : " + borne(dmax) +
      " avec la ligne relais, " + borne(dmaxSans) + " sans la ligne relais."
  };
}

function theme(btn) {
  const libs = { auto: "automatique", light: "clair", dark: "sombre" };
  let cur = "auto";
  try { const s = localStorage.getItem("riskstudio_theme"); if (s === "light" || s === "dark") cur = s; } catch (e) {}
  function apply() {
    if (cur === "auto") document.documentElement.removeAttribute("data-theme");
    else document.documentElement.setAttribute("data-theme", cur);
    if (btn) btn.textContent = "Thème : " + libs[cur];
  }
  apply();
  if (btn) btn.addEventListener("click", () => {
    cur = cur === "auto" ? "light" : cur === "light" ? "dark" : "auto";
    try { localStorage.setItem("riskstudio_theme", cur); } catch (e) {}
    apply();
  });
}

    '<label for="fS">Statut</label><select class="in" id="fS" data-f="statut">' + opt("", F.statut, "Tous") + R.ORDRE_STATUTS.map(c => opt(c, F.statut, R.STATUTS[c].lib)).join("") + '</select>' +
    '<label for="fT">Type</label><select class="in" id="fT" data-f="type">' + opt("", F.type, "Tous") + opt("KRI", F.type, "KRI") + opt("Limite", F.type, "Limite") + '</select></div>';
  h += '<div class="band">Registre des indicateurs <span class="hint">(' + l.length + ' sur ' + D.indicateurs.length + ')</span></div><div class="scroll"><table><thead><tr>' +
    '<th>Identifiant</th><th>Fonds</th><th>Domaine</th><th>Indicateur</th><th>Type</th><th class="n">Valeur</th><th class="n">Alerte</th><th class="n">Limite</th><th class="n">Marge</th><th>Tendance</th><th>Statut</th></tr></thead><tbody>' +
    (l.length ? l.map((x, k) => { const m = R.marge(x, i);
      return '<tr class="' + (k % 2 ? "z" : "") + (x.id === st.sel ? " sel" : "") + '"><td class="nw"><button type="button" class="lnk" data-pick="' + x.id + '">' + x.id + '</button></td>' +
        '<td class="nw">' + R.esc(R.fondsById[x.f].court) + '</td><td class="nw">' + R.esc(R.domById[x.d].nom) + '</td><td>' + R.t(x.lib) + '</td><td>' + x.type + '</td>' +
        '<td class="n">' + R.val(R.valeur(x, i), x.u) + '</td><td class="n">' + seuil(x, "al") + '</td><td class="n">' + seuil(x, "lim") + '</td>' +
        '<td class="n">' + (m === null ? "-" : R.signe(m, x.u)) + '</td><td class="nw">' + R.esc(R.tendance(x, i).lib) + '</td>' + tdS(R.statut(x, i), true) + '</tr>'; }).join("") :
      '<tr><td colspan="11" class="src">Aucun indicateur ne correspond aux filtres.</td></tr>') + '</tbody></table></div>';
  h += '<div id="detail">' + detail() + '</div>';
  return h;
}

function detail() {
  if (!st.sel) return "";
  const x = R.indById[st.sel], i = st.i, a = x.act ? R.actById[x.act] : null;
  const hist = '<table><thead><tr><th>Arrêté</th><th class="n">Valeur</th><th>Statut</th></tr></thead><tbody>' +
    D.meta.arretes.map((d, k) => '<tr' + z(k) + '><td class="nw' + (k === i ? ' cur' : '') + '">' + R.date(d) + '</td><td class="n' + (k === i ? ' cur' : '') + '">' +
      R.val(R.valeur(x, k), x.u) + '</td>' + tdS(R.statut(x, k), true) + '</tr>').join("") + '</tbody></table>';
  const rows = [["Identifiant", x.id], ["Indicateur", x.lib], ["Définition", x.def], ["Fonds", R.fondsById[x.f].nom], ["Domaine", R.domById[x.d].nom],
    ["Type et nature", x.type + ", " + x.nat.toLowerCase()], ["Sens", x.sens === "max" ? "Plafond" : "Plancher"],
    ["Seuil d'alerte", seuil(x, "al")], ["Limite", x.lim === null ? "Aucune" : seuil(x, "lim")], ["Source", x.src], ["Référence", x.ref]];
  if (x.com) rows.push(["Commentaire", x.com]);
  if (a) rows.push(["Action liée", a.objet + " (" + a.resp + ", échéance le " + R.date(a.ech) + ")"]);
  return '<div class="band">Détail de l\'indicateur <span class="hint">- ' + x.id + '</span></div><div class="grid2"><div class="scroll"><table><thead><tr><th>Rubrique</th><th>Valeur</th></tr></thead><tbody>' +
    rows.map((r, k) => '<tr' + z(k) + '><td class="nw">' + r[0] + '</td><td>' + R.t(r[1]) + '</td></tr>').join("") +
    '<tr><td>Statut au ' + arr() + '</td>' + tdS(R.statut(x, i), true) + '</tr></tbody></table></div>' +
    '<div class="scroll">' + hist + '</div></div>';
}

/* ------------------------------------------------------------ Échéancier, Pipeline, Studios */
function shEcheancier() {
  let mois = "", k = 0;
  const rows = D.echeances.map(e => {
    let g = "";
    const m = R.moisAnnee(e.date);
    if (m !== mois) { mois = m; k = 0; g = '<tr class="grp"><td colspan="6">' + m.charAt(0).toUpperCase() + m.slice(1) + '</td></tr>'; }
    return g + '<tr' + z(k++) + '><td class="nw">' + R.date(e.date) + '</td><td class="nw src">' + R.esc(R.delai(e.date)) + '</td><td>' + R.t(e.objet) + '</td>' +
      '<td>' + R.esc(e.f.map(x => R.fondsById[x].court).join(", ")) + '</td><td class="src">' + R.t(e.ref) + '</td>' +
      '<td class="nw' + (e.statut === "À risque" || e.statut === "Non lancé" ? ' st-SURV' : '') + '">' + R.esc(e.statut) + '</td></tr>';
  }).join("");
  return '<div class="band">Échéancier réglementaire et interne</div><div class="scroll"><table><thead><tr><th>Date</th><th>Délai</th><th>Objet</th><th>Fonds</th><th>Référence</th><th>Statut</th></tr></thead><tbody>' +
    rows + '</tbody></table></div>';
}

function shPipeline() {
  const bloc = (titre, l) => '<div class="band">' + titre + '</div><div class="scroll"><table><thead><tr><th>Dossier</th><th>Nature</th><th>Étape en cours</th><th class="n">Avancement</th>' +
    '<th>Prochaine étape</th><th>Échéance</th><th>Point d\'attention</th><th>Lien</th></tr></thead><tbody>' +
    l.map((p, k) => '<tr' + z(k) + '><td>' + R.esc(p.nom) + '</td><td class="nw">' + R.esc(p.nature) + '</td><td>' + R.esc(p.etapes[p.cur]) + '</td>' +
      '<td class="n">' + (p.cur + 1) + ' sur ' + p.etapes.length + '</td><td>' + R.esc(p.prochaine) + '</td><td class="nw">' + R.date(p.ech) + '</td>' +
      '<td>' + R.t(p.point) + '</td><td class="nw">' + (p.url ? '<a href="' + p.url + '" target="_blank" rel="noopener">Ouvrir</a>' : '<span class="src">-</span>') + '</td></tr>').join("") +
    '</tbody></table></div>';
  return bloc("Onboarding", D.pipeline.filter(p => p.nature === "Onboarding")) +
    bloc("Due diligence et Initial Risk Profile", D.pipeline.filter(p => p.nature !== "Onboarding"));
}

function shStudios() {
  return '<div class="band">Studios de la fonction de gestion des risques</div><div class="scroll"><table><thead><tr><th>Studio</th><th>Objet</th><th>État</th><th>Lien</th></tr></thead><tbody>' +
    D.studios.map((s, k) => '<tr' + z(k) + '><td class="nw cur">' + R.esc(s.nom) + '</td><td>' + R.esc(s.objet) + '</td><td class="nw' + (s.etat === "En service" ? '' : ' src') + '">' + R.esc(s.etat) + '</td>' +
      '<td class="nw">' + (s.url ? '<a href="' + s.url + '" target="_blank" rel="noopener">Ouvrir</a>' : '<span class="src">-</span>') + '</td></tr>').join("") +
    '</tbody></table></div>';
}

/* ------------------------------------------------------------ rendu et événements */
const RENDU = { dashboard: shDashboard, fonds: shFonds, liquidite: shLiquidite, indicateurs: shIndicateurs,
                echeancier: shEcheancier, pipeline: shPipeline, studios: shStudios };

function rendu() {
  cadre();
  $("sheet").setAttribute("aria-labelledby", "tab-" + st.sheet);
  $("sheet").innerHTML = RENDU[st.sheet]();
  if (st.sheet === "liquidite") majLiquidite();
}

function ouvrir(sheet) {
  st.sheet = sheet;
  try { history.replaceState(null, "", "#" + sheet); } catch (e) {}
  rendu();
  window.scrollTo(0, 0);
}

$("tabs").addEventListener("click", e => { const b = e.target.closest("[data-sheet]"); if (b) ouvrir(b.dataset.sheet); });
$("tabs").addEventListener("keydown", e => {
  if (e.key !== "ArrowRight" && e.key !== "ArrowLeft") return;
  const k = SHEETS.findIndex(s => s[0] === st.sheet), n = (k + (e.key === "ArrowRight" ? 1 : SHEETS.length - 1)) % SHEETS.length;
  ouvrir(SHEETS[n][0]); $("tab-" + SHEETS[n][0]).focus();
});
$("arrete").addEventListener("change", e => { st.i = Number(e.target.value); rendu(); });
$("fonds").addEventListener("change", e => { st.fonds = e.target.value; rendu(); });

$("sheet").addEventListener("click", e => {
  const g = e.target.closest("[data-go]");
  if (g) {
    if (g.dataset.fonds) st.fonds = g.dataset.fonds;
    if (g.dataset.ind) { st.filtre = { fonds: "", dom: "", statut: "", type: "" }; st.sel = g.dataset.ind; }
    ouvrir(g.dataset.go);
    if (g.dataset.ind) { const d = $("detail"); if (d) d.scrollIntoView({ block: "start" }); }
    return;
  }
  const p = e.target.closest("[data-pick]");
  if (p) { st.sel = p.dataset.pick; rendu(); const d = $("detail"); if (d) d.scrollIntoView({ block: "nearest" }); return; }
  if (e.target.id === "reset") { delete st.liq[st.fonds]; rendu(); }
});
$("sheet").addEventListener("change", e => {
  const f = e.target.closest("select[data-f]");
  if (f) { st.filtre[f.dataset.f] = f.value; rendu(); const el = $(f.id); if (el) el.focus(); }
});
$("sheet").addEventListener("input", e => {
  const el = e.target, cfg = liqCfg(st.fonds);
  if (el.dataset.p !== undefined) cfg.params[Number(el.dataset.p)].v = el.value === "" ? 0 : Number(el.value);
  else if (el.dataset.s !== undefined) { const q = el.dataset.s.split("|"); cfg.scen[Number(q[0])].v[q[1]] = el.value === "" ? 0 : Number(el.value); }
  else return;
  majLiquidite();
});

const h0 = (location.hash || "").slice(1);
if (RENDU[h0]) st.sheet = h0;
R.theme($("theme"));
rendu();
})();
</script>
</body>
</html>
